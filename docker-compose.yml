# محفظة الالتزام — تشغيل كامل بأمر واحد:  docker compose up --build   ثم افتح http://localhost:5173
# الخدمات: web (nginx) · api (Fastify + Chromium للـPDF) · postgres · mailhog (يلتقط البريد المرسل للتجربة)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iltizam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iltizam}
      POSTGRES_DB: iltizam
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iltizam -d iltizam"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: [ "8025:8025" ]        # واجهة صندوق الوارد التجريبي: http://localhost:8025
    # SMTP على mailhog:1025 داخل الشبكة

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      TZ: ${TZ:-Asia/Riyadh}
      DATABASE_URL: postgresql://iltizam:${POSTGRES_PASSWORD:-iltizam}@postgres:5432/iltizam
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-please}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-only-change-me-please}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      # Chromium داخل الخادم يطبع الواجهة نفسها إلى PDF عبر خدمة web
      PDF_RENDER_BASE_URL: http://web:5173
      # البريد: يُرسل من الخادم فقط. افتراضيًا إلى MailHog؛ غيّرها إلى SMTP حقيقي في .env
      MAIL_PROVIDER: ${MAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-محفظة الالتزام <no-reply@iltizam.local>}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
      GMAIL_SENDER: ${GMAIL_SENDER:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-az3919131@gmail.com}
      REPORT_MAX_ATTACH_MB: ${REPORT_MAX_ATTACH_MB:-15}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_DIR: /data/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      # كلمات المرور الأولية للمستخدمين الافتراضيين (ahmed/salem/hamad). غيّرها قبل أي استخدام حقيقي.
      SEED_ADMIN_USER: ${SEED_ADMIN_USER:-ahmed}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-Admin@12345}
      SEED_DEPT_PASSWORD: ${SEED_DEPT_PASSWORD:-Dept@12345}
      SEED_PM_PASSWORD: ${SEED_PM_PASSWORD:-Pm@12345}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    volumes: [ "storage:/data/storage" ]
    shm_size: "512m"

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    depends_on: [ api ]
    ports: [ "5173:5173" ]

volumes:
  pgdata:
  storage:
