# الواجهة على 5173، وكل /api يذهب إلى الخادم (نفس الأصل: كوكي الجلسة والـCORS بلا تعقيد)
server {
  listen 5173;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 64m;

  # رؤوس أمان. لا سكربتات مضمّنة في الواجهة؛ الأنماط المضمّنة (style=) مستخدمة في القوالب.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://server.arcgisonline.com; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
  }
  # ملاحظة: add_header داخل location يلغي رؤوس الخادم الموروثة، لذا نستعمل expires هنا
  location /assets/ { expires 1y; }
  # صفحة الـ Hero التعريفية: سكربت/نمط مضمّن وخطوط Google، فلها سياسة خاصة بها
  location = /hero.html {
    expires -1;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    try_files /hero.html =404;
  }
  location / { expires -1; try_files $uri /index.html; }
}
