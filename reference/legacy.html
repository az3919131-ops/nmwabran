<script>
"use strict";
/* ═══════════ استيراد الملفات: كل البيانات من الصفحة الماستر ═══════════ */
const FILEDATA = {};          // id → {sheets:[{name,rows}]}
let LASTSNAP = null;          // للتراجع عن آخر استيراد
let LASTREP = null;

/* ── قارئ xlsx يعمل بدون إنترنت (ZIP + inflate من المتصفح) ── */
async function unzipBuf(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let eo=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-66000);i--){ if(dv.getUint32(i,true)===0x06054b50){ eo=i; break; } }
  if(eo<0) throw new Error("ZIP");
  const n=dv.getUint16(eo+10,true); let p=dv.getUint32(eo+16,true);
  const out={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder().decode(u8.subarray(p+46,p+46+nlen));
    const lnlen=dv.getUint16(lho+26,true), lelen=dv.getUint16(lho+28,true), start=lho+30+lnlen+lelen;
    out[name]={method, data:u8.subarray(start,start+csize)};
    p+=46+nlen+elen+clen;
  }
  return out;
}
async function inflateEntry(f){
  if(!f) return null;
  if(f.method===0) return f.data;
  const st=new Blob([f.data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
const txt = u8 => new TextDecoder("utf-8").decode(u8);
function colOf(ref){ const m=/^([A-Z]+)/.exec(ref||""); if(!m) return 0; let n=0; for(const ch of m[1]) n=n*26+(ch.charCodeAt(0)-64); return n-1; }
async function readXlsx(buf){
  const z=await unzipBuf(buf), dp=new DOMParser();
  const wbx=dp.parseFromString(txt(await inflateEntry(z["xl/workbook.xml"])),"application/xml");
  const rels=dp.parseFromString(txt(await inflateEntry(z["xl/_rels/workbook.xml.rels"])),"application/xml");
  const relMap={}; [...rels.getElementsByTagName("Relationship")].forEach(r=>relMap[r.getAttribute("Id")]=r.getAttribute("Target").replace(/^\/?xl\//,""));
  let shared=[];
  if(z["xl/sharedStrings.xml"]){
    const sx=dp.parseFromString(txt(await inflateEntry(z["xl/sharedStrings.xml"])),"application/xml");
    shared=[...sx.getElementsByTagName("si")].map(si=>[...si.getElementsByTagName("t")].map(t=>t.textContent).join(""));
  }
  const sheets=[];
  for(const sh of [...wbx.getElementsByTagName("sheet")]){
    const rid=sh.getAttribute("r:id")||sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
    const target=relMap[rid]; if(!target||!z["xl/"+target]) continue;
    const sx=dp.parseFromString(txt(await inflateEntry(z["xl/"+target])),"application/xml");
    const rows=[];
    for(const r of [...sx.getElementsByTagName("row")]){
      const arr=[];
      for(const c of [...r.getElementsByTagName("c")]){
        const i=colOf(c.getAttribute("r")), t=c.getAttribute("t");
        let v=null;
        if(t==="inlineStr"){ v=[...c.getElementsByTagName("t")].map(x=>x.textContent).join(""); }
        else { const vn=c.getElementsByTagName("v")[0]; if(vn){ v = t==="s" ? (shared[+vn.textContent]||"") : (t==="str"||t==="e" ? vn.textContent : (isFinite(+vn.textContent)? +vn.textContent : vn.textContent)); } }
        arr[i]= v==null?"":v;
      }
      if(arr.length) rows.push(Array.from(arr, x=>x==null?"":x));
    }
    sheets.push({name:sh.getAttribute("name")||"Sheet", rows});
  }
  return sheets;
}
function readCsvText(s){
  const rows=[]; let row=[], cur="", q=false;
  s=s.replace(/^﻿/,"");
  for(let i=0;i<s.length;i++){
    const ch=s[i];
    if(q){ if(ch==='"'){ if(s[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===","||ch===";"){ row.push(cur); cur=""; }
    else if(ch==="\n"){ row.push(cur); rows.push(row.map(x=>isFinite(+x)&&x.trim()!==""?+x:x)); row=[]; cur=""; }
    else if(ch!=="\r") cur+=ch;
  }
  if(cur||row.length){ row.push(cur); rows.push(row.map(x=>isFinite(+x)&&x.trim()!==""?+x:x)); }
  return [{name:"CSV", rows}];
}

/* ── أدوات المطابقة ── */
const nz = s => String(s==null?"":s).replace(/[ً-ْ‏‎ ]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي")
  .replace(/ة/g,"ه").replace(/[^\p{L}\p{N}%]+/gu," ").trim().toLowerCase();
function normCode(c){
  let s=String(c==null?"":c).replace(/[^\d]/g,"");
  if(s.length===9 && s[0]==="9") s=s.slice(1);      // 908111005 → 08111005
  if(s.length===8 && s[0]==="0") s=s.slice(1);      // 08111005 → 8111005
  return s;
}
const isMatCode = c => /^8\d{6}$/.test(c) || /^85\d{5}$/.test(c);
const isWorkCode = c => /^[2-6]\d{8}$/.test(c);
function libMat(code){ return MATERIALS.find(m=>m.c===code); }
function libWork(code){ return WORKS.find(w=>w.c===code); }
function addLibMat(code, name, price){
  const m={c:code, ar:String(name||"مادة "+code).slice(0,90), en:String(name||"Material "+code).slice(0,90), u:"عدد", p:+price||0, k:"detail", g:"acc", added:true};
  MATERIALS.push(m); return m;
}
function addLibWork(code, name, price){
  const w={c:code, ar:String(name||"بند "+code).slice(0,110), en:String(name||"Item "+code).slice(0,110), u:"عدد", p:+price||0, g:"inst", added:true};
  WORKS.push(w); return w;
}
const num = v => { const n=typeof v==="number"?v:parseFloat(String(v).replace(/[^\d.\-]/g,"")); return isFinite(n)?n:null; };
/* ترويسة مركّبة: تُدمج حتى 3 صفوف فوق أول صف بيانات */
function composite(rows, firstData){
  const h=[];
  for(let r=Math.max(0,firstData-3); r<firstData; r++){
    (rows[r]||[]).forEach((c,i)=>{ const v=String(c||"").trim(); if(v) h[i]=(h[i]?h[i]+" ":"")+v; });
  }
  return h;
}
function findCol(hdr, ...pats){
  for(let i=0;i<hdr.length;i++){ const h=nz(hdr[i]); if(!h) continue;
    if(pats.some(p=> p instanceof RegExp ? p.test(h) : h.includes(nz(p)))) return i; }
  return -1;
}
/* أكثر عمود يحتوي قيمًا تحقق الشرط */
function bestCol(rows, test, min){
  const cnt={}; let w=0;
  rows.forEach(r=>r.forEach((c,i)=>{ if(test(c)){ cnt[i]=(cnt[i]||0)+1; w=Math.max(w,cnt[i]); } }));
  if(w < (min||3)) return {col:-1, count:w};
  const col=+Object.keys(cnt).find(k=>cnt[k]===w);
  return {col, count:w};
}
const isUnitId = v => /^R\s?-?\d{3,7}$/i.test(String(v==null?"":v).trim());
/* ترويسة عمود الوحدات — لا تُقبل «الوحدة» وحدها لأنها وحدة القياس في المقايسات */
const UNIT_HDR = /(rmu|ring\s?main|switch\s?gear|unit\s*(no|id|name|number)|رقم\s*الوحده|اسم\s*الوحده|رقم\s*المحطه|اسم\s*المحطه|وحده\s*حلقيه|رقم\s*الحلقه|رقم\s*المفتاح|الوحدات)/i;
const PROT_HINT = /(relay|setting|ground|ohm|feeder|ct ?ratio|gps|lat|المغذي|التاريض|التأريض|الحمايه|الاستلام|احداث|الاحداثيات|محول|كابل)/i;
/* عمود أرقام الوحدات: الصيغة المعتادة R101552 أولًا، وإلا عمود تحت ترويسة وحدات صريحة */
function unitCol(rows){
  const st = bestCol(rows, isUnitId);
  const strict = st.col>=0 ? {col:st.col, strict:true, hdr:-1, n:st.count} : null;
  let flex = null;
  const txt = rows.slice(0,60).flat().map(c=>nz(c)).join(" ");
  if(PROT_HINT.test(txt)){
    for(let r=0;r<Math.min(14, rows.length); r++){
      const row=rows[r]||[];
      for(let i=0;i<row.length;i++){
        if(!UNIT_HDR.test(nz(row[i])) || /\d/.test(String(row[i]))) continue;  // الترويسة نص بلا أرقام
        const vals=new Set();
        for(let k=r+1;k<rows.length;k++){
          const id=unitIdAt((rows[k]||[])[i], false);
          if(id) vals.add(id);
        }
        if(vals.size>=3 && (!flex || vals.size>flex.n)) flex={col:i, strict:false, hdr:r, n:vals.size};
      }
    }
  }
  // يُختار العمود الأغزر: ترقيم R101552 الصريح أو عمود تحت ترويسة وحدات صريحة
  if(strict && flex) return flex.n > strict.n ? flex : strict;
  return strict || flex || {col:-1, strict:false, hdr:-1, n:0};
}
/* رقم وحدة مقبول ضمن العمود المُتعرَّف عليه */
const unitIdAt = (v, strict) => {
  const s=String(v==null?"":v).trim();
  if(strict) return isUnitId(s) ? s.replace(/\s+/g,"").toUpperCase() : "";
  if(!s || s.length>20 || !/\d/.test(s)) return "";
  if(/[.,]/.test(s) && /^\d+[.,]\d+$/.test(s)) return "";           // كسور = كميات لا أرقام وحدات
  const id=s.replace(/\s+/g,"").toUpperCase();
  if(/^\d+$/.test(id)) return id.length>=4 ? "R"+id : "RMU-"+id;    // 017550 → R017550 · 7 → RMU-7
  return id;
};
const codeOf = v => { const k=normCode(v); if(k===normCode(P().wo)) return ""; return (isMatCode(k)||isWorkCode(k)) ? k : ""; };

/* ── تعرّف على نوع الورقة ── */
function sheetKind(sh){
  const rows=sh.rows; if(!rows.length) return null;
  if(unitCol(rows).col>=0) return "units";
  const h=rows.findIndex(r=>nz(r[0])==="البند");
  if(h>=0 && rows.some(r=>TALLY_LABELS[nz(r[0])])) return "tally";
  if(bestCol(rows, c=>!!codeOf(c), 5).col>=0) return "codes";
  return null;
}
const TALLY_LABELS = (()=>{ const m={}; SHEET_FIELDS.forEach(g=>g.f.forEach(f=>{ m[nz(f[1])]=f[0]; m[nz(f[2])]=f[0]; })); return m; })();

/* ── تعارض الإحداثيات بين ملفين لنفس الوحدة ── */
let GEOCONF = [];
function setUnitGps(q, lat, lon, src){
  const g=(+lat).toFixed(6)+","+(+lon).toFixed(6);
  if(!q.gps){ q.gps=g; q.gpsSrc=src||""; return true; }
  const m=String(q.gps).match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/); if(!m) { q.gps=g; q.gpsSrc=src||""; return true; }
  const d = Math.hypot((+m[1]-lat)*111.32, (+m[2]-lon)*111.32*Math.cos(lat*Math.PI/180));  // كم
  if(d>0.3 && !GEOCONF.some(c=>c.id===q.rmu && c.b===g)){
    GEOCONF.push({id:q.rmu, a:q.gps, aSrc:q.gpsSrc||"—", b:g, bSrc:src||"—", km:Math.round(d*10)/10});
  }
  return false;
}

/* ── جدول الوحدات: ضبط الحماية / الاستلام النهائي / أي جدول به أرقام RMU ── */
function impUnits(p, sh, rep){
  const rows=sh.rows, uc=unitCol(rows), idc=uc.col;
  if(idc<0) return;
  const ok = r => !!unitIdAt(r[idc], uc.strict);
  const data=rows.filter((r,i)=>(uc.hdr<0 || i>uc.hdr) && ok(r));
  const first=rows.findIndex((r,i)=>(uc.hdr<0 || i>uc.hdr) && ok(r));
  const hdr=composite(rows, first);
  const cF=findCol(hdr,"feeder","المغذي"), cT=findCol(hdr,"equipment type","rmu type",/\btype\b/),
        cTR=findCol(hdr,"tr number","tr-number",/\btr\b/), cRel=findCol(hdr,"relay","protection data"),
        cMan=findCol(hdr,"manufacturer"), cMod=findCol(hdr,"model"),
        cSet=findCol(hdr,"setting completed","setting"), cRat=findCol(hdr,"ct connected","ratio"),
        cOhm=findCol(hdr,"ground ohm","ground","ohm","التاريض");
  let n=0, add=0, gps=0, ohm=0;
  data.forEach(r=>{
    const id=unitIdAt(r[idc], uc.strict);
    let q=p.rmus.find(x=>String(x.rmu).replace(/\s+/g,"").toUpperCase()===id);
    if(!q){ q={no:0, feeder:"", rmu:id, type:"", tr:"", relay:"—", model:"—", set:false, ratio:"", ohm:"", gps:""}; p.rmus.push(q); add++; }
    const nums=r.map(num);
    const lat=nums.find(v=>v!==null&&v>=16&&v<=33&&String(v).includes(".")),
          lon=nums.find(v=>v!==null&&v>=34&&v<=56&&String(v).includes("."));
    if(lat&&lon){ if(setUnitGps(q, lat, lon, sh.name)) gps++; }
    else if(!q.gps && typeof cellPair==="function"){          // إحداثي كامل داخل خلية واحدة
      for(const c of r){ const pr=cellPair(c); if(pr){ if(setUnitGps(q, pr.lat, pr.lon, sh.name)) gps++; break; } }
    }
    if(cF>=0&&r[cF]) q.feeder=String(r[cF]).trim();
    if(cT>=0&&r[cT]){ const m=/([34])\s*w/i.exec(String(r[cT])); if(m) q.type=m[1]+"W"; }
    if(cTR>=0&&r[cTR]&&!/^ok$/i.test(String(r[cTR]))) q.tr=String(r[cTR]).trim();
    if(cMan>=0&&r[cMan]) q.model=String(r[cMan]).trim()+(cMod>=0&&r[cMod]?" "+String(r[cMod]).trim():"");
    if(cRel>=0&&r[cRel]&&/[A-Za-z]/.test(String(r[cRel]))) q.relay=String(r[cRel]).trim();
    if(cSet>=0&&/yes|نعم|تم/i.test(String(r[cSet]||""))) q.set=true;
    if(cRat>=0&&/\d+\s*\/\s*\d+/.test(String(r[cRat]||""))) q.ratio=String(r[cRat]).trim();
    if(cOhm>=0){ const o=num(r[cOhm]); if(o!==null&&o>0&&o<200){ q.ohm=String(o); ohm++; } }
    n++;
  });
  p.rmus.forEach((q,i)=>q.no=i+1);
  rep.push(["ok", T(`جدول الوحدات: ${n} وحدة (${add} جديدة)${gps?` · ${gps} بإحداثيات`:""}${ohm?` · ${ohm} بمقاومة تأريض`:""}`,
    `Unit schedule: ${n} units (${add} new)${gps?` · ${gps} with coordinates`:""}${ohm?` · ${ohm} with earth readings`:""}`)]);
}

/* ── جداول أرقام البنود: أمر التسليم / المقايسة / أي جدول كود+كمية ── */
function impCodes(p, sh, rep){
  const rows=sh.rows, cc=bestCol(rows, c=>!!codeOf(c), 5);
  if(cc.col<0) return;
  const ci=cc.col, data=rows.filter(r=>codeOf(r[ci]));
  const first=rows.findIndex(r=>codeOf(r[ci]));
  const hdr=composite(rows, first);
  const cQty=findCol(hdr,"كميه","الكميه",/\bqty\b/,"quantity"),
        cPrice=findCol(hdr,"سعر البند","سعر الوحده","price","rate"),
        cPlan=findCol(hdr,"المخطط","planned"), cExec=findCol(hdr,"المنفذ","executed"),
        cIss=findCol(hdr,"المصروف","issued"), cReq=findCol(hdr,"المطلوب","required");
  let cDesc=findCol(hdr,"وصف البند","الوصف","المواد","التركيبات","description","اسم الماده");
  if(cDesc<0){ const d=bestCol(data, c=>typeof c==="string"&&c.trim().length>=8); cDesc=d.col; }
  const mode = (cPlan>=0||cExec>=0||cIss>=0) ? "boq" : "qty";
  // عمود الكمية حين لا توجد ترويسة: العمود الرقمي ذو أكبر مجموع (لا سلاسل الحالة أو الأرقام الوظيفية)
  let qtyCol=cQty;
  if(mode==="qty" && qtyCol<0){
    const sum={}, cntc={};
    data.forEach(r=>r.forEach((c,i)=>{ if(i===ci||i===cPrice||i===cDesc) return; const v=num(c);
      if(v!==null && v>0 && v<1e7){ sum[i]=(sum[i]||0)+v; cntc[i]=(cntc[i]||0)+1; } }));
    const cand=Object.keys(sum).filter(i=>cntc[i]>=Math.max(3, data.length*0.3));
    if(cand.length) qtyCol=+cand.reduce((a,b)=>sum[a]>=sum[b]?a:b);
  }
  let mats=0, works=0, priced=0, added=[], zero=0, extra=0;
  data.forEach(r=>{
    const code=codeOf(r[ci]);
    const desc=cDesc>=0?String(r[cDesc]||"").trim():"";
    const price=cPrice>=0?num(r[cPrice]):null;
    const plan=cPlan>=0?num(r[cPlan]):(cIss>=0?num(r[cIss]):null);
    const exec=cExec>=0?num(r[cExec]):(cReq>=0?num(r[cReq]):null);
    let qty = qtyCol>=0 ? num(r[qtyCol]) : null;
    if(isMatCode(code)){
      let m=libMat(code); if(!m){ m=addLibMat(code, desc, price); added.push(code); }
      else if(desc && desc.length>6 && !m.added && /[A-Za-z]/.test(desc) && !nz(m.en).includes(nz(desc).slice(0,12))) m.en=desc.slice(0,90);
      if(price!==null && price>0){ m.p=price; priced++; }
      const b=p.mat[code]=p.mat[code]||{iss:0,req:0};
      if(mode==="boq"){
        if(plan!==null && plan>0){ b.iss=plan; if(exec!==null) b.req=exec; }
        else if(exec!==null && exec>0){ b.req=(+b.iss||0)+exec; extra++; }   // صف إضافة: المطلوب = المصروف + الفرق
      }
      else if(qty!==null){ b.iss=(+b.iss||0)+qty; b.req=Math.max(+b.req||0, b.iss); }
      else zero++;
      mats++;
    } else {
      let w=libWork(code); if(!w){ w=addLibWork(code, desc, price); added.push(code); }
      if(price!==null && price>0){ w.p=price; priced++; }
      const b=p.boq[code]=p.boq[code]||{plan:0,exec:0};
      if(mode==="boq"){ if(plan!==null) b.plan=plan; if(exec!==null) b.exec=exec; }
      else if(qty!==null){ b.plan=(+b.plan||0)+qty; }
      else zero++;
      works++;
    }
  });
  rep.push(["ok", T(`${mode==="boq"?"المقايسة":"الكميات"} من «${sh.name}»: ${mats} مادة و ${works} بند أجور${priced?` · ${priced} سعر محدّث`:""}`,
    `${mode==="boq"?"BOQ":"Quantities"} from “${sh.name}”: ${mats} materials, ${works} work items${priced?` · ${priced} prices updated`:""}`)]);
  if(added.length) rep.push(["new", T(`أُضيف ${added.length} بند جديد للمكتبة بمسمياته من الملف: `,`${added.length} new items added with their file names: `)+added.slice(0,8).join(" · ")+(added.length>8?" …":"")]);
  if(extra) rep.push(["new", T(`${extra} مادة صف إضافة — المطلوب = المصروف + فرق التنفيذ`, `${extra} materials as addition rows — required = issued + executed difference`)]);
  if(zero) rep.push(["skip", T(`${zero} بند بلا كمية واضحة — سُجّل بصفر`, `${zero} items with no clear quantity — recorded as zero`)]);
}
function impTally(p, sh, rep){
  const rows=sh.rows, h=rows.findIndex(r=>nz(r[0])==="البند"), hdr=rows[h]||[];
  const cols=[]; for(let i=1;i<hdr.length;i++){ const t=nz(hdr[i]); if(!t||t.includes(nz("الاجمالي"))||t.includes("total")) continue; cols.push({i, name:String(hdr[i]).trim()}); }
  if(!cols.length){ rep.push(["skip", T("قالب الحصر: لم يُعثر على أعمدة لوحات","Tally template: no sheet columns found")]); return; }
  const sheets=cols.map((c,i)=>{ const s=blankSheet(i+1); s.name=c.name; return s; });
  let n=0;
  rows.slice(h+1).forEach(r=>{
    const key=TALLY_LABELS[nz(r[0])]; if(!key) return;
    cols.forEach((c,ci)=>{ const v=num(r[c.i]); sheets[ci][key]= v===null?0:v; }); n++;
  });
  if(n){ p.sheets=sheets; p.derived=null;
    rep.push(["ok", T(`حصر اللوحات: ${cols.length} لوحة و ${n} حقل — استُبدل حصر المشروع`, `Sheet tally: ${cols.length} sheets, ${n} fields — project tally replaced`)]); }
}

/* ── تشغيل الاستيراد على ملف ── */
async function importFile(rec, sheets, silent){
  const p=P(), rep=[];
  if(!silent) LASTSNAP = JSON.stringify({projects:S.projects, active:S.active});
  let touched=0;
  sheets.forEach(sh=>{
    const k=sheetKind(sh);
    const live=sh.rows.filter(r=>r.some(c=>String(c).trim()!=="")).length;
    if(!k){ if(live>3) rep.push(["skip", T(`الورقة «${sh.name}»: ${live} صف لم يُتعرّف على تنسيقها`, `Sheet “${sh.name}”: ${live} rows, format not recognised`)]); return; }
    touched++;
    if(k==="units") impUnits(p, sh, rep);
    else if(k==="tally") impTally(p, sh, rep);
    else impCodes(p, sh, rep);
  });
  if(p.derived) p.derived=derive(p);
  rec.imported = touched>0; rec.rows = sheets.reduce((s,x)=>s+x.rows.length,0); rec.at = new Date().toISOString();
  rec.rep = rep;
  LASTREP = {file:rec.name, rep};
  save();
  return rep;
}
function undoImport(){
  if(!LASTSNAP){ toast(T("لا يوجد استيراد للتراجع عنه","Nothing to undo")); return; }
  const o=JSON.parse(LASTSNAP); S.projects=o.projects; S.active=o.active; LASTSNAP=null; LASTREP=null; save(); render();
  toast(T("تم التراجع عن آخر استيراد","Last import undone"));
}

    trIndoor: m("8569108"), pillars: q("309010102"),
    htCable: q("304010202") || m("8114005"), mvSingle: q("304010203") || m("8113009"),
    lt300: q("304010102") || m("8111007"), lt185: q("304010101") || m("8111006"), lt70: 0,
    htEarth: m("8111102"),
    saHT1:q("301010201"), asHT1:q("301010205"), saHT2:q("301010202"), asHT2:q("301010206"),
    saHT3:q("301010203"), asHT3:0, saHT4:q("301010204"), saLT13:q("301010101"), asLT13:q("301010103"), saLT4:q("301010102"),
    asphalt:q("306010002"), milling:q("306010004"), hdd:q("302020001"),
    joints:q("305020104"), term3x400:q("305020404"), lt300Term:q("305010302"), lt185Term:q("305010301"), lt70Term:0,
    riser400:0,
    poleSteel:q("201040003"), poleWood:q("201040006"), trPole1:q("205040101"), trPole2:q("205040102"),
    condMV:q("204020301"), abcLV:q("204010301"), riserRem:q("304040205"), lbsRem:q("205040206")
  });
  const filled=SHEET_FIELDS.reduce((a,g)=>a+g.f.filter(f=>+s[f[0]]>0).length,0);
  if(!filled){ toast(T("لا توجد بيانات مستوردة كافية للاشتقاق","Not enough imported data to back-fill")); return; }
  if(!silent) LASTSNAP=JSON.stringify({projects:S.projects, active:S.active});
  p.sheets=[s]; p.derived=derive(p); save();
  const lines=[["ok", T(`مُلئ ${filled} حقلًا في حصر اللوحات من كميات المقايسة والمواد والوحدات المستوردة`,

  if(silent===true && LASTREP) lines.forEach(l=>LASTREP.rep.push(l));
  else LASTREP={file:T("اشتقاق عكسي من البنود المستوردة","Back-fill from imported items"), rep:lines};
  if(silent!==true) render();
}

/* ── استقبال الملفات في الماستر ── */
async function intakeFiles(list){
  const p=P(), files=[...list].slice(0,14);
  if(!files.length) return;
  for(const f of files){
    const ext=(f.name.split(".").pop()||"").toLowerCase();
    const rec={id:"F"+Math.random().toString(36).slice(2,8), name:f.name, size:f.size, type:f.type||"", ext, url:"",
      kind: ["xlsx","xlsm","csv"].includes(ext)?"data" : (ext==="pdf"?"pdf":"img"), imported:false, rows:0, at:new Date().toISOString(), rep:[]};
    try{
      if(rec.kind==="data"){
        const sheets = ext==="csv" ? readCsvText(await f.text()) : await readXlsx(await f.arrayBuffer());
        FILEDATA[rec.id]=sheets;
        await importFile(rec, sheets);
      } else if(rec.kind==="img" && f.size<1.6e6){
        rec.url = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(""); r.readAsDataURL(f); });
      }
    }catch(e){ rec.rep=[["skip", T("تعذّرت قراءة الملف: ","Could not read the file: ")+(e.message||e)]]; }
    p.files.push(rec);
  }
  save(); render();
  const imported=files.filter((f,i)=>p.files.slice(-files.length)[i].imported).length;
  toast(imported? T(`تم استيراد بيانات ${imported} ملف إلى كل الصفحات`, `Data from ${imported} file(s) imported into every page`)
                : T("أُضيفت الملفات إلى السجل","Files added to the register"));
}

<script>
"use strict";
/* ═══════════ محرك المعالجة الذكية لكل أنواع الملفات ═══════════ */
const AI = {s:null, tried:false, limits:null, busy:false, notes:null, queue:[]};
async function aiGet(){
  if(AI.tried) return AI.s;
  AI.tried=true;
  try{
    AI.s = await (window.claude && window.claude.use ? window.claude.use("sample") : null);
    if(AI.s && AI.s.limits) { try{ AI.limits = await AI.s.limits(); }catch(e){} }
  }catch(e){ AI.s=null; }
  return AI.s;
}
function aiErr(e){
  const c=(e&&e.code)||"";
  if(c==="not_granted") return T("لم يُسمح باستخدام الذكاء الاصطناعي في هذه الصفحة","AI use was not allowed on this page");
  if(c==="rate_limited") return T("طلبات كثيرة — انتظر قليلًا ثم أعد المحاولة","Too many requests — wait a moment and retry");
  if(c==="invalid_json") return T("رد غير صالح — استُخدمت القراءة التقليدية","Invalid reply — fell back to the standard reader");
  return T("تعذّرت المعالجة الذكية: ","AI processing failed: ")+(c||(e&&e.message)||"");
}

/* ── قراءة docx ── */
async function readDocxText(buf){
  const z=await unzipBuf(buf), d=await inflateEntry(z["word/document.xml"]);
  if(!d) return "";
  const x=new DOMParser().parseFromString(txt(d),"application/xml");
  const out=[];
  [...x.getElementsByTagName("w:p")].forEach(p=>{
    const t=[...p.getElementsByTagName("w:t")].map(n=>n.textContent).join("");
    if(t.trim()) out.push(t.trim());
  });
  return out.join("\n");
}
/* ── استخراج نص من PDF (للملفات النصية؛ الممسوحة ضوئيًا تُعالَج بالذكاء) ── */
var readPdfText = async function(buf){
  const u8=new Uint8Array(buf), raw=new TextDecoder("latin1").decode(u8);
  let out="";
  const re=/stream\r?\n/g; let m;
  while((m=re.exec(raw))){
    const st=m.index+m[0].length, en=raw.indexOf("endstream", st);
    if(en<0) continue;
    let bytes=u8.subarray(st, en);
    let s="";
    try{
      const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
      s=new TextDecoder("latin1").decode(new Uint8Array(await new Response(ds).arrayBuffer()));
    }catch(e){ s=raw.slice(st,en); }
    if(!/T[Jj]/.test(s)) continue;
    s.replace(/\(((?:\\.|[^\\()])*)\)\s*Tj/g, (_,g)=>{ out+=g.replace(/\\([()\\])/g,"$1")+" "; return ""; });
    s.replace(/\[((?:[^\][]|\\.)*)\]\s*TJ/g, (_,g)=>{ g.replace(/\(((?:\\.|[^\\()])*)\)/g,(__,t)=>{ out+=t.replace(/\\([()\\])/g,"$1"); return ""; }); out+=" "; return ""; });
    re.lastIndex=en;
  }
  return out;
}
/* ── ملفات الإحداثيات ── */
function readGeoText(s, name){
  const pts=[];
  if(/<kml|<gpx/i.test(s)){
    const x=new DOMParser().parseFromString(s,"application/xml");
    [...x.getElementsByTagName("Placemark")].forEach(pm=>{
      const nm=(pm.getElementsByTagName("name")[0]||{}).textContent||"";
      [...pm.getElementsByTagName("coordinates")].forEach(c=>{
        c.textContent.trim().split(/\s+/).forEach((t,i)=>{
          const [lo,la]=t.split(",").map(Number);
          if(isFinite(la)&&isFinite(lo)) pts.push({id:(nm||name)+(i?"-"+(i+1):""), lat:la, lon:lo, src:name});
        });
      });
    });
    [...x.getElementsByTagName("wpt"),...x.getElementsByTagName("trkpt")].forEach((w,i)=>{
      const la=+w.getAttribute("lat"), lo=+w.getAttribute("lon");
      const nm=(w.getElementsByTagName("name")[0]||{}).textContent||("WPT"+(i+1));
      if(isFinite(la)&&isFinite(lo)) pts.push({id:nm, lat:la, lon:lo, src:name});
    });
    return pts;
  }
  try{
    const j=JSON.parse(s);
    const walk=(g,nm)=>{
      if(!g) return;
      if(g.type==="FeatureCollection") g.features.forEach(f=>walk(f.geometry,(f.properties&&(f.properties.name||f.properties.Name))||nm));
      else if(g.type==="Point") pts.push({id:nm||name, lat:g.coordinates[1], lon:g.coordinates[0], src:name});
      else if(g.type==="LineString"||g.type==="MultiPoint") g.coordinates.forEach((c,i)=>pts.push({id:(nm||name)+"-"+(i+1), lat:c[1], lon:c[0], src:name}));
    };
    walk(j.type==="FeatureCollection"?j:(j.geometry||j), "");
  }catch(e){}
  return pts;
}
/* ── مسح نصي: إحداثيات، أرقام وحدات، أكواد بنود ── */
function scanText(text, name){
  const found={points:[], codes:[], units:[]};
  const coord=/(\d{2}\.\d{4,8})\s*[,;\s]\s*(\d{2}\.\d{4,8})/g; let m;
  while((m=coord.exec(text))){
    let a=+m[1], b=+m[2];
    let lat = a<34?a:b, lon = a<34?b:a;
    if(lat>=16&&lat<=33&&lon>=34&&lon<=56) found.points.push({id:"PT", lat, lon, src:name});
  }
  const un=/\bR\s?1\d{5}\b/g;
  while((m=un.exec(text))) found.units.push(m[0].replace(/\s+/g,""));
  const cd=/\b9?\d{7,9}\b/g;
  while((m=cd.exec(text))){ const k=codeOf(m[0]); if(k) found.codes.push(k); }
  return found;
}
function addGeo(p, pts, rep, name){
  p.geo = p.geo || [];
  let n=0, seen=new Set(p.geo.map(g=>g.lat.toFixed(5)+","+g.lon.toFixed(5)));
  const inUnits = geoPoints(p).map(q=>q.lat.toFixed(5)+","+q.lon.toFixed(5));
  inUnits.forEach(k=>seen.add(k));
  pts.forEach((x,i)=>{
    const k=x.lat.toFixed(5)+","+x.lon.toFixed(5);
    if(seen.has(k)) return; seen.add(k);
    p.geo.push({id:x.id&&x.id!=="PT"?String(x.id).slice(0,18):"PT-"+(p.geo.length+1), lat:+x.lat, lon:+x.lon, src:x.src||name, type:x.type||"PT"});
    n++;
  });
  if(n) rep.push(["ok", T(`${n} إحداثي جديد من «${name}» أُضيف لسجل النقاط ويظهر على الخريطة و Google Earth`,
    `${n} new coordinates from “${name}” added to the point register — visible on the map and in Google Earth`)]);
  return n;
}

/* ── الذكاء الاصطناعي: فهم ورقة غير معروفة ── */
async function aiMapSheet(p, sh, rep){
  const s=await aiGet(); if(!s) return false;
  const prev=sh.rows.slice(0,28).map(r=>r.slice(0,16).map(c=>String(c==null?"":c).slice(0,28)));
  const prompt =
`أنت مهندس تخطيط بالشركة السعودية للكهرباء متخصص في حصر كميات مشاريع تحويل الشبكة الهوائية إلى أرضية.
أمامك أول صفوف ورقة إكسل اسمها "${sh.name}". حدّد نوعها ومواضع الأعمدة (الفهرس يبدأ من صفر).
الأنواع: units = جدول وحدات حلقية/معدات فيه أرقام RMU أو إحداثيات، codes = جدول بنود بأرقام بنود SEC وكميات أو أسعار، tally = حصر لوحات كروكي، none = غير ذلك.
رد بـ JSON فقط بالشكل:
{"kind":"units|codes|tally|none","firstDataRow":0,"cols":{"id":-1,"feeder":-1,"type":-1,"tr":-1,"lat":-1,"lon":-1,"ohm":-1,"code":-1,"desc":-1,"qty":-1,"plan":-1,"exec":-1,"price":-1},"note":"سطر واحد"}
استخدم -1 لأي عمود غير موجود. البيانات:
${JSON.stringify(prev)}`;
  try{
    const j = await s.json(prompt, {modelTier:"quick"});
    if(!j || !j.kind || j.kind==="none") return false;
    const c=j.cols||{}, first=Math.max(0, +j.firstDataRow||0);
    const rows=sh.rows;
    if(j.kind==="units"){
      let n=0, gps=0;
      rows.slice(first).forEach(r=>{
        const id=String(r[c.id]||"").replace(/\s+/g,"").toUpperCase();
        if(!id||id.length<3) return;
        let q=p.rmus.find(x=>String(x.rmu).replace(/\s+/g,"").toUpperCase()===id);
        if(!q){ q={no:0, feeder:"", rmu:id, type:"", tr:"", relay:"—", model:"—", set:false, ratio:"", ohm:"", gps:""}; p.rmus.push(q); }
        const la=num(r[c.lat]), lo=num(r[c.lon]);
        if(la!==null&&lo!==null){ const lat=Math.min(la,lo)<34?Math.min(la,lo):la, lon=Math.max(la,lo); if(lat>=16&&lat<=33&&lon>=34&&lon<=56){ q.gps=lat.toFixed(6)+","+lon.toFixed(6); gps++; } }
        if(c.feeder>=0&&r[c.feeder]) q.feeder=String(r[c.feeder]).trim();
        if(c.type>=0&&r[c.type]){ const t=/([34])\s*w/i.exec(String(r[c.type])); if(t) q.type=t[1]+"W"; }
        if(c.tr>=0&&r[c.tr]) q.tr=String(r[c.tr]).trim();
        if(c.ohm>=0){ const o=num(r[c.ohm]); if(o!==null&&o>0&&o<200) q.ohm=String(o); }
        n++;
      });
      p.rmus.forEach((q,i)=>q.no=i+1);
      rep.push(["ai", T(`المعالجة الذكية قرأت «${sh.name}»: ${n} وحدة${gps?` · ${gps} بإحداثيات`:""}${j.note?" — "+j.note:""}`,
        `AI read “${sh.name}”: ${n} units${gps?` · ${gps} with coordinates`:""}${j.note?" — "+j.note:""}`)]);
      return n>0;
    }
    if(j.kind==="codes"){
      let mats=0, works=0, added=0;
      rows.slice(first).forEach(r=>{
        const code=codeOf(r[c.code]); if(!code) return;
        const desc=c.desc>=0?String(r[c.desc]||""):"";
        const price=c.price>=0?num(r[c.price]):null;
        const plan=c.plan>=0?num(r[c.plan]):null, exec=c.exec>=0?num(r[c.exec]):null, qty=c.qty>=0?num(r[c.qty]):null;
        if(isMatCode(code)){
          let lm=libMat(code); if(!lm){ lm=addLibMat(code, desc, price); added++; }
          if(price) lm.p=price;
          const b=p.mat[code]=p.mat[code]||{iss:0,req:0};
          if(plan!==null&&plan>0){ b.iss=plan; if(exec!==null) b.req=exec; }
          else if(exec!==null&&exec>0) b.req=(+b.iss||0)+exec;
          else if(qty!==null) { b.iss=(+b.iss||0)+qty; b.req=Math.max(+b.req||0,b.iss); }
          mats++;
        } else {
          let lw=libWork(code); if(!lw){ lw=addLibWork(code, desc, price); added++; }
          if(price) lw.p=price;
          const b=p.boq[code]=p.boq[code]||{plan:0,exec:0};
          if(plan!==null) b.plan=plan;
          if(exec!==null) b.exec=exec;
          if(plan===null&&exec===null&&qty!==null) b.plan=(+b.plan||0)+qty;
          works++;
        }
      });
      rep.push(["ai", T(`المعالجة الذكية قرأت «${sh.name}»: ${mats} مادة و ${works} بند${added?` · ${added} جديد`:""}${j.note?" — "+j.note:""}`,
        `AI read “${sh.name}”: ${mats} materials, ${works} items${added?` · ${added} new`:""}${j.note?" — "+j.note:""}`)]);
      return mats+works>0;
    }
    if(j.kind==="tally"){ impTally(p, sh, rep); return true; }
  }catch(e){ rep.push(["skip", aiErr(e)]); }
  return false;
}
/* ── الذكاء الاصطناعي: قراءة نص مستند (docx / pdf) ── */
async function aiDocScan(p, text, name, rep){
  const s=await aiGet(); if(!s || !text || text.length<40) return false;
  const body=text.slice(0, 22000);
  const prompt =
`أنت مهندس حصر كميات بالشركة السعودية للكهرباء. النص التالي من مستند مشروع اسمه "${name}" (خطاب/محضر/تقرير).
استخرج منه ما يخص حصر الكميات فقط. رد بـ JSON فقط:
{"items":[{"code":"8114005","desc":"","issued":0,"required":0}],"points":[{"id":"","lat":0,"lon":0}],"notes":"سطران على الأكثر"}
- code = رقم بند SEC كما ورد (أزل البادئة 9 إن وُجدت).
- issued = المصروف/المخطط، required = المطلوب/المنفذ. استخدم 0 لغير المذكور.
- points = أي إحداثيات (خط العرض للسعودية بين 16 و33).
النص:
${body}`;
  try{
    const j=await s.json(prompt, {modelTier:"default"});
    let mats=0, works=0;
    (j.items||[]).forEach(it=>{
      const code=codeOf(it.code); if(!code) return;
      if(isMatCode(code)){
        let lm=libMat(code); if(!lm) lm=addLibMat(code, it.desc, 0);
        const b=p.mat[code]=p.mat[code]||{iss:0,req:0};
        if(+it.issued>0) b.iss=+it.issued;
        if(+it.required>0) b.req=+it.required;
        mats++;
      } else {
        let lw=libWork(code); if(!lw) lw=addLibWork(code, it.desc, 0);
        const b=p.boq[code]=p.boq[code]||{plan:0,exec:0};
        if(+it.issued>0) b.plan=+it.issued;
        if(+it.required>0) b.exec=+it.required;
        works++;
      }
    });
    const pts=(j.points||[]).filter(x=>+x.lat>=16&&+x.lat<=33&&+x.lon>=34&&+x.lon<=56).map(x=>({id:x.id||"PT", lat:+x.lat, lon:+x.lon, src:name}));
    if(pts.length) addGeo(p, pts, rep, name);
    if(mats+works) rep.push(["ai", T(`المعالجة الذكية قرأت «${name}»: ${mats} مادة و ${works} بند أجور`, `AI read “${name}”: ${mats} materials, ${works} work items`)]);
    if(j.notes) rep.push(["ai", String(j.notes).slice(0,220)]);
    return mats+works+pts.length>0;
  }catch(e){ rep.push(["skip", aiErr(e)]); return false; }
}
/* ── الذكاء الاصطناعي: قراءة صورة الكروكي ── */
async function aiImageScan(p, blob, name, rep){
  const s=await aiGet(); if(!s) return false;
  if(!AI.limits || !AI.limits.images){ rep.push(["skip", T("قراءة الصور غير متاحة في هذا العرض","Image reading is unavailable in this view")]); return false; }
  const prompt =
`الصورة كروكي (مخطط) لمشروع تحويل شبكة كهرباء هوائية 33 ك.ف إلى شبكة كابلات أرضية بالسعودية.
اقرأها كمهندس حصر كميات واستخرج ما هو مكتوب فيها فقط، دون تخمين. رد بـ JSON فقط:
{"equipment":{"rmu3w":0,"rmu4w":0,"tr500_220":0,"tr500_400":0,"pillars":0},
 "cables":{"mv3x400":0,"lv4x300":0,"lv4x185":0,"lv4x70":0},
 "excavation":{"asphalt_mv":0,"sandy_mv":0,"asphalt_lv":0,"sandy_lv":0},
 "removals":{"steel_poles":0,"wood_poles":0,"tr_1pole":0,"tr_2pole":0},
 "points":[{"id":"","lat":0,"lon":0}],
 "confidence":"high|medium|low","notes":"سطران على الأكثر عن غير الواضح"}
الأطوال بالمتر والأعداد صحيحة. ضع 0 لما لا يظهر في الصورة.`;
  try{
    const j=await s.json(prompt, {images:[blob], modelTier:"complex"});
    const e=j.equipment||{}, c=j.cables||{}, x=j.excavation||{}, r=j.removals||{};
    const s1=blankSheet((p.sheets?p.sheets.length:0)+1);
    s1.name=T("كروكي: ","Layout: ")+String(name).slice(0,18);
    Object.assign(s1,{
      rmu3w:+e.rmu3w||0, rmu4w:+e.rmu4w||0, tr220:+e.tr500_220||0, tr400:+e.tr500_400||0, pillars:+e.pillars||0,
      htCable:+c.mv3x400||0, lt300:+c.lv4x300||0, lt185:+c.lv4x185||0, lt70:+c.lv4x70||0,
      asHT1:+x.asphalt_mv||0, saHT1:+x.sandy_mv||0, asLT13:+x.asphalt_lv||0, saLT13:+x.sandy_lv||0,
      poleSteel:+r.steel_poles||0, poleWood:+r.wood_poles||0, trPole1:+r.tr_1pole||0, trPole2:+r.tr_2pole||0
    });
    const filled=SHEET_FIELDS.reduce((a,g)=>a+g.f.filter(f=>+s1[f[0]]>0).length,0);
    if(filled){
      const old=p.sheets.findIndex(z=>z.name===s1.name);
      if(old>=0) p.sheets[old]=s1; else { if(p.sheets.length===1 && !SHEET_FIELDS.some(g=>g.f.some(f=>+p.sheets[0][f[0]]>0))) p.sheets=[s1]; else p.sheets.push(s1); }
      p.derived=null;
      rep.push(["ai", T(`قراءة الكروكي «${name}»: ${filled} حقلًا · الثقة ${j.confidence||"—"}`, `Layout read “${name}”: ${filled} fields · confidence ${j.confidence||"—"}`)]);
    } else rep.push(["skip", T(`لم تظهر كميات واضحة في «${name}»`, `No clear quantities found in “${name}”`)]);
    const pts=(j.points||[]).filter(q=>+q.lat>=16&&+q.lat<=33&&+q.lon>=34&&+q.lon<=56).map(q=>({id:q.id||"PT", lat:+q.lat, lon:+q.lon, src:name}));
    if(pts.length) addGeo(p, pts, rep, name);
    if(j.notes) rep.push(["ai", String(j.notes).slice(0,220)]);
    if(j.confidence==="low") rep.push(["skip", T("ثقة منخفضة في قراءة الصورة — راجع الأرقام قبل الاعتماد","Low confidence on the image — verify the numbers before approving")]);
    return filled>0;
  }catch(e){ rep.push(["skip", aiErr(e)]); return false; }
}

/* ── مراجعة احترافية للحصر بعد الاستنباط ── */
async function aiReview(){
  const s=await aiGet(); if(!s) return null;
  const p=P(), t=totals(p), d=p.derived; if(!d) return null;
  const top=WORKS.map(w=>{const b=p.boq[w.c]||{}; const dq=(+b.exec||0)-(+b.plan||0); return {c:w.c, ar:w.ar.slice(0,44), dq, dv:Math.round(dq*w.p)};})
    .filter(o=>o.dv).sort((a,b)=>Math.abs(b.dv)-Math.abs(a.dv)).slice(0,10);
  const gaps=MATERIALS.map(m=>{const b=p.mat[m.c]||{}; return {c:m.c, ar:m.ar.slice(0,40), gap:(+b.req||0)-(+b.iss||0)};}).filter(o=>o.gap).slice(0,10);
  const pts=geoPoints(p), fs=feeders(pts), route=fs.filter(f=>!f.noRoute).reduce((a,f)=>a+f.len,0);
  const data={
    مشروع:p.name, أمر_العمل:p.wo,
    وحدات:{rmu3w:t.rmu3w, rmu4w:t.rmu4w, محطات:t.trTot, نقاط_بإحداثيات:pts.length},
    كابلات_م:{ج_متوسط:t.htCable, "4x300":t.lt300, "4x185":t.lt185, "4x70":t.lt70},
    حفريات_م:{مسفلت:t.asHT1+t.asHT2+t.asLT13, رملي:t.saHT1+t.saHT2+t.saHT3+t.saHT4+t.saLT13},
    سفلتة_م2:{إعادة:t.asphalt, كشط:t.milling}, ثقب_أفقي_م:t.hdd,
    طول_المسار_من_الإحداثيات_م:Math.round(route),
    تكلفة:{مواد:Math.round(d.cost.mat), تركيبات:Math.round(d.cost.inst), غير_مباشرة:Math.round(d.cost.ind), إجمالي:Math.round(d.cost.total)},
    أكبر_فروق:top, عجز_المواد:gaps
  };
  const prompt =
`أنت مدير حصر كميات أول بالشركة السعودية للكهرباء، خبرة في مشاريع تحويل الهوائي إلى أرضي والعقد الموحد.
راجع بيانات المشروع التالية مراجعة فنية دقيقة واكتب بالعربية (بدون مقدمات) وبهذا الترتيب:
1) ثلاث ملاحظات على اتساق الكميات (نسبة الكابل إلى طول المسار، الحفريات مقابل أطوال الكابلات، النهايات والوصلات مقابل عدد الوحدات، التأريض مقابل المعدات).
2) البنود التي يُرجّح أنها ناقصة أو مبالغ فيها، مع رقم البند وسبب مختصر.
3) ما الذي يجب تجهيزه قبل رفع تعديل المقايسة للاستشاري.
اجعل كل نقطة سطرًا واحدًا يبدأ بـ «• ». لا تخترع أرقامًا غير موجودة. البيانات:
${JSON.stringify(data)}`;
  const {text} = await s(prompt, {modelTier:"complex"});
  return text;
}

/* ── معالجة ملف واحد بكل الطرق ── */
async function processFile(f, rec, rep){
  const ext=rec.ext, p=P();
  let did=false;
  if(["xlsx","xlsm"].includes(ext)){
    const sheets=await readXlsx(await f.arrayBuffer());
    FILEDATA[rec.id]=sheets;
    await importFile(rec, sheets, true);
    (rec.rep||[]).forEach(x=>rep.push(x));
    // الأوراق التي لم تُفهم → معالجة ذكية
    for(const sh of sheets){
      const live=sh.rows.filter(r=>r.some(c=>String(c).trim()!=="")).length;
      if(live>3 && !sheetKind(sh)) { if(await aiMapSheet(p, sh, rep)) did=true; }
    }
    did=true;
  } else if(ext==="csv"){
    const sheets=readCsvText(await f.text()); FILEDATA[rec.id]=sheets;
    await importFile(rec, sheets, true); (rec.rep||[]).forEach(x=>rep.push(x));
    const pts=scanText(await f.text(), rec.name).points; if(pts.length) addGeo(p, pts, rep, rec.name);
    did=true;
  } else if(ext==="docx"){
    const text=await readDocxText(await f.arrayBuffer());
    const sc=scanText(text, rec.name);
    if(sc.points.length) addGeo(p, sc.points, rep, rec.name);
    did = await aiDocScan(p, text, rec.name, rep) || sc.points.length>0;
    if(!did) rep.push(["skip", T(`«${rec.name}»: قُرئ النص ولم تُستخرج بنود`, `“${rec.name}”: text read, no items extracted`)]);
    rec.rows=text.split("\n").length;
  } else if(ext==="pdf"){
    const text=await readPdfText(await f.arrayBuffer());
    const sc=scanText(text, rec.name);
    if(sc.points.length) addGeo(p, sc.points, rep, rec.name);
    if(text.replace(/\s/g,"").length>200){ did = await aiDocScan(p, text, rec.name, rep) || sc.points.length>0; }
    else rep.push(["skip", T(`«${rec.name}»: PDF ممسوح ضوئيًا بلا نص — احفظ صفحاته كصور وارفعها لتُقرأ بالذكاء الاصطناعي`,
      `“${rec.name}”: scanned PDF with no text layer — save its pages as images and upload them for AI reading`)]);
    rec.rows=sc.points.length;
  } else if(["kml","gpx","geojson","json","kmz"].includes(ext)){
    let s2="";
    if(ext==="kmz"){ const z=await unzipBuf(await f.arrayBuffer()); const k=Object.keys(z).find(n=>/\.kml$/i.test(n)); s2=k?txt(await inflateEntry(z[k])):""; }
    else s2=await f.text();
    const pts=readGeoText(s2, rec.name);
    if(pts.length){ addGeo(p, pts, rep, rec.name); did=true; rec.rows=pts.length; }
    else rep.push(["skip", T(`«${rec.name}»: لا توجد إحداثيات`, `“${rec.name}”: no coordinates found`)]);
  } else if(["txt","xml"].includes(ext)){
    const text=await f.text(); const sc=scanText(text, rec.name);
    if(sc.points.length){ addGeo(p, sc.points, rep, rec.name); did=true; }
  } else if(rec.kind==="img"){
    FILEDATA[rec.id]={blob:f};
    did = await aiImageScan(p, f, rec.name, rep);
  } else if(ext==="xls"){
    rep.push(["skip", T(`«${rec.name}»: صيغة Excel قديمة — احفظه باسم .xlsx ثم ارفعه`, `“${rec.name}”: legacy Excel — save it as .xlsx and upload again`)]);
  } else {
    rep.push(["skip", T(`«${rec.name}»: نوع ملف غير مدعوم`, `“${rec.name}”: unsupported file type`)]);
  }
  rec.imported = did;
  rec.rep = rep.slice();
  return did;
}

/* ── استقبال الملفات + تشغيل فوري ── */
async function intakeFiles(list){
  const p=P(), files=[...list].slice(0,16);
  if(!files.length) return;
  LASTSNAP = JSON.stringify({projects:S.projects, active:S.active});
  const rep=[];
  setBusy(true, T("جارٍ قراءة الملفات…","Reading files…"));
  for(const f of files){
    const ext=(f.name.split(".").pop()||"").toLowerCase();
    const rec={id:"F"+Math.random().toString(36).slice(2,8), name:f.name, size:f.size, type:f.type||"", ext,
      kind: ["xlsx","xlsm","csv"].includes(ext)?"data" : (ext==="pdf"?"pdf" : (/^image\//.test(f.type)||["png","jpg","jpeg","webp"].includes(ext))?"img" : "doc"),
      imported:false, rows:0, at:new Date().toISOString(), rep:[], url:""};
    if(rec.kind==="img" && f.size<1.6e6){
      rec.url = await new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>res(""); r.readAsDataURL(f); });
    }
    setBusy(true, T("معالجة ","Processing ")+f.name);
    try{ await processFile(f, rec, rep); }
    catch(e){ rep.push(["skip", T("تعذّرت قراءة ","Could not read ")+f.name+": "+(e.message||e)]); }
    p.files.push(rec);
  }
  LASTREP={file:files.map(f=>f.name).join(" · "), rep};
  save();
  await runDerive(true, rep);
  setBusy(false);
  const blocked = p.files.filter(f=>f.blocked).length;
  if(blocked) S.page="master";
  save(); render();
  toast(blocked
    ? T(`تمت المعالجة — ${blocked} ملف موقوف لاختلاف رقم أمر العمل، راجع بطاقة الهوية`,
        `Processed — ${blocked} file(s) blocked over a work-order mismatch; see the identity card`)
    : T("تمت معالجة الملفات وتحديث كل الصفحات","Files processed — every page updated"));
}

/* ── زر الاستنباط: تشغيل المحرك + المراجعة الذكية ── */
function setBusy(on, label){
  AI.busy=on;
  const b=$("btnDeriveAll"); if(!b) return;
  b.disabled=on;
  b.innerHTML = on ? `<span class="spin"></span> ${esc(label||T("جارٍ المعالجة…","Working…"))}`
    : T("استنباط ومعالجة ذكية للبيانات","Derive & AI-process data");
}
async function runDerive(silent, rep){
  const p=P(), t=totals(p);
  if(!t.htCable && !t.lt300 && !t.rmuNew && !Object.keys(p.boq).length && !p.rmus.length){
    if(!silent){ toast(T("ارفع الملفات أو أدخل حصر اللوحات أولًا","Upload files or enter the sheet tally first")); S.page="master"; save(); render(); }
    return;
  }
  if(!t.rmuNew && (Object.keys(p.boq).length || p.rmus.length)) backfillTally(true);
  p.derived = derive(p);
  Object.entries(p.derived.works).forEach(([c,q])=>{ p.boq[c]=p.boq[c]||{plan:0,exec:0};
    if(!p.boq[c].plan && !p.boq[c].exec){ p.boq[c].plan=Math.round(q*10)/10; p.boq[c].exec=Math.round(q*10)/10; } });
  Object.entries(p.derived.mats).forEach(([c,q])=>{ p.mat[c]=p.mat[c]||{iss:0,req:0};
    if(!p.mat[c].iss && !p.mat[c].req){ p.mat[c].iss=q; p.mat[c].req=q; } });
  if(!p.rmus.length && t.rmuNew){
    p.rmus=Array.from({length:t.rmuNew},(_,i)=>({no:i+1, feeder:"—", rmu:"R"+(101580+i+1), type:i<t.rmu3w?"3W":"4W",
      tr:"", relay:"—", model:"—", set:false, ratio:"", ohm:"", gps:""}));
  }
  save();
  if(!silent) render();
}
async function deriveAndReview(){
  if(AI.busy) return;
  setBusy(true, T("استنباط الكميات…","Deriving quantities…"));
  await runDerive(true);
  const s=await aiGet();
  if(s){
    setBusy(true, T("مراجعة فنية بالذكاء الاصطناعي…","AI technical review…"));
    try{ AI.notes = await aiReview(); }
    catch(e){ AI.notes = null; toast(aiErr(e)); }
  }
  setBusy(false);
  S.page="master"; save(); render();
  toast(s? T("تم الاستنباط والمراجعة الفنية","Derived and reviewed") : T("تم استنباط الحصر وكل النماذج","Takeoff and all forms derived"));
}

/* ── إعادة الحساب تلقائيًا عند أي تعديل ── */
let AUTO=null;
function autoDerive(){
  clearTimeout(AUTO);
  AUTO=setTimeout(async()=>{
    const p=P(); if(!p.derived) return;
    p.derived=derive(p); save();
    const el=$("deriveState"); if(el) el.textContent=T("مُحدَّث آليًا: ","Auto-updated: ")+new Date().toLocaleTimeString(AR()?"ar-EG":"en-GB");
  }, 700);
}

/* ── بطاقة المراجعة الذكية في الماستر ── */
function aiCard(){
  const on = !!AI.s;
  return `<div class="card"><header><h3>${T("المراجعة الفنية بالذكاء الاصطناعي","AI technical review")}</h3>
    <span class="ai-badge ${on?"":"off"}">${on?T("متاح","Available"):T("في نسخة claude.ai","claude.ai copy only")}</span>
    <span class="sp"></span>
    ${on?`<button class="btn sm noprint" id="aiRun">${T("مراجعة الحصر الآن","Review the takeoff now")}</button>`:""}</header>
  <div class="body">
    ${AI.notes? `<div class="ai-out">${esc(AI.notes)}</div>`
      : `<p class="muted" style="font-size:12.5px">${on
        ? T("اضغط «استنباط ومعالجة ذكية» أو «مراجعة الحصر الآن» ليقرأ الذكاء الاصطناعي كميات المشروع ويكتب ملاحظات مهندس حصر عليها.","Press “Derive & AI-process” or “Review the takeoff now” to get a quantity-surveyor's read on the project figures.")
        : T("المعالجة الذكية تعمل في نسخة المنصة على claude.ai. نسخة الجهاز تستخدم محرك الاستنباط والقراءة المباشرة للملفات بدون إنترنت.","AI processing runs in the claude.ai copy. The desktop copy uses the deterministic engine and direct file reading, offline.")}</p>`}
  </div></div>`;
}

/* ── الربط ── */
(function(){
  const _me = masterExtras;
  masterExtras = function(){ return _me() + aiCard(); };
  const _r = render;
  render = function(){
    _r();
    const b=$("btnDeriveAll");
    if(b && !AI.busy){ b.textContent = T("استنباط ومعالجة ذكية للبيانات","Derive & AI-process data"); b.onclick = deriveAndReview; }
    const ar=$("aiRun");
    if(ar) ar.onclick = async()=>{ if(AI.busy) return; setBusy(true, T("مراجعة فنية…","Reviewing…"));
      try{ AI.notes=await aiReview(); }catch(e){ toast(aiErr(e)); } setBusy(false); render(); };
    if(S.page==="master"){
      const fi=$("fileIn");
      if(fi){ fi.setAttribute("accept",".xlsx,.xlsm,.csv,.pdf,.docx,.kml,.kmz,.gpx,.geojson,.json,.txt,image/*");
        fi.onchange=()=>intakeFiles(fi.files); }
      const dz=$("drop"); if(dz) dz.ondrop=e=>{ e.preventDefault(); dz.classList.remove("over"); intakeFiles(e.dataTransfer.files); };
      const p4=dz&&dz.querySelector("p");
      if(p4) p4.textContent=T("ارفع أي ملفات المشروع: إكسل (حصر، مقايسة، مواد وأجور، ضبط الحماية، الاستلام)، PDF، Word، صور الكروكي، KML/GPX. تُقرأ آليًا وتُستخرج منها الأرقام والمسميات والإحداثيات، ويُعاد الاستنباط فورًا.",
        "Upload any project file: Excel (tally, BOQ, materials, protection, acceptance), PDF, Word, layout images, KML/GPX. They are read automatically — codes, names and coordinates extracted, and the takeoff re-runs at once.");
      $("view").querySelectorAll("[data-sheet],[data-factor]").forEach(inp=>{
        const prev=inp.onchange;
        inp.onchange=e=>{ prev && prev(e); autoDerive(); };
      });
    }
    if(S.page==="boq" || S.page==="wages"){
      $("view").querySelectorAll("[data-boq],[data-mat]").forEach(inp=>{ const prev=inp.onchange; inp.onchange=e=>{ prev && prev(e); autoDerive(); }; });
    }
  };
  aiGet().then(()=>{ if(S.page==="master") render(); });
  render();
})();

<script>
"use strict";
/* ═══════════ مطابقة هوية أمر العمل بين المنصة والملفات ═══════════ */
const dig = v => String(v==null?"":v).replace(/[^\d]/g,"");
const WO_RE = /(?<!\d)\d{8,10}(?!\d)/g;
const ID_LABELS = {
  wo:["امر العمل","رقم امر","رقم المقايسه","work order"],
  req:["رقم الطلب","uds"],            // طلب UDS مرتبط (ثقب أفقي، كشط…) قد يحمل رقمًا آخر لنفس المشروع
  name:["اسم المشروع","project name","المشروع"],
  site:["موقع المشروع","موقع امر العمل","الموقع","site"],
  admin:["الاداره","department"], sector:["القطاع","sector"], contractor:["اسم المقاول","المقاول","contractor"]
};
const WO_CTX = /مشروع|امرعمل|امر|عمل|طلب|مقايسه|project|work ?order|uds/i;
/* قيمة اسم/موقع/إدارة مقبولة: نص عربي معتبر لا عنوان عمود إنجليزي مثل UNIT */
const goodVal = v => { const s=String(v).trim();
  if(s.length<3 || s.length>60 || /^\d+$/.test(s)) return false;
  const ar=(s.match(/[ء-ي]/g)||[]).length;
  return ar>=3 || (/[a-z]/.test(s) && s.length>=6);
};
/* تقارب نصي: «نجران» ≈ «إدارة نجران» */
const nzz = v => nz(v).replace(/ة/g,"ه").replace(/\s+/g,"");
const STOPW = /^(شركه|شركاه|موسسه|مؤسسه|مقاول|مشروع|اداره|قطاع|company|project)$/;
const toks = v => String(v||"").split(/[\s\-–/،,()]+/).map(t=>nzz(t).replace(/^ال/,"").replace(/^و/,""))
  .filter(t=>t.length>=4 && !STOPW.test(t));
/* تقارب نصي يتحمّل اختلاف الصياغة: «الوبران» ≈ «شركة ناصر مانع وبران وشركاه» */
const near = (a,b) => {
  const x=nzz(a), y=nzz(b); if(!x||!y) return false;
  if(x===y || x.includes(y) || y.includes(x)) return true;
  const A=toks(a), B=toks(b);
  return A.some(t=>B.some(u=>t===u||t.includes(u)||u.includes(t)));
};
const notLibCode = x => { const k=normCode(x); return !libWork(k) && !libMat(k); };
const pickTop = o => Object.keys(o).sort((a,b)=>o[b]-o[a])[0];
function identityFromRows(rows){
  const out={}, freq={}, ctx={};
  rows.forEach(r=>{
    r.forEach((c,i)=>{
      const h=nz(c); if(!h) return;
      Object.entries(ID_LABELS).forEach(([k,pats])=>{
        if(out[k]) return;
        if(!pats.some(p=>h.includes(nz(p)))) return;
        for(let j=i+1;j<Math.min(i+5,r.length);j++){
          const v=String(r[j]==null?"":r[j]).trim(); if(!v) continue;
          if(k==="wo"||k==="req"){ const mm=v.match(WO_RE); if(mm){ out[k]=mm[0]; return; } if(/\d\.\d/.test(v)) return; }
          else if(goodVal(v)){ out[k]=v; return; }
        }
      });
      // رقم أمر العمل يرد داخل نص عنوان ("مشروع الحصينية 234022308")، أما الخلية الرقمية وحدها فهي رقم بند
      const raw=String(c).trim(), d=raw.match(WO_RE);
      if(d && raw.length > d[0].length + 1){
        const inCtx = WO_CTX.test(nz(raw));
        d.forEach(x=>{ if(!notLibCode(x)) return; freq[x]=(freq[x]||0)+1; if(inCtx) ctx[x]=(ctx[x]||0)+1; });
      }
    });
  });
  if(!out.wo){
    // الترتيب: رقم طلب مُعنون صراحة > رقم داخل عنوان يذكر «مشروع/أمر عمل» > ترجيح بالتكرار
    const strong = pickTop(ctx);
    if(out.req && (!strong || dig(out.req)!==dig(strong))){ out.wo = out.req; out.woReq = true; }
    else if(strong) out.wo = strong;
    else { const best=pickTop(freq); if(best){ out.wo=best; out.woWeak=true; } }
  }
  if(!out.name){
    for(const r of rows.slice(0,6)){
      for(const c of r){
        const v=String(c==null?"":c).trim();
        if(v.length>=8 && v.length<=60 && /مشروع|project/i.test(v) && goodVal(v)){ out.name=v.replace(WO_RE,"").trim(); out.nameWeak=true; break; }
      }
      if(out.name) break;
    }
  }
  return out;
}
function identityFromText(text){
  const out={}, lines=String(text||"").split(/[\n\r]+/);
  lines.forEach(l=>{
    const h=nz(l);
    Object.entries(ID_LABELS).forEach(([k,pats])=>{
      if(out[k]) return;
      const hit=pats.find(p=>h.includes(nz(p))); if(!hit) return;
      if(k==="wo"||k==="req"){ const m=l.match(WO_RE); if(m) out[k]=m[0]; }
      else { const v=l.split(/[:：]/).slice(1).join(":").trim(); if(goodVal(v)) out[k]=v; }
    });
  });
  if(!out.wo){
    const freq={}, ctx={};
    lines.forEach(l=>{
      const inCtx = WO_CTX.test(nz(l));
      (String(l).match(WO_RE)||[]).forEach(x=>{ if(!notLibCode(x)) return; freq[x]=(freq[x]||0)+1; if(inCtx) ctx[x]=(ctx[x]||0)+1; });
    });
    const strong = pickTop(ctx);
    if(strong) out.wo = strong;
    else if(out.req){ out.wo = out.req; out.woReq = true; }
    else { const best=pickTop(freq); if(best){ out.wo=best; out.woWeak=true; } }
  }
  return out;
}
function identityFromName(name){
  const m=String(name).match(WO_RE);
  return m? {wo:m[0], woFromName:true} : {};
}
/* ترجيح < اسم الملف/طلب UDS < أمر عمل صريح داخل الملف */
const identRank = x => !x||!x.wo ? 0 : x.woWeak ? 1 : (x.woReq||x.woFromName) ? 2 : 3;
function mergeIdent(...list){
  const o={}, src=list.filter(Boolean);
  src.forEach(x=>Object.entries(x).forEach(([k,v])=>{ if(v && o[k]==null) o[k]=v; }));
  const best = src.slice().sort((a,b)=>identRank(b)-identRank(a))[0];
  if(best && best.wo){ o.wo=best.wo; o.woWeak=!!best.woWeak; o.woReq=!!best.woReq; o.woFromName=!!best.woFromName; }
  return o;
}
async function fileIdentity(f, rec){
  try{
    if(["xlsx","xlsm"].includes(rec.ext)){
      const sheets=await readXlsx(await f.arrayBuffer());
      FILEDATA[rec.id]=sheets;   // نحفظ الجداول حتى لو أُوقف الملف، ليبقى «استورد رغم الاختلاف» ممكنًا
      const all=sheets.flatMap(s=>s.rows.slice(0,40));
      return mergeIdent(identityFromRows(all), identityFromName(rec.name));
    }
    if(rec.ext==="csv"){
      const txt=await f.text(); FILEDATA[rec.id]=readCsvText(txt);
      return mergeIdent(identityFromText(txt), identityFromName(rec.name));
    }
    if(rec.ext==="docx") return mergeIdent(identityFromText(await readDocxText(await f.arrayBuffer())), identityFromName(rec.name));
    if(rec.ext==="pdf") return mergeIdent(identityFromText(await readPdfText(await f.arrayBuffer())), identityFromName(rec.name));
  }catch(e){}
  return identityFromName(rec.name);
}
/* الحالة: match | mismatch | related | weak | adopt | none */
function woState(p, ident){
  const a=dig(p.wo), b=ident&&ident.wo?dig(ident.wo):"";
  if(!b) return "none";
  if(ident.woWeak && a) return a===b ? "match" : "weak";
  if(!a) return ident.woReq ? "none" : "adopt";     // لا نعتمد هوية المشروع من رقم طلب UDS فرعي
  if(a===b) return "match";
  return ident.woReq ? "related" : "mismatch";
}
try{ const g=localStorage.getItem(LS+"-guard"); S.woGuard = g===null? true : g==="1"; }catch(e){ S.woGuard=true; }
const _save = save;
save = function(){ _save(); try{ localStorage.setItem(LS+"-guard", S.woGuard?"1":"0"); }catch(e){} };

/* ملء الحقول الفارغة فقط من هوية الملف — لا يُستبدل ما أدخله المستخدم */
function fillIdent(p, id){
  if(!id) return;
  if(id.site && !String(p.site||"").trim()) p.site = id.site;
  if(id.admin && !String(p.admin||"").trim()) p.admin = id.admin;
  if(id.sector && !String(p.sector||"").trim()) p.sector = id.sector;
  if(id.name && (!String(p.name||"").trim() || /^مشروع تحويل رقم/.test(p.name))) p.name = id.name;
}

/* ── اعتراض المعالجة: لا تخلط مشروعًا بآخر ── */
(function(){
  const _pf = processFile;
  processFile = async function(f, rec, rep){
    const p=P();
    rec.ident = await fileIdentity(f, rec);
    const st = woState(p, rec.ident);
    rec.woState = st;
    if(st==="adopt"||st==="match"||st==="related") fillIdent(p, rec.ident);
    if(st==="adopt"){
      p.wo = rec.ident.wo;
      if(!p.name || /^مشروع تحويل رقم/.test(p.name)) p.name = rec.ident.name || p.name;
      rep.push(["ok", T(`أُخذ رقم أمر العمل ${p.wo} من «${rec.name}»${rec.ident.name?` · المشروع: ${rec.ident.name}`:""}`,
        `Work order ${p.wo} taken from “${rec.name}”${rec.ident.name?` · project: ${rec.ident.name}`:""}`)]);
    } else if(st==="related"){
      rep.push(["ok", T(`«${rec.name}» طلب UDS مرتبط رقم ${rec.ident.wo} ضمن أمر العمل ${dig(p.wo)} — استُورد`,
        `“${rec.name}” is a related UDS request ${rec.ident.wo} under work order ${dig(p.wo)} — imported`)]);
    } else if(st==="weak"){
      rep.push(["warn", T(`«${rec.name}»: لم يُذكر رقم أمر العمل صراحة — استُورد وربطه ترجيحي، راجع البطاقة`,
        `“${rec.name}”: no explicit work-order number — imported with an inferred link; check the identity card`)]);
    } else if(st==="mismatch" && S.woGuard){
      rec.blocked=true; rec.imported=false;
      rep.push(["warn", T(`«${rec.name}» يحمل أمر عمل ${rec.ident.wo} بينما المشروع الحالي ${dig(p.wo)} — لم تُستورد بياناته. افتح بطاقة مطابقة أمر العمل لاعتماده أو استيراده رغم الاختلاف.`,
        `“${rec.name}” carries work order ${rec.ident.wo} while this project is ${dig(p.wo)} — its data was not imported. Use the work-order matching card to adopt it or import anyway.`)]);
      return false;
    } else if(st==="mismatch"){
      rep.push(["warn", T(`تحذير: «${rec.name}» يحمل أمر عمل ${rec.ident.wo} مختلفًا عن ${dig(p.wo)} — استُورد رغم ذلك لأن الحماية موقوفة.`,
        `Warning: “${rec.name}” carries work order ${rec.ident.wo}, not ${dig(p.wo)} — imported anyway because the guard is off.`)]);
    } else if(st==="match"){
      rep.push(["ok", T(`مطابقة: «${rec.name}» يحمل نفس أمر العمل ${dig(p.wo)}`, `Match: “${rec.name}” carries work order ${dig(p.wo)}`)]);
    }
    return await _pf(f, rec, rep);
  };
})();

/* ── بطاقة هوية أمر العمل ── */
function woCard(){
  const p=P(), files=p.files||[];
  const ev=files.filter(f=>f.ident && f.ident.wo && !f.ident.woWeak);
  const ok=ev.filter(f=>dig(f.ident.wo)===dig(p.wo)).length;
  const rel=ev.filter(f=>dig(f.ident.wo)!==dig(p.wo) && f.ident.woReq);          // طلبات UDS مرتبطة
  const bad=ev.filter(f=>dig(f.ident.wo)!==dig(p.wo) && !f.ident.woReq);         // أوامر عمل مختلفة فعلًا
  const src=k=>{ const f=files.find(x=>x.ident&&x.ident[k]); return f? f.name : T("إدخال يدوي","manual entry"); };
  const fields=[
    ["wo", T("رقم أمر العمل / UDS","Work order / UDS"), p.wo, true],
    ["name", T("اسم المشروع","Project name"), p.name, false],
    ["site", T("موقع المشروع","Site"), p.site||"—", false],
    ["admin", T("الإدارة","Department"), p.admin||"—", false],
    ["sector", T("القطاع","Sector"), p.sector||"—", false],
    ["contractor", T("المقاول","Contractor"), CONTRACTORS[p.contractor]||"—", false]
  ];
  return `
  <div class="card" id="woCard"><header><h3>${T("هوية أمر العمل ومطابقتها بالملفات","Work-order identity & file matching")}</h3>
    <span class="sub">${ev.length? T(`${ok} من ${ev.length} ملف مطابق`, `${ok} of ${ev.length} files match`)+(rel.length?T(` · ${rel.length} طلب UDS مرتبط`,` · ${rel.length} related UDS request(s)`):"") : T("لم يُقرأ رقم أمر عمل من الملفات بعد","No work-order number read from files yet")}</span>
    <span class="sp"></span>
    <label class="sw noprint"><input type="checkbox" id="woGuard" ${S.woGuard?"checked":""}>
      ${T("حماية المطابقة","Matching guard")}</label></header>
  <div class="body" style="display:flex;flex-direction:column;gap:12px">
    <div class="idgrid">${fields.map(([k,lab,val,isNum])=>{
      const from=files.find(f=>f.ident&&f.ident[k]&&String(f.ident[k]).trim());
      let cls=null, txt="";
      if(k==="wo" && ev.length){
        if(!bad.length){ cls="ok"; txt=T("مطابق لكل الملفات","Matches all files"); }
        else if(ok){ cls="warn"; txt=T(`مطابق ${ok} ومختلف ${bad.length}`,`${ok} match · ${bad.length} differ`); }
        else { cls="bad"; txt=T("مختلف عن الملفات","Differs from files"); }
      } else if(k!=="wo" && from){
        const s=near(from.ident[k], val); cls=s?"ok":"warn";
        txt=s?T("مطابق للملفات","Matches files"):T("يختلف عن الملف","Differs from file");
      }
      return `<div class="idg"><b>${esc(lab)}</b>
        <span class="v ${isNum?"num":""}">${esc(val||"—")}</span>
        <span class="s">${from? T("من ","from ")+esc(from.name) : T("إدخال يدوي","manual entry")}</span>
        ${cls?`<span class="pill ${cls}" style="align-self:flex-start;margin-top:3px">${txt}</span>`:""}
      </div>`;}).join("")}</div>

    ${ev.length?`<div class="scroll"><table class="stbl"><thead><tr>
      <th>${T("الملف","File")}</th><th>${T("رقم أمر العمل في الملف","Work order in file")}</th>
      <th>${T("اسم المشروع في الملف","Project name in file")}</th><th>${T("الحالة","Status")}</th><th>${T("إجراء","Action")}</th></tr></thead>
      <tbody>${ev.map(f=>{
        const same=dig(f.ident.wo)===dig(p.wo), isRel=!same && !!f.ident.woReq;
        const tag = same ? ""
                  : f.ident.woReq ? T("طلب UDS","UDS request")
                  : f.ident.woFromName ? T("من اسم الملف","from filename")
                  : f.ident.woWeak ? T("ترجيح","inferred") : "";
        return `<tr><td class="wrap-t">${esc(f.name)}</td>
          <td class="code">${esc(f.ident.wo)}${tag?` <span class="muted">(${tag})</span>`:""}</td>
          <td class="wrap-t">${esc(f.ident.name||"—")}</td>
          <td><span class="pill ${same?"ok":isRel?"warn":f.blocked?"bad":"warn"}">${
            same?T("مطابق","Match"):isRel?T("طلب مرتبط","Related request"):f.blocked?T("موقوف","Blocked"):T("مختلف","Differs")}</span></td>
          <td class="act noprint">${same||isRel?"—":`<button class="btn sm" data-adopt="${esc(f.ident.wo)}">${T("اعتمد هذا الرقم","Adopt this number")}</button>
            ${f.blocked&&FILEDATA[f.id]?`<button class="btn sm gh" data-force="${f.id}">${T("استورد رغم الاختلاف","Import anyway")}</button>`:""}`}</td></tr>`;
      }).join("")}</tbody></table></div>`:""}

    ${bad.length?`<div class="note warn">${T("ملفات بأرقام أوامر عمل مختلفة تعني عادة أنها تخص مشروعًا آخر. اعتمد الرقم الصحيح، أو أنشئ مشروعًا جديدًا وارفعها فيه، حتى لا تختلط كميات مشروعين في مقايسة واحدة.",
      "Files with different work-order numbers usually belong to another project. Adopt the correct number, or create a new project and upload them there, so two projects' quantities never mix in one BOQ.")}</div>`:""}
  </div></div>`;
}

/* ── إعادة استيراد ملف موقوف ── */
async function forceImport(id){
  const p=P(), rec=p.files.find(f=>f.id===id);
  if(!rec) return;
  const sheets=FILEDATA[id];
  if(!sheets || !Array.isArray(sheets)){ toast(T("أعد رفع الملف لاستيراده","Re-upload the file to import it")); return; }
  LASTSNAP=JSON.stringify({projects:S.projects, active:S.active});
  const rep=[];
  await importFile(rec, sheets, true);
  (rec.rep||[]).forEach(x=>rep.push(x));
  rec.blocked=false; rec.imported=true;
  rep.unshift(["warn", T(`استُورد «${rec.name}» رغم اختلاف رقم أمر العمل — راجع الكميات`, `“${rec.name}” imported despite the work-order difference — review the quantities`)]);
  LASTREP={file:rec.name, rep};
  await runDerive(true, rep);
  save(); render();
}
function adoptWo(wo){
  const p=P(); LASTSNAP=JSON.stringify({projects:S.projects, active:S.active});
  p.wo=dig(wo);
  const f=(p.files||[]).find(x=>x.ident&&dig(x.ident.wo)===dig(wo)&&x.ident.name);
  if(f&&f.ident.name) p.name=f.ident.name;
  if(f&&f.ident.site) p.site=f.ident.site;
  save(); render();
  toast(T("اعتُمد رقم أمر العمل ","Work order adopted: ")+p.wo);
}

/* ── مراجعة كلود: تشمل فحص الهوية ── */
const _aiReview = aiReview;
aiReview = async function(){
  const p=P(), files=(p.files||[]).map(f=>({ملف:f.name, نوع:f.ext, أمر_العمل:(f.ident&&f.ident.wo)||"—", موقوف:!!f.blocked}));
  const base = await _aiReview();
  if(!base) return base;
  const s=await aiGet(); if(!s) return base;
  try{
    const {text} = await s(
`أنت مدقق بيانات في إدارة مشاريع كهرباء. بيانات المشروع بالمنصة: أمر العمل ${p.wo}، الاسم "${p.name}"، الموقع "${p.site}".
والملفات المرفوعة: ${JSON.stringify(files)}
اكتب سطرين فقط بالعربية: الأول عن مدى تطابق أرقام أوامر العمل والأسماء بين المنصة والملفات، والثاني عن أي ملف يُشتبه أنه يخص مشروعًا آخر أو ينقص. ابدأ كل سطر بـ «• ». لا تكرر الأرقام كلها.`,
      {modelTier:"quick"});
    return (text? text.trim()+"\n\n" : "") + base;

};

/* ── الربط ── */
(function(){
  const _me = masterExtras;

<script>
"use strict";
/* ═══════════ شريط التحديث واستكمال البيانات الناقصة — في كل صفحة ═══════════ */
const PAGE_NAMES = {dash:["لوحة التحكم","Control centre"], master:["الماستر والكروكي","Master & layout"],
  boq:["المقايسة والمقارنة","BOQ & variance"], wages:["فاتورة الأجور","Wages invoice"],
  forms:["النماذج والاستلام","Forms & acceptance"], map:["الخريطة والإحداثيات","Map & coordinates"],
  recs:["المقترحات والمستندات","Recommendations"]};

/* ── ما ينقص كل صفحة ── */
function missingFor(page){
  const p=P(), t=totals(p), d=p.derived, out=[];
  const pts=(typeof geoPoints==="function")?geoPoints(p):[];
  const add=(n, ar, en, hint, go)=>{ if(n>0) out.push({n, t:T(ar,en), hint, go}); };
  const noGps = p.rmus.filter(r=>!String(r.gps||"").trim()).length;
  const loose = (p.geo||[]).length;
  const boqZero = Object.keys(p.boq).filter(c=>!p.boq[c].plan && !p.boq[c].exec).length;
  const boqNoExec = Object.keys(p.boq).filter(c=>p.boq[c].plan && !p.boq[c].exec).length;
  const matZero = Object.keys(p.mat).filter(c=>!p.mat[c].iss && !p.mat[c].req).length;
  const derNotInBoq = d? Object.keys(d.works).filter(c=>d.works[c]>0 && !p.boq[c]).length : 0;

    add((p.estCost.mat+p.estCost.inst)?0:1, "المقايسة التقديرية غير مُدخلة","Estimated BOQ cost empty", T("تُملأ من ناتج الكروكي","Filled from the derived takeoff"), "master");
    add(p.files.length?0:1, "لا توجد ملفات مرفوعة","No files uploaded", T("ارفع الكروكي وملفات الإكسل","Upload the layout and Excel files"), "master");
  }
  if(page==="master"){
    add(p.files.length?0:1, "لا توجد ملفات مرفوعة","No files uploaded", T("ارفع الكروكي والنماذج","Upload the layout and forms"), null);

    add(p.wo?0:1, "رقم أمر العمل غير مُدخل","Work order not set", T("يُقرأ من الملفات","Read from the files"), null);

    add((p.files||[]).filter(f=>f.blocked).length, "ملف موقوف لاختلاف أمر العمل","file(s) blocked on a work-order mismatch", T("راجع بطاقة الهوية","See the identity card"), null);

    add(derNotInBoq, "بند مستنبط غير مدرج بالمقايسة","derived item(s) missing from the BOQ", T("يُضاف بالتحديث","Added on refresh"), null);
    add(matZero, "مادة بلا كميات","material(s) with no quantities", T("تُملأ من المصروف والمستنبط","Filled from issues and the takeoff"), null);
    add(derMatNotIn, "مادة مستنبطة غير مدرجة","derived material(s) not listed", T("تُضاف بالتحديث","Added on refresh"), null);
  }
  if(page==="wages"){
    add(boqNoExec, "بند مخطط بلا تنفيذ","planned item(s) with no execution", T("ارفع فاتورة الأجور أو ملف المواد والأجور","Upload the wages invoice or the materials & wages file"), null);
    add(String(p.approvedDate||"").trim()?0:1, "تاريخ اعتماد المقايسة غير مُدخل","BOQ approval date not set", T("يُقرأ من ملف الصلاحية","Read from the authority file"), null);
    add((p.estCost.mat+p.estCost.inst)?0:1, "التكلفة التقديرية غير مُدخلة","Estimated cost empty", T("تُملأ من ناتج الكروكي","Filled from the derived takeoff"), null);
  }
  if(page==="forms"){
    add(p.rmus.length?0:1, "جدول الوحدات فارغ","Unit schedule empty", T("ارفع ملف ضبط الحماية أو الاستلام","Upload the protection or acceptance file"), null);
    add(p.rmus.filter(r=>!r.set).length, "وحدة لم يكتمل ضبط حمايتها","unit(s) without protection settings", T("تُقرأ من ملف ضبط الحماية","Read from the protection file"), null);

    add(p.rmus.filter(r=>!String(r.ohm||"").trim()).length, "وحدة بلا قياس مقاومة تأريض","unit(s) without an earth-resistance value", T("تُقرأ من ملف الاستلام النهائي","Read from the final acceptance file"), null);
    add(noGps, "وحدة بلا إحداثيات","unit(s) without coordinates", T("تُطابق بأسمائها","Matched by name"), "map");
  }
  if(page==="map"){
    add(noGps, "وحدة بلا إحداثيات","unit(s) without coordinates", T("تُطابق باسم الوحدة مع نقاط الملفات المرفوعة","Matched by unit name against points from the uploaded files"), null);
    add(pts.length?0:1, "لا توجد نقاط على الخريطة","No points on the map", T("ارفع ضبط الحماية أو ملف KML/KMZ","Upload the protection file or a KML/KMZ"), null);
    add(noGps?loose:0, "نقطة مستخرجة غير مرتبطة بوحدة","loose point(s) not linked to a unit", T("تُربط آليًا عند تطابق الاسم","Linked automatically when the name matches"), null);

  }
  return out;
}

/* ── مطابقة النقاط المستخرجة بأسماء الوحدات ── */
function matchGeoUnits(rep){
  const p=P(), extras=p.geo||[]; if(!extras.length || !p.rmus.length) return 0;
  const key=x=>nz(String(x||"")).replace(/[^a-z0-9ا-ي]/gi,"").toUpperCase();
  let hit=0;
  p.rmus.forEach(r=>{
    if(String(r.gps||"").trim()) return;
    const ks=[r.rmu, r.no?("R"+r.no):""].map(key).filter(k=>k.length>=4);
    if(!ks.length) return;
    const i=extras.findIndex(g=>{ const id=key(g.id); return id.length>=4 && ks.some(k=>id===k||id.includes(k)||k.includes(id)); });
    if(i>=0){ r.gps = extras[i].lat+","+extras[i].lon; extras.splice(i,1); hit++; }
  });
  if(hit && rep) rep.push(["ok", T(`طُوبقت إحداثيات ${hit} وحدة بأسمائها من النقاط المستخرجة`,
    `${hit} unit(s) matched to extracted coordinates by name`)]);
  return hit;
}

/* ── تحديث واستكمال: يعيد قراءة الملفات ويملأ كل ناقص يمكن اشتقاقه ── */
async function smartFill(){
  if(AI.busy) return;
  const p=P(), rep=[];
  LASTSNAP = JSON.stringify({projects:S.projects, active:S.active});
  setBusy(true, T("تحديث واستكمال البيانات…","Refreshing & completing…"));
  try{
    // 1) إعادة قراءة كل ملف محفوظ في الجلسة
    let re=0, none=0;
    for(const f of (p.files||[])){
      if(f.blocked) continue;
      const sh=FILEDATA[f.id];
      if(Array.isArray(sh)){ f.rep=[]; await importFile(f, sh, true); (f.rep||[]).forEach(x=>rep.push(x)); re++; }
      else if(f.kind==="data") none++;
    }
    rep.unshift(["ok", re? T(`أُعيدت قراءة ${re} ملف من السجل`, `${re} file(s) re-read from the register`)
                      : T("لا توجد ملفات محفوظة في هذه الجلسة","No files cached in this session")]);
    if(none) rep.push(["warn", T(`${none} ملف بيانات يحتاج إعادة رفع ليُقرأ من جديد`, `${none} data file(s) need re-uploading to be read again`)]);
    // 2) هوية المشروع من الملفات
    (p.files||[]).forEach(f=>{ if(!f.blocked && f.ident) fillIdent(p, f.ident); });
    // 3) اشتقاق حصر اللوحات عكسيًا من البنود
    LASTREP = {file:T("تحديث واستكمال البيانات","Refresh & complete"), rep};
    if(!totals(p).rmuNew && (Object.keys(p.boq).length || p.rmus.length)) backfillTally(true);
    // 4) مطابقة الإحداثيات بالوحدات
    matchGeoUnits(rep);
    // 5) الاستنباط وملء ما لم يُدخل
    await runDerive(true, rep);
    // 6) التكلفة التقديرية من ناتج الكروكي
    if(p.derived && !(p.estCost.mat+p.estCost.inst)){
      p.estCost = {mat:Math.round(p.derived.cost.mat), inst:Math.round(p.derived.cost.inst), ind:Math.round(p.derived.cost.ind)};
      rep.push(["ok", T("مُلئت المقايسة التقديرية من ناتج الكروكي","Estimated BOQ cost filled from the derived takeoff")]);
    }
    const left = missingFor(S.page);
    rep.push([left.length?"warn":"ok", left.length
      ? T(`ما زال ينقص: ${left.map(x=>x.t+" ("+x.n+")").join("، ")}`, `Still missing: ${left.map(x=>x.t+" ("+x.n+")").join(", ")}`)
      : T("لا توجد بيانات ناقصة في هذه الصفحة","Nothing missing on this page")]);
  }catch(e){
    rep.push(["skip", T("تعذّر إكمال التحديث: ","Refresh failed: ")+(e.message||e)]);
  }
  LASTREP = {file:T("تحديث واستكمال — ","Refresh & complete — ")+T(...(PAGE_NAMES[S.page]||["",""])), rep};
  setBusy(false); save(); render();
  toast(T("تم تحديث البيانات واستكمال ما يمكن اشتقاقه","Data refreshed — everything derivable has been filled"));
}

  </div></div>`;

/* ── الربط في كل الصفحات ── */
(function(){
  try{ S.updOpen = localStorage.getItem(LS+"-updopen")==="1"; }catch(e){ S.updOpen=false; }
  const _r = render;
  render = function(){
    _r();
    const v=$("view"); if(!v) return;
    v.insertAdjacentHTML("afterbegin", updBar());
    const on=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
    on("updRun", smartFill);
    on("updAdd", ()=>$("updFile").click());
    on("updMore", ()=>{ S.updOpen=!S.updOpen; try{ localStorage.setItem(LS+"-updopen", S.updOpen?"1":"0"); }catch(e){} render(); });
    on("updUndo", ()=>undoImport());
    const fi=$("updFile"); if(fi) fi.onchange=()=>intakeFiles(fi.files);
    v.querySelectorAll("[data-goto]").forEach(b=>b.onclick=()=>{ S.page=b.dataset.goto; save(); render(); });
    v.querySelectorAll("[data-upre]").forEach(b=>b.onclick=async()=>{
      const id=b.dataset.upre, rec=P().files.find(f=>f.id===id), sh=FILEDATA[id];
      if(!rec||!Array.isArray(sh)){ toast(T("أعد رفع الملف","Re-upload the file")); return; }
      LASTSNAP=JSON.stringify({projects:S.projects, active:S.active});
      setBusy(true, T("إعادة الاستيراد…","Re-importing…"));
      rec.rep=[]; await importFile(rec, sh, true);
      const rep=(rec.rep||[]).slice();
      LASTREP={file:rec.name, rep};
      await runDerive(true, rep);
      setBusy(false); save(); render(); toast(T("أُعيد استيراد الملف وتحديث الصفحات","File re-imported — pages updated"));
    });
    v.querySelectorAll("[data-uprm]").forEach(b=>b.onclick=()=>{
      if(!b.dataset.armed){ b.dataset.armed="1"; b.textContent=T("تأكيد المسح","Confirm"); return; }
      P().files.splice(+b.dataset.uprm,1); save(); render(); toast(T("حُذف الملف من السجل","File removed from the register"));
    });
  };
  render();
})();

<script>
"use strict";
/* ═══════════ تجميع Google Earth — كل المشاريع وأوامر العمل في صفحة واحدة ═══════════ */
const GEO_HEX = ["49b9a4","e0ab55","8fb3ff","e58076","b08ee8","5fc27e","d99ac0","9fb7c9"];
const GA = {coord:true, sel:null, map:null};

/* كل النقاط في كل المشاريع، موسومة برقم أمر العمل */
function allProjPts(){
  return S.projects.map((p,i)=>{
    const pts = geoPoints(p);
    const fs = feeders(pts).filter(f=>!f.noRoute);
    const route = fs.reduce((s,f)=>s+f.len,0);
    return {i, id:p.id, wo:String(p.wo||"").trim(), name:p.name, site:p.site, hex:GEO_HEX[i%GEO_HEX.length],
            pts, chain:fs.flatMap(f=>f.pts), route, n:pts.length};
  });
}
function gaSelected(){
  const all=allProjPts();
  if(!GA.sel) GA.sel = Object.fromEntries(all.map(g=>[g.id, g.n>0]));
  all.forEach(g=>{ if(GA.sel[g.id]===undefined) GA.sel[g.id]=g.n>0; });
  return all.filter(g=>g.n && GA.sel[g.id]);
}
/* اسم المعلَم: رقم أمر العمل فوق المعدة ثم الإحداثي */
function gaLabel(g, q){
  const wo = g.wo || T("بلا أمر عمل","no W/O");
  return GA.coord ? `${wo} · ${q.id} · ${q.lat.toFixed(6)},${q.lon.toFixed(6)}` : `${wo} · ${q.id}`;
}

/* ── KML مجمّع: مجلد لكل أمر عمل ── */
function kmlAllDoc(){
  const gs=gaSelected();
  const kcol = hex => "ff"+hex.slice(4,6)+hex.slice(2,4)+hex.slice(0,2);
  const x = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const styles = gs.map((g,i)=>`
  <Style id="gl${i}"><LineStyle><color>${kcol(g.hex)}</color><width>4</width></LineStyle></Style>
  <Style id="gp${i}"><IconStyle><color>${kcol(g.hex)}</color><scale>1.15</scale>
    <Icon><href>http://maps.google.com/mapfiles/kml/shapes/placemark_circle.png</href></Icon></IconStyle>
    <LabelStyle><color>${kcol(g.hex)}</color><scale>0.9</scale></LabelStyle></Style>
  <Style id="gs${i}"><IconStyle><color>${kcol(g.hex)}</color><scale>1.25</scale>
    <Icon><href>http://maps.google.com/mapfiles/kml/shapes/square.png</href></Icon></IconStyle>
    <LabelStyle><color>${kcol(g.hex)}</color><scale>0.9</scale></LabelStyle></Style>`).join("");
  const folders = gs.map((g,i)=>`
  <Folder><name>${x(T("أمر عمل ","W/O ")+(g.wo||"—")+" — "+g.name)}</name><open>0</open>
    <description><![CDATA[${x(g.site||"")} · ${g.n} ${T("نقطة","points")} · ${T("مسار","route")} ${Math.round(g.route)} m]]></description>
    ${g.chain.length>1?`<Placemark><name>${x((g.wo||g.name)+" — "+T("المسار","route"))}</name><styleUrl>#gl${i}</styleUrl>
      <LineString><tessellate>1</tessellate><coordinates>${g.chain.map(q=>`${q.lon},${q.lat},0`).join(" ")}</coordinates></LineString></Placemark>`:""}
