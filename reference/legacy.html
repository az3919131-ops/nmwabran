<script>
"use strict";
/* ═══════════ توقيع مدير المشاريع ═══════════ */
const PM_ROLE_AR = "مدير المشاريع";
const PM_ROLE_EN = "Project manager";
const PM_NAME    = "Eng. Ahmed Zahran";
const PM_NAME_AR = "م. أحمد زهران";
/* نص عادي لكل المخرجات (إكسل، KML، CSV، النسخ الاحتياطية) */
const PM_PLAIN   = "Project manager · Eng. Ahmed Zahran";
const PM_PLAIN_AR= "مدير المشاريع · م. أحمد زهران — Project manager · Eng. Ahmed Zahran";

function pmHTML(extra){
  return `<div class="pmsign">
    <span class="rl">${esc(T(PM_ROLE_AR,PM_ROLE_EN))}</span><span class="dv">·</span>
    <span class="nm">${esc(PM_NAME)}</span>
    ${AR()?`<span class="dv">·</span><span>${esc(PM_NAME_AR)}</span>`:""}
    ${extra?`<span class="dv">·</span><span>${esc(extra)}</span>`:""}
  </div>`;
}
/* سطر داخل المخرجات النصية */
const pmLine = () => AR()? PM_PLAIN_AR : PM_PLAIN;

/* ── 1 · أسفل كل صفحة في الواجهة + داخل كل مستند/نموذج ── */
(function(){
  if(!$("pmPrint")){
    const d=document.createElement("div"); d.id="pmPrint";
    document.body.appendChild(d);
  }
  const _r = render;
  render = function(){
    _r();
    const p=P();
    $("pmPrint").textContent = `${PM_ROLE_EN} · ${PM_NAME}  —  ${p.name}${p.wo?" · W/O "+p.wo:""}`;
    const v=$("view");
    if(v){
      /* داخل كل مستند/نموذج قابل للطباعة */
      v.querySelectorAll(".doc").forEach(d=>{ if(!d.querySelector(".pmsign")) d.insertAdjacentHTML("beforeend", pmHTML()); });
      /* أسفل الصفحة كلها */
      const last=v.lastElementChild;
      if(!last || !last.classList.contains("pmsign"))
        v.insertAdjacentHTML("beforeend", pmHTML(p.name+(p.wo?" · "+p.wo:"")));
    }
    /* الشريط الجانبي */
    const rf=document.querySelector(".rail-foot");
    if(rf){
      let r=rf.querySelector(".pmrail");
      if(!r){ r=document.createElement("div"); r.className="pmrail"; rf.appendChild(r); }
      r.innerHTML=`${esc(T(PM_ROLE_AR,PM_ROLE_EN))}<br><b>${esc(PM_NAME)}</b>`;
    }
  };
  render();
})();

/* ── 2 · شرائح العرض التقديمي ── */
(function(){
  const _rd = renderDeck;
  renderDeck = function(){
    _rd();
    document.querySelectorAll("#deckStage .sl-foot").forEach(f=>{
      if(f.querySelector(".pmsg")) return;
      const s=document.createElement("span"); s.className="pmsg";
      s.textContent = PM_ROLE_EN+" · "+PM_NAME;
      f.insertBefore(s, f.lastElementChild);
    });
  };
})();

/* ── 3 · كل ملفات الإكسل (الحصر، الفاتورة، النماذج) ── */
(function(){
  const _b = buildXlsx;
  buildXlsx = function(sheets){
    const out=(sheets||[]).map(sh=>{
      const name=sh[0], rows=(sh[1]||[]).slice();
      rows.push([]);
      rows.push([T(PM_ROLE_AR,PM_ROLE_EN), PM_NAME]);
      rows.push([T("المنصة","Platform"), T("محفظة مشاريع المقاول","Contractor Project Portfolio"),
                 T("تاريخ التصدير","Exported"), new Date().toISOString().slice(0,16).replace("T"," ")]);
      return [name, rows];
    });
    return _b(out);
  };
})();

/* ── 4 · ملفات Google Earth والإحداثيات ── */
(function(){
  if(typeof kBalloon==="function"){
    const _kb = kBalloon;
    kBalloon = function(d, hex){
      return _kb(d,hex).replace(/<\/div>\s*$/,
        `<div style="padding:5px 12px 9px;background:#e9f1ef;color:#44595c;font-size:10px;text-align:center">
          ${KX(PM_ROLE_EN)} &#183; <b>${KX(PM_NAME)}</b></div></div>`);
    };
  }
  const tagDoc = s => s.replace(/<description><!\[CDATA\[([\s\S]*?)\]\]><\/description>/,
    (m,g)=>`<description><![CDATA[${g} · ${pmLine()}]]></description>`);
  const _kd = kmlDoc;   kmlDoc   = p => tagDoc(_kd(p));
  const _ka = kmlAllDoc; kmlAllDoc = () => tagDoc(_ka());
  const _cd = csvDoc;   csvDoc   = p => _cd(p)+"\r\n\r\n"+`"${PM_ROLE_EN}","${PM_NAME}"`;
  const _gj = geojsonDoc;
  geojsonDoc = function(p){
    const o=JSON.parse(_gj(p));
    o.properties={...(o.properties||{}), project_manager:PM_NAME, role:PM_ROLE_EN,
      platform:"Contractor Project Portfolio", exported:new Date().toISOString()};
    return JSON.stringify(o,null,1);
  };
})();

/* ── 5 · النسخة الاحتياطية ── */
backupData = async function(){
  const data = JSON.stringify({v:1, at:new Date().toISOString(),
    platform:"Contractor Project Portfolio / محفظة مشاريع المقاول",
    role:PM_ROLE_EN, project_manager:PM_NAME,
    lang:S.lang, contractors:CONTRACTORS, projects:S.projects}, null, 1);
  const r = await saveFile(`portfolio-backup-${new Date().toISOString().slice(0,10)}.json`, data, "application/json");
  if(r === true) toast(T("تم حفظ نسخة احتياطية من كل المشاريع والمقاولين","Backup of all projects & contractors saved"));
};

/* استعادة النسخة الاحتياطية: تستعيد دفتر المقاولين أيضًا */
restoreData = function(file){
  const r=new FileReader();
  r.onload = () => {
    try{
      const o=JSON.parse(r.result);
      if(!o.projects || !o.projects.length) throw 0;
      if(Array.isArray(o.contractors) && o.contractors.length){
        CONTRACTORS.length=0; o.contractors.forEach(c=>CONTRACTORS.push(String(c)));
      }
      S.projects=o.projects; S.active=0; if(o.lang) S.lang=o.lang;
      firmGuard(); GA.sel=null; save(); render();
      toast(T("تم استعادة المشاريع والمقاولين","Projects & contractors restored"));
    }catch(e){ toast(T("الملف غير صالح — اختر ملف نسخة احتياطية بصيغة JSON","Invalid file — choose a JSON backup")); }
  };
  r.readAsText(file);
};

/* ── 6 · إجابات محفظة Ai ── */
(function(){
  if(typeof aiHTML!=="function") return;
  const _h = aiHTML;
  aiHTML = function(){
    return _h().replace(/<\/div>\s*$/, `${pmHTML()}</div>`);
  };
})();
</script>
<script>

const MODULES = [
  {id:"dash",  ar:"لوحة التحكم",          en:"Control centre"},

const ACTS = [["view","عرض","View"],["edit","إضافة/تعديل","Add / Edit"],["del","حذف","Delete"],["exp","تصدير","Export"]];

function defaultPerms(role){
  const P={};
  MODULES.forEach(m=>{
    if(role==="admin"){ P[m.id]={view:1,edit:1,del:1,exp:1}; return; }

    if(m.id==="import"){ P[m.id]={view:0,edit:0,del:0,exp:0}; return; }
    P[m.id]={view:1,edit:1,del:0,exp:1};

}

/* ── تجزئة SHA-256 — لا تُحفظ كلمة مرور نصًا أبدًا ── */
async function iltHash(user, pass){
  const b=new TextEncoder().encode("iltizam|"+String(user||"").trim().toLowerCase()+"|"+String(pass||""));
  const d=await crypto.subtle.digest("SHA-256", b);
  return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
const uFind = u => AUTH.users.find(x=>x.u===String(u||"").trim().toLowerCase());
const ME = () => AUTH.me ? uFind(AUTH.me) : null;
const isAdmin = () => { const m=ME(); return !!m && m.role==="admin"; };
function permsOf(x){ return (x && x.perms) ? x.perms : defaultPerms(x?x.role:"pm"); }
function can(mod, act){
  const m=ME(); if(!m || !m.active) return false;
  if(m.role==="admin") return true;
  const p=permsOf(m)[mod]; return !!(p && p[act]);
}
function logAdd(act, det){
  AUTH.log.unshift({at:new Date().toISOString(), u:AUTH.me||"—", act, det:det||""});
  AUTH.log=AUTH.log.slice(0,300);
}

/* ── التخزين: db المدمجة + نسخة محلية + تصدير دوري ── */
function iltState(){ return {v:1, at:Date.now(), users:AUTH.users, reqs:AUTH.reqs, log:AUTH.log}; }
function iltApply(o){
  if(!o || !Array.isArray(o.users) || !o.users.length) return false;
  AUTH.users=o.users; AUTH.reqs=o.reqs||[]; AUTH.log=o.log||[]; return true;
}
let iltSaveT=null;
function iltSave(){
  try{ localStorage.setItem(ILT_LS, JSON.stringify(iltState())); }catch(e){}
  if(AUTH.db){ clearTimeout(iltSaveT); iltSaveT=setTimeout(()=>{ try{ AUTH.db.set(iltState()); }catch(e){} }, 400); }
}
async function iltBoot(){
  if(AUTH.booted) return; AUTH.booted=true;
  try{ const raw=localStorage.getItem(ILT_LS); if(raw) iltApply(JSON.parse(raw)); }catch(e){}
  if(!AUTH.users.length) AUTH.users=SEED_USERS.map(x=>({...x, perms:defaultPerms(x.role)}));
  AUTH.users.forEach(x=>{ if(!x.perms) x.perms=defaultPerms(x.role); });
  try{ const s=sessionGet(); if(s && uFind(s)) AUTH.me=s; }catch(e){}
  AUTH.ready=true; gateRender();
  /* قاعدة البيانات المشتركة (في النسخة المنشورة) */
  try{
    const dbc = await (window.claude && window.claude.use ? window.claude.use("db") : null);
    if(dbc){
      AUTH.db = dbc.doc("auth/state");
      const snap = await AUTH.db.get();
      if(snap.exists && iltApply(snap.data())) { gateRender(); render(); }
      else await AUTH.db.set(iltState());
      AUTH.unsub = AUTH.db.onSnapshot(s=>{
        if(s.exists && iltApply(s.data())){ gateRender(); if(AUTH.me) render(); }
      }, ()=>{});
    }
  }catch(e){}
  try{ AUTH.mail = await (window.claude && window.claude.use ? window.claude.use("mcp") : null); }catch(e){ AUTH.mail=null; }
}
function sessionSet(u){ try{ localStorage.setItem(ILT_SESS, JSON.stringify({u, at:Date.now()})); }catch(e){} }
function sessionGet(){
  try{ const o=JSON.parse(localStorage.getItem(ILT_SESS)||"null");
    if(o && o.u && Date.now()-o.at < 12*3600e3) return o.u; }catch(e){}
  return null;
}
function sessionClear(){ try{ localStorage.removeItem(ILT_SESS); }catch(e){} }
</script>
<script>
"use strict";
/* ═══════════ شاشة الدخول ═══════════ */
const GATE = {err:"", busy:false, show:false};
/* لا تُعرض أي بيانات أو أرقام قبل الدخول */
const GATE_POINTS = () => [
  [T("حصر الكميات والمقايسة","Takeoff & BOQ"),      T("الكروكي والمواد والأجور والفواتير","layouts, materials, works and invoices")],
  [T("ضبط الحماية والإحداثيات","Settings & coordinates"), T("كل معدة على خريطة واحدة","every unit on one map")],
  [T("النماذج والاستلام","Forms & acceptance"),      T("مستندات جاهزة للاستشاري","consultant-ready documents")]
];

function gateHTML(){
  return `
  <div class="gate-brand">
    <div class="gate-logo"><img src="${ORG_LOGO}" alt=""><span><b>${esc(T(ORG_AR,ORG_EN))}</b>${esc(T("مشاريع التحويل — نجران","Conversion projects — Najran"))}</span></div>
    <div class="gate-h">
      <h1>${T("محفظة الالتزام","Compliance Vault")}</h1>
      <p>${T("بوابة الدخول إلى محفظة مشاريع المقاول. كل مستخدم يرى ما تسمح به صلاحيته فقط، وكل استيراد وتعديل وتصدير يُسجَّل باسمه.",
             "The gateway to the contractor project portfolio. Each user sees only what their permissions allow, and every import, edit and export is recorded under their name.")}</p>
    </div>
    <div class="gate-facts">${GATE_POINTS().map(([a,b])=>`<div><b class="pt">${esc(a)}</b><span>${esc(b)}</span></div>`).join("")}</div>
  </div>
  <div class="gate-form"><div class="gate-card">
    <h2>${T("تسجيل الدخول","Sign in")}</h2>
    <p class="sub">${T("أدخل اسم المستخدم وكلمة المرور الخاصين بك. لا تُعرض كلمات المرور في أي مكان داخل المنصة.",
                       "Enter your username and password. Passwords are never shown anywhere in the platform.")}</p>
    ${GATE.err?`<div class="gate-err">${esc(GATE.err)}</div>`:""}
    <label class="fld"><span>${T("اسم المستخدم","Username")}</span>
      <input type="text" id="gU" autocomplete="username" dir="ltr" placeholder="username"></label>
    <label class="fld"><span>${T("كلمة المرور","Password")}</span>
      <span class="pwrow"><input type="${GATE.show?"text":"password"}" id="gP" autocomplete="current-password" dir="ltr">
        <button type="button" class="pweye" id="gEye" aria-label="${T("إظهار كلمة المرور","Show password")}">${GATE.show?"🙈":"👁"}</button></span></label>
    <button class="btn pri big" id="gGo" ${GATE.busy?"disabled":""}>${GATE.busy?T("جارٍ التحقق…","Checking…"):T("دخول","Sign in")}</button>
    <div class="gate-note">
      ${T("نسيت كلمة المرور؟ تواصل مع مدير النظام","Forgot your password? Contact the system administrator")}
      <b> ${esc(ILT_OWNER)}</b> — <span dir="ltr">${esc(ILT_EMAIL)}</span>.<br>
      ${T("تغيير كلمة المرور يتم من داخل المنصة بعد الدخول، برمز تحقق يُرسل إلى بريد مدير النظام.",
          "Password changes happen inside the platform after signing in, with a verification code sent to the administrator's inbox.")}
    </div>
    <div class="gate-note" style="border:0;padding-top:0">

}
function gateRender(){
  let g=$("gate");
  if(!g){ g=document.createElement("div"); g.className="gate"; g.id="gate"; g.setAttribute("role","dialog"); document.body.appendChild(g); }
  if(AUTH.me && uFind(AUTH.me) && uFind(AUTH.me).active){
    g.hidden=true; g.innerHTML=""; document.body.classList.add("authed"); document.body.style.overflow=""; return; }
  document.body.classList.remove("authed");
  g.hidden=false; g.innerHTML=gateHTML(); document.body.style.overflow="hidden";
  const go=async()=>{
    if(GATE.busy) return;
    const u=$("gU").value.trim().toLowerCase(), p=$("gP").value;
    if(!u||!p){ GATE.err=T("أدخل اسم المستخدم وكلمة المرور","Enter your username and password"); gateRender(); return; }
    GATE.busy=true; gateRender();
    const rec=uFind(u), h=await iltHash(u,p);
    GATE.busy=false;
    if(!rec || rec.hash!==h){
      GATE.err=T("اسم المستخدم أو كلمة المرور غير صحيحة","Incorrect username or password");
      logAdd("login_fail", u); iltSave(); gateRender(); return;
    }
    if(!rec.active){ GATE.err=T("هذا الحساب موقوف — راجع مدير النظام","This account is suspended — contact the administrator"); gateRender(); return; }
    GATE.err=""; AUTH.me=rec.u; AUTH.lock=true; sessionSet(rec.u);
    logAdd("login", rec.name); iltSave();
    const first=MODULES.find(m=>m.id!=="import"&&m.id!=="ai"&&can(m.id,"view"));
    if(!can(S.page,"view") && first) S.page=first.id;
    gateRender(); render();
    toast(T("مرحبًا ","Welcome ")+rec.name);
  };
  $("gGo").onclick=go;
  $("gEye").onclick=()=>{ GATE.show=!GATE.show; const v=$("gP").value, u=$("gU").value; gateRender(); $("gP").value=v; $("gU").value=u; $("gP").focus(); };
  ["gU","gP"].forEach(id=>{ $(id).onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } }; });
  setTimeout(()=>{ const el=$("gU"); if(el && !el.value) el.focus(); },50);
}
function iltLogout(){
  logAdd("logout",""); iltSave(); AUTH.me=null; AUTH.lock=true; sessionClear();
  GATE.err=""; gateRender(); toast(T("تم تسجيل الخروج","Signed out"));
}

/* ═══════════ قفل التعديل — بكلمة مرور مدير النظام ═══════════ */
function lockToggle(){
  if(!AUTH.lock){ AUTH.lock=true; logAdd("lock",""); iltSave(); render(); toast(T("تم تفعيل قفل التعديل","Edit lock engaged")); return; }
  const w=document.createElement("div"); w.className="askwrap";
  w.innerHTML=`<div class="askbox"><h4>${T("فتح قفل التعديل","Unlock editing")}</h4>
    <p>${T("أدخل كلمة مرور مدير النظام لفتح التعديل والاستيراد في هذه الجلسة.","Enter the system administrator password to unlock editing and importing for this session.")}</p>
    <span class="pwrow"><input type="password" id="lkP" dir="ltr" autocomplete="off">
      <button type="button" class="pweye" id="lkEye">👁</button></span>
    <div id="lkErr" class="gate-err" hidden></div>
    <div class="askbtns"><button class="btn sm" id="lkNo">${T("إلغاء","Cancel")}</button>
      <button class="btn sm pri" id="lkYes">${T("فتح القفل","Unlock")}</button></div></div>`;
  document.body.appendChild(w);
  const close=()=>w.remove(), inp=w.querySelector("#lkP");
  setTimeout(()=>inp.focus(),30);
  w.querySelector("#lkNo").onclick=close;
  w.querySelector("#lkEye").onclick=()=>{ inp.type = inp.type==="password"?"text":"password"; };
  const go=async()=>{
    const adm=AUTH.users.filter(x=>x.role==="admin"&&x.active);
    const h=await Promise.all(adm.map(a=>iltHash(a.u, inp.value)));
    if(adm.some((a,i)=>a.hash===h[i])){
      close(); AUTH.lock=false; logAdd("unlock", ME()?ME().name:""); iltSave(); render();
      toast(T("تم فتح قفل التعديل","Editing unlocked"));
    } else {
      const e=w.querySelector("#lkErr"); e.hidden=false;
      e.textContent=T("كلمة مرور مدير النظام غير صحيحة","Incorrect administrator password");
      logAdd("unlock_fail",""); iltSave(); inp.select();
    }
  };
  w.querySelector("#lkYes").onclick=go;
  inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); go(); } if(e.key==="Escape") close(); };
  w.onclick=e=>{ if(e.target===w) close(); };
}
const editable = mod => can(mod,"edit") && !AUTH.lock;
</script>
<script>
"use strict";
/* ═══════════ تغيير كلمة المرور — رمز تحقق إلى بريد مدير النظام ═══════════ */
const PWF = {step:1, busy:false, err:"", ok:"", req:null, show:false};
const code6 = () => String(crypto.getRandomValues(new Uint32Array(1))[0] % 1e6).padStart(6,"0");
const MAIL_MSG = {
  not_granted:        ["لم يُسمح للصفحة بإرسال البريد","Email sending was not allowed for this page"],
  capability_disabled:["إرسال البريد غير متاح في هذه النسخة","Email sending is unavailable in this copy"],
  capability_removed: ["إرسال البريد غير متاح في هذه النسخة","Email sending is unavailable in this copy"],
  server_not_connected:["موصّل Gmail غير مضاف — أضفه من إعدادات claude.ai ← الموصّلات","Gmail is not connected — add it in claude.ai Settings → Connectors"],
  needs_reauth:       ["انتهت صلاحية ربط Gmail — أعد ربطه من إعدادات claude.ai","Gmail needs reconnecting in claude.ai Settings"],
  selection_required: ["لديك أكثر من حساب Gmail — اختر واحدًا عند الطلب","More than one Gmail connector — choose one when prompted"],
  not_in_manifest:    ["لم تُسمح هذه الصفحة باستخدام Gmail","This page was not allowed to use Gmail"],
  blocked_by_policy:  ["سياسة مؤسستك تمنع الإرسال من هذه الصفحة","Your organization's policy blocks sending from this page"],
  approval_required:  ["الإرسال يحتاج موافقة إدارية","Sending needs an administrator approval"],
  server_unavailable: ["خدمة البريد غير متاحة مؤقتًا","The mail service is temporarily unavailable"],
  tool_error:         ["رفض Gmail الإرسال","Gmail refused to send"],
  no_mcp:             ["إرسال البريد يعمل في النسخة المنشورة فقط","Email sending works in the published copy only"]
};
const mailMsg = c => { const m=MAIL_MSG[c]||["تعذّر إرسال البريد","Could not send the email"]; return T(m[0],m[1]); };

async function pwSendCode(req, code){
  if(!AUTH.mail) return {ok:false, code:"no_mcp"};
  const body =
`${ILT_APP.ar} — ${ILT_APP.en}
طلب تغيير كلمة مرور

المستخدم: ${req.name} (${req.u})
الدور: ${T(ROLES[req.role].ar, ROLES[req.role].en)}
رمز التحقق: ${code}
صالح حتى: ${new Date(req.exp).toLocaleString("ar-EG")}
رقم الطلب: ${req.id}

إن لم يكن هذا الطلب منك، تجاهل الرسالة ولن يتغير شيء.
يمكنك أيضًا اعتماد الطلب أو رفضه من صفحة «المستخدمون والصلاحيات» داخل المنصة.

محفظة مشاريع المقاول · Project manager · Eng. Ahmed Zahran`;
  try{
    await AUTH.mail.callTool("Gmail","send_message",
      {to:[ILT_EMAIL], subject:`[${ILT_APP.ar}] رمز تغيير كلمة مرور — ${req.name} (${req.u})`, body});
    return {ok:true};
  }catch(e){ return {ok:false, code:(e&&e.code)||"upstream_error", msg:(e&&e.message)||""}; }
}
async function pwNotify(req){
  if(!AUTH.mail) return;
  try{
    await AUTH.mail.callTool("Gmail","send_message", {to:[ILT_EMAIL],
      subject:`[${ILT_APP.ar}] تم تغيير كلمة مرور — ${req.name} (${req.u})`,
      body:`تم تغيير كلمة مرور المستخدم ${req.name} (${req.u}) بنجاح في ${new Date().toLocaleString("ar-EG")}.\nرقم الطلب: ${req.id}\n\nمحفظة مشاريع المقاول · Project manager · Eng. Ahmed Zahran`});
  }catch(e){}
}
function pwOpen(){
  PWF.step=1; PWF.err=""; PWF.ok=""; PWF.req=null; PWF.busy=false;
  const w=document.createElement("div"); w.className="askwrap"; w.id="pwWrap";
  document.body.appendChild(w); pwDraw();
}
function pwClose(){ const w=$("pwWrap"); if(w) w.remove(); }
function pwField(id,label){
  return `<label class="fld"><span>${esc(label)}</span><span class="pwrow">
    <input type="${PWF.show?"text":"password"}" id="${id}" dir="ltr" autocomplete="off">
    <button type="button" class="pweye" data-eye="${id}">${PWF.show?"🙈":"👁"}</button></span></label>`;
}
function pwDraw(){
  const w=$("pwWrap"); if(!w) return; const me=ME(); if(!me) return;
  w.innerHTML = PWF.step===1 ? `<div class="askbox">
      <h4>${T("تغيير كلمة المرور","Change password")}</h4>
      <p>${T("بعد إدخال كلمة المرور الجديدة يُرسل رمز من 6 أرقام إلى بريد مدير النظام للتأكيد.",
             "After you enter the new password, a 6-digit code is emailed to the administrator for confirmation.")}
         <span dir="ltr">${esc(ILT_EMAIL)}</span></p>
      ${PWF.err?`<div class="gate-err">${esc(PWF.err)}</div>`:""}
      ${pwField("pw0", T("كلمة المرور الحالية","Current password"))}
      ${pwField("pw1", T("كلمة المرور الجديدة (4 أحرف فأكثر)","New password (4+ characters)"))}
      ${pwField("pw2", T("تأكيد كلمة المرور الجديدة","Confirm new password"))}
      <div class="askbtns"><button class="btn sm" id="pwNo">${T("إلغاء","Cancel")}</button>
        <button class="btn sm pri" id="pwGo" ${PWF.busy?"disabled":""}>${PWF.busy?T("جارٍ الإرسال…","Sending…"):T("إرسال رمز التحقق","Send code")}</button></div>
    </div>` : `<div class="askbox">
      <h4>${T("أدخل رمز التحقق","Enter the verification code")}</h4>
      ${PWF.ok?`<p style="color:var(--ok)">${esc(PWF.ok)}</p>`:""}
      <p>${T("الرمز صالح 30 دقيقة، ولديك 5 محاولات.","The code is valid for 30 minutes; you have 5 attempts.")}
        ${PWF.req?`<br><span class="muted" style="font-size:11.5px">${T("رقم الطلب","Request")}: <span dir="ltr">${esc(PWF.req.id)}</span> · ${T("المحاولات المتبقية","Attempts left")}: ${5-(PWF.req.tries||0)}</span>`:""}</p>
      ${PWF.err?`<div class="gate-err">${esc(PWF.err)}</div>`:""}
      <input type="text" id="pwC" dir="ltr" inputmode="numeric" maxlength="6" placeholder="------"
        style="text-align:center;letter-spacing:.5em;font-family:var(--f-mono);font-size:19px">
      <div class="askbtns"><button class="btn sm" id="pwNo">${T("إغلاق","Close")}</button>
        <button class="btn sm pri" id="pwVer" ${PWF.busy?"disabled":""}>${T("تأكيد التغيير","Confirm change")}</button></div>
    </div>`;
  w.querySelectorAll("[data-eye]").forEach(b=>b.onclick=()=>{
    const vals={}; w.querySelectorAll("input").forEach(i=>vals[i.id]=i.value);
    PWF.show=!PWF.show; pwDraw();
    Object.keys(vals).forEach(k=>{ const el=$(k); if(el) el.value=vals[k]; });
  });
  const no=$("pwNo"); if(no) no.onclick=pwClose;
  const go=$("pwGo");
  if(go) go.onclick=async()=>{
    if(PWF.busy) return;
    const cur=$("pw0").value, n1=$("pw1").value, n2=$("pw2").value;
    if(n1.length<4){ PWF.err=T("كلمة المرور الجديدة يجب ألا تقل عن 4 أحرف","The new password must be at least 4 characters"); pwDraw(); return; }
    if(n1!==n2){ PWF.err=T("كلمتا المرور الجديدتان غير متطابقتين","The two new passwords do not match"); pwDraw(); return; }
    PWF.busy=true; PWF.err=""; pwDraw();
    const h0=await iltHash(me.u, cur);
    if(h0!==me.hash){ PWF.busy=false; PWF.err=T("كلمة المرور الحالية غير صحيحة","The current password is incorrect");
      logAdd("pw_bad_current", me.u); iltSave(); pwDraw(); return; }
    const code=code6(), newHash=await iltHash(me.u, n1), codeHash=await iltHash("code|"+me.u, code);
    const req={id:"PW"+Date.now().toString(36).toUpperCase(), u:me.u, name:me.name, role:me.role,
      newHash, codeHash, at:Date.now(), exp:Date.now()+30*60e3, tries:0, status:"sent"};
    const r=await pwSendCode(req, code);
    PWF.busy=false;
    if(r.ok){ PWF.ok=T("أُرسل الرمز إلى بريد مدير النظام.","The code was emailed to the administrator."); }
    else { req.status="pending"; req.mailErr=r.code;
      PWF.ok=T("تعذّر إرسال البريد — الطلب الآن «قيد الانتظار» ويعتمده مدير النظام من صفحة المستخدمين.",
               "Email could not be sent — the request is now pending and the administrator approves it from the users page.")
             +" ("+mailMsg(r.code)+")"; }
    AUTH.reqs.unshift(req); AUTH.reqs=AUTH.reqs.slice(0,40);
    logAdd("pw_request", me.u+" · "+(r.ok?"emailed":"pending")); iltSave();
    PWF.req=req; PWF.step=2; pwDraw(); render();
  };
  const ver=$("pwVer");
  if(ver) ver.onclick=async()=>{
    const req=AUTH.reqs.find(x=>x.id===(PWF.req||{}).id); if(!req){ pwClose(); return; }
    if(req.status==="done"){ PWF.err=T("هذا الطلب نُفّذ بالفعل","This request was already applied"); pwDraw(); return; }
    if(Date.now()>req.exp){ req.status="expired"; iltSave(); PWF.err=T("انتهت صلاحية الرمز — ابدأ طلبًا جديدًا","The code expired — start a new request"); pwDraw(); render(); return; }
    if((req.tries||0)>=5){ req.status="blocked"; iltSave(); PWF.err=T("استُنفدت المحاولات — راجع مدير النظام","Attempts exhausted — contact the administrator"); pwDraw(); render(); return; }
    const h=await iltHash("code|"+req.u, $("pwC").value.trim());
    if(h!==req.codeHash){ req.tries=(req.tries||0)+1; logAdd("pw_code_bad", req.u); iltSave();
      PWF.err=T("الرمز غير صحيح — المحاولات المتبقية ","Incorrect code — attempts left ")+(5-req.tries); pwDraw(); render(); return; }
    await pwApply(req); pwClose();
  };
  const c=$("pwC"); if(c){ setTimeout(()=>c.focus(),40); c.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); ver.click(); } }; }
  w.onclick=e=>{ if(e.target===w) pwClose(); };
}
async function pwApply(req){
  const rec=uFind(req.u); if(!rec) return;
  rec.hash=req.newHash; req.status="done"; req.doneAt=Date.now();
  logAdd("pw_changed", req.u); iltSave(); render();
  toast(T("تم تغيير كلمة المرور","Password changed"));
  pwNotify(req);
}
</script>
<script>

/* ═══════════ صفحة المستخدمون والصلاحيات (مدير النظام فقط) ═══════════ */
const USEL = {u:null};
const initials2 = n => (String(n||"").replace(/[^\p{L}\p{N} ]/gu," ").trim().split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("")||"??");

function viewUsers(){
  if(!isAdmin()) return `<div class="card"><div class="body denied"><div class="ic">🔒</div>
    <h3>${T("هذه الصفحة لمدير النظام فقط","This page is for the system administrator only")}</h3>
    <p>${T("إدارة المستخدمين والصلاحيات متاحة لحساب مدير النظام وحده. للاستفسار تواصل مع ","User and permission management is restricted to the administrator account. Contact ")}
      <b>${esc(ILT_OWNER)}</b> — <span dir="ltr">${esc(ILT_EMAIL)}</span>.</p></div></div>`;
  const sel = uFind(USEL.u) || AUTH.users[0];
  const pend = AUTH.reqs.filter(r=>r.status==="pending"||r.status==="sent");
  return `
  <div class="sec-title"><h2>${T("المستخدمون والصلاحيات","Users & permissions")}</h2>
    <span class="s">${esc(T(ILT_APP.ar,ILT_APP.en))} — ${T("من يدخل، وماذا يرى، وماذا يستطيع أن يفعل","who signs in, what they see, and what they may do")}</span>
    <span style="flex:1 1 auto"></span>
    <button class="btn sm pri noprint" id="uAdd">${T("+ مستخدم جديد","+ New user")}</button>

      <span class="d">${esc(ILT_OWNER)}</span></div>

    <div class="stat"><span class="k">${T("أحداث مسجّلة","Logged events")}</span><span class="v">${nf(AUTH.log.length)}</span>
      <span class="d">${T("آخر 300 حدث","last 300 events")}</span></div>
  </div>

  ${pend.length?`<div class="card"><header><h3>${T("طلبات تغيير كلمة المرور","Password change requests")}</h3>
    <span class="sub">${T("اعتمد الطلب ليُطبّق فورًا، أو ارفضه فيُلغى","Approve to apply immediately, or reject to cancel")}</span></header>
    <div class="body tight scroll"><table><thead><tr>
      <th>${T("الطلب","Request")}</th><th>${T("المستخدم","User")}</th><th>${T("الحالة","Status")}</th>
      <th>${T("البريد","Email")}</th><th>${T("ينتهي","Expires")}</th><th class="noprint">${T("إجراء","Action")}</th></tr></thead>
      <tbody>${pend.map(r=>`<tr>
        <td class="code">${esc(r.id)}</td><td>${esc(r.name)} <span class="code">(${esc(r.u)})</span></td>
        <td><span class="pill ${r.status==="sent"?"ok":"warn"}">${r.status==="sent"?T("أُرسل الرمز","Code sent"):T("قيد الانتظار","Pending")}</span></td>
        <td style="font-size:11.5px">${r.mailErr?esc(mailMsg(r.mailErr)):T("تم الإرسال للبريد","Emailed")}</td>
        <td class="n">${new Date(r.exp).toLocaleString(AR()?"ar-EG":"en-GB",{dateStyle:"short",timeStyle:"short"})}</td>
        <td class="noprint"><div class="rowflex">
          <button class="btn sm pri" data-pwok="${esc(r.id)}">${T("اعتماد","Approve")}</button>

  <div class="card"><header><h3>${T("الحسابات","Accounts")}</h3>

        <th>${T("الحالة","Status")}</th><th class="noprint">${T("إجراءات","Actions")}</th></tr></thead>
        <tbody>${AUTH.users.map(x=>`<tr${sel&&x.u===sel.u?' style="background:var(--accent-soft)"':""} data-upick="${esc(x.u)}" style="cursor:pointer">

          <td><select data-urole="${esc(x.u)}" ${x.u===AUTH.me?"disabled":""} style="min-width:120px">
            ${Object.keys(ROLES).map(r=>`<option value="${r}" ${x.role===r?"selected":""}>${esc(T(ROLES[r].ar,ROLES[r].en))}</option>`).join("")}

          <td class="noprint"><div class="rowflex">
            <button class="btn sm gh" data-uren="${esc(x.u)}">${T("الاسم","Rename")}</button>

      <div class="body"><div class="note">${T("كلمات المرور لا تُعرض في أي مكان. تُحفظ كتجزئة SHA-256 للنص «iltizam | اسم المستخدم | كلمة المرور»، ولا يمكن استرجاع الكلمة من التجزئة — يمكن فقط تعيين كلمة جديدة.",
        "Passwords are never displayed. They are stored as the SHA-256 hash of “iltizam | username | password”; the password cannot be recovered from the hash — only replaced.")}</div></div>
  </div>

  <div class="card"><header><h3>${T("صلاحيات: ","Permissions: ")}${esc(sel?sel.name:"—")}</h3>
      <span class="sp"></span>
      <button class="btn sm gh noprint" id="uReset">${T("إعادة لصلاحيات الدور","Reset to role defaults")}</button></header>

      ${sel? `<table class="permtbl"><thead><tr><th>${T("الوحدة","Module")}</th>
        ${ACTS.map(a=>`<th>${esc(T(a[1],a[2]))}</th>`).join("")}</tr></thead><tbody>
        ${MODULES.map(m=>{ const p=permsOf(sel)[m.id]||{}; return `<tr>
          <td>${esc(T(m.ar,m.en))}${m.id==="users"?` <span class="pill warn" style="font-size:10px">${T("حسّاس","sensitive")}</span>`:""}</td>
          ${ACTS.map(a=>`<td><label class="sw"><input type="checkbox" data-perm="${esc(sel.u)}|${m.id}|${a[0]}"

        </tr>`; }).join("")}
      </tbody></table>` : ""}
      </div>

        : T("التعديل يسري فورًا على جلسة المستخدم عند أول تحديث للصفحة.","Changes take effect on the user's session at its next refresh.")}</div></div>
  </div>

  <div class="card"><header><h3>${T("سجل الأحداث","Audit log")}</h3>
    <span class="sub">${T("دخول وخروج، فتح القفل، تغيير الصلاحيات وكلمات المرور، الاستيراد والتصدير","sign-ins, unlocks, permission and password changes, imports and exports")}</span>
    <span class="sp"></span><button class="btn sm gh noprint" id="uClr">${T("تفريغ السجل","Clear log")}</button></header>
    <div class="body tight scroll" style="max-height:330px;overflow-y:auto"><table class="logtbl"><thead><tr>
      <th>${T("الوقت","Time")}</th><th>${T("المستخدم","User")}</th><th>${T("الحدث","Event")}</th><th>${T("التفصيل","Detail")}</th></tr></thead>
      <tbody>${AUTH.log.slice(0,60).map(l=>`<tr>
        <td class="n">${new Date(l.at).toLocaleString(AR()?"ar-EG":"en-GB",{dateStyle:"short",timeStyle:"medium"})}</td>
        <td class="code">${esc(l.u)}</td><td>${esc(LOGNAME(l.act))}</td><td class="wrap-t">${esc(l.det)}</td></tr>`).join("")
        ||`<tr><td colspan="4" class="muted">${T("لا أحداث بعد","No events yet")}</td></tr>`}</tbody></table></div></div>

  <div class="card"><header><h3>${T("حدود الأمان — اقرأ هذا","Security limits — read this")}</h3></header>
    <div class="body" style="display:flex;flex-direction:column;gap:11px;font-size:12.8px;line-height:1.95;color:var(--ink-2)">
      <div class="note warn"><b>${T("الحماية هنا على مستوى المتصفح.","Protection here is browser-level.")}</b>
        ${T("تسجيل الدخول والصلاحيات يمنعان الاستخدام الخاطئ ويوثّقان من فعل ماذا، لكن من يملك ملف الصفحة نفسه يستطيع قراءة البيانات المخزّنة في متصفحه أو تعطيل الواجهة. هذه حماية تنظيمية، وليست حماية تشفيرية ضد مهاجم.",
           "Sign-in and permissions prevent misuse and record who did what, but anyone holding the page file can read the data stored in their own browser or bypass the interface. This is organizational control, not cryptographic protection against an attacker.")}</div>
      <div><b>${T("ما هو محمي فعلًا:","What is genuinely protected:")}</b>
        ${T("كلمات المرور لا تُحفظ ولا تُعرض نصًا — تُحفظ كتجزئة SHA-256، فلا يستطيع أحد قراءتها من الملف أو من قاعدة البيانات.",
           "Passwords are never stored or displayed in clear text — only as SHA-256 hashes, so no one can read them from the file or the database.")}</div>
      <div><b>${T("أين تُحفظ البيانات:","Where the data lives:")}</b>
        ${T("دفتر المستخدمين والصلاحيات والسجل في مستند auth/state داخل قاعدة بيانات الـ Artifact، ويُحدَّث لدى الجميع لحظيًا. النسخة المحفوظة على جهازك تعمل على تخزين المتصفح المحلي فقط.",
           "The user register, permissions and log live in the auth/state document of the Artifact database and update live for everyone. The copy saved on your device uses local browser storage only.")}
        ${AUTH.db?`<span class="pill ok">${T("متصل بقاعدة البيانات","Database connected")}</span>`:`<span class="pill warn">${T("تخزين محلي فقط","Local storage only")}</span>`}</div>
      <div><b>${T("للحماية الحقيقية:","For real protection:")}</b>
        ${T("ضع البيانات في قاعدة بيانات بقواعد وصول على الخادم (Supabase/Postgres أو جداول عبر n8n) بحيث يتم التحقق من الهوية والصلاحية على الخادم لا في المتصفح. المنصة جاهزة لذلك: جداول work_orders و work_order_lines و contractors و consultants و users و emergency_tickets و targets و import_log و audit_log.",
           "Move the data to a server-side database with access rules (Supabase/Postgres, or tables through n8n) so identity and permission are checked on the server, not in the browser. The platform is ready for that: work_orders, work_order_lines, contractors, consultants, users, emergency_tickets, targets, import_log and audit_log.")}</div>
      <div><b>${T("نسخة احتياطية دورية:","Periodic backup:")}</b>
        ${T("اضغط «تصدير الدفتر» أسبوعيًا واحفظ ملف JSON خارج المنصة — يحتوي المستخدمين والصلاحيات والسجل بلا أي كلمة مرور صريحة.",
           "Press “Export register” weekly and keep the JSON file outside the platform — it holds users, permissions and the log, with no clear-text password.")}</div>
    </div></div>`;
}
function LOGNAME(a){
  const M={login:"تسجيل دخول", login_fail:"محاولة دخول فاشلة", logout:"تسجيل خروج", lock:"إقفال التعديل",
    unlock:"فتح قفل التعديل", unlock_fail:"فتح قفل فاشل", pw_request:"طلب تغيير كلمة مرور",
    pw_changed:"تغيير كلمة مرور", pw_bad_current:"كلمة مرور حالية خاطئة", pw_code_bad:"رمز تحقق خاطئ",
    pw_approved:"اعتماد طلب", pw_rejected:"رفض طلب", perm:"تعديل صلاحية", role:"تغيير دور",
    user_add:"إضافة مستخدم", user_del:"حذف مستخدم", user_tog:"إيقاف/تفعيل", user_ren:"تعديل اسم",
    user_pwd:"تعيين كلمة مرور", imported:"استيراد ملفات", files_cleared:"مسح الملفات المرفوعة", exported:"تصدير", denied:"محاولة بلا صلاحية"};
  const E={login:"Sign in", login_fail:"Failed sign-in", logout:"Sign out", lock:"Edit lock on",
    unlock:"Edit unlocked", unlock_fail:"Failed unlock", pw_request:"Password request",
    pw_changed:"Password changed", pw_bad_current:"Wrong current password", pw_code_bad:"Wrong code",
    pw_approved:"Request approved", pw_rejected:"Request rejected", perm:"Permission changed", role:"Role changed",
    user_add:"User added", user_del:"User deleted", user_tog:"Suspend/activate", user_ren:"Name changed",
    user_pwd:"Password set", imported:"Files imported", files_cleared:"Uploaded files cleared", exported:"Export", denied:"Blocked action"};
  return T(M[a]||a, E[a]||a);
}
VIEWS.users = viewUsers;
(function(){
  if(!PAGES.some(x=>x.id==="users")) PAGES.push({id:"users", ar:"المستخدمون والصلاحيات", en:"Users & permissions"});
})();
</script>
<script>
"use strict";
/* ═══════════ فرض الصلاحيات على كل المنصة ═══════════ */
function denyToast(mod, act){
  const m=MODULES.find(x=>x.id===mod)||{ar:mod,en:mod};
  const a=ACTS.find(x=>x[0]===act)||[act,act,act];
  logAdd("denied", T(m.ar,m.en)+" · "+T(a[1],a[2])); iltSave();
  toast(T("لا تملك صلاحية ","You do not have permission to ")+T(a[1],a[2])+T(" في ‹"," in ‹")+T(m.ar,m.en)+"›");
}
function lockToast(){ toast(T("التعديل مقفل — اضغط «قفل التعديل» أعلى الصفحة لفتحه بكلمة مرور مدير النظام",
  "Editing is locked — use the lock button in the top bar and the administrator password")); }
/* يلفّ دالة بحارس صلاحية (و قفل التعديل لإجراءات التغيير) */
function guard(name, mod, act){
  const f = window[name]; if(typeof f!=="function") return;
  window[name] = function(...a){
    if(!can(mod, act)){ denyToast(mod, act); return; }
    if((act==="edit"||act==="del") && AUTH.lock){ lockToast(); return; }
    if(act==="exp"){ logAdd("exported", name); iltSave(); }
    return f.apply(this, a);
  };
}
(function(){
  /* الاستيراد والمعالجة */
  ["intakeFiles","smartFill","rescanGeo","undoImport"].forEach(n=>guard(n,"import","edit"));
  if(typeof secImport==="function") guard("secImport","import","edit");
  if(typeof deriveAndReview==="function") guard("deriveAndReview","import","edit");
  /* التصدير */
  guard("exportWorkbook","qty","exp"); guard("invExcel","inv","exp");
  guard("exportGeo","map","exp");      guard("gaExport","map","exp");
  guard("backupData","dash","exp");    guard("restoreData","dash","edit");
  /* المشاريع والمقاولون */
  guard("addProject","firms","edit");  guard("firmAdd","firms","edit");
  guard("firmNewProject","firms","edit"); guard("firmRename","firms","edit");
  guard("firmMove","firms","edit");    guard("firmDelete","firms","del");
})();

/* ── شريط الهوية في الأعلى + تطبيق الصلاحيات على المعروض ── */
(function(){
  const _rr = renderRail;
  renderRail = function(){
    _rr();
    const nav=$("nav");
    if(nav) nav.querySelectorAll("button[data-page]").forEach(b=>{
      if(!can(b.dataset.page,"view")) b.remove();
    });
  };
  const _r = render;
  render = function(){
    if(!AUTH.ready || !AUTH.me){ gateRender(); return; }
    const me=ME();
    if(!me || !me.active){ AUTH.me=null; sessionClear(); gateRender(); return; }
    if(!can(S.page,"view")){
      const first=(PAGES.find(p=>can(p.id,"view"))||{}).id;
      if(first && first!==S.page){ S.page=first; }
    }
    _r();
    /* شريط المستخدم */
    const bar=document.querySelector(".topbar .rowflex");
    if(bar && !$("uWho")){
      const d=document.createElement("div"); d.id="uWho"; d.className="rowflex noprint";
      bar.insertBefore(d, bar.firstChild);
    }
    const who=$("uWho");
    if(who) who.innerHTML=`
      <button class="lockpill ${AUTH.lock?"on":"off"}" id="btnLock" title="${T("قفل التعديل والاستيراد","Edit & import lock")}">
        ${AUTH.lock?"🔒":"🔓"} ${AUTH.lock?T("مقفل","Locked"):T("مفتوح","Unlocked")}</button>
      <button class="btn sm gh" id="btnPwd">${T("كلمة المرور","Password")}</button>
      <span class="who"><span class="av">${esc(initials2(me.name))}</span>
        <span><span class="nm">${esc(me.name)}</span><span class="rl">${esc(T(ROLES[me.role].ar,ROLES[me.role].en))}</span></span></span>
      <button class="btn sm" id="btnOut">${T("خروج","Sign out")}</button>`;
    const on=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
    on("btnLock", lockToggle); on("btnPwd", pwOpen); on("btnOut", iltLogout);

    const v=$("view"); if(!v) return;
    const page=S.page;
    /* قفل التعديل / غياب صلاحية التعديل: تعطيل كل المدخلات */
    if(!editable(page)){
      v.querySelectorAll("input,select,textarea").forEach(el=>{
        if(el.closest(".pmsign")||el.type==="file") return;
        if(el.closest("#tblFirms")) return;
        el.disabled=true; el.classList.add("locked-field");
      });
    }
    /* الاستيراد */
    if(!can("import","edit") || AUTH.lock){
      ["updRun","updAdd","updMore","updUndo","btnDeriveAll","btnAiDerive"].forEach(id=>{ const e=$(id); if(e){ e.disabled=true; e.classList.add("locked-field"); } });
      v.querySelectorAll(".drop,[data-upre],[data-sec],[data-secimp]").forEach(e=>{ e.classList.add("locked-field"); });
    }
    /* الحذف */
    if(!can(page,"del") || AUTH.lock)
      v.querySelectorAll("[data-fdelp],[data-fdel],[data-udel],[data-delsheet]").forEach(e=>{ e.disabled=true; e.classList.add("locked-field"); });
    const bd=$("btnDelProject"); if(bd && (!can("firms","del")||AUTH.lock)){ bd.disabled=true; bd.classList.add("locked-field"); }
    /* محفظة Ai */
    const fab=$("aiFab"); if(fab) fab.hidden=!can("ai","view");
    const aib=$("btnAiAsk"); if(aib) aib.hidden=!can("ai","view");

    /* ربط صفحة المستخدمين */
    if(page==="users" && isAdmin()) wireUsers(v);
  };
})();

function wireUsers(v){
  const on=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  const touch=(a,d)=>{ logAdd(a,d); iltSave(); render(); };
  v.querySelectorAll("[data-upick]").forEach(tr=>tr.onclick=e=>{
    if(e.target.closest("button,select,input")) return;
    USEL.u=tr.dataset.upick; render();
  });
  v.querySelectorAll("[data-urole]").forEach(s=>s.onchange=()=>{
    const x=uFind(s.dataset.urole); if(!x) return;
    x.role=s.value; x.perms=defaultPerms(s.value); touch("role", x.u+" → "+s.value);
    toast(T("تم تغيير الدور وإعادة ضبط صلاحياته","Role changed and permissions reset"));
  });
  v.querySelectorAll("[data-perm]").forEach(c=>c.onchange=()=>{
    const [u,mod,act]=c.dataset.perm.split("|"); const x=uFind(u); if(!x) return;
    x.perms=x.perms||defaultPerms(x.role); x.perms[mod]=x.perms[mod]||{};
    x.perms[mod][act]=c.checked?1:0;
    if(act!=="view" && c.checked) x.perms[mod].view=1;
    if(act==="view" && !c.checked) ACTS.forEach(a=>x.perms[mod][a[0]]=0);
    touch("perm", x.u+" · "+mod+" · "+act+" = "+(c.checked?"1":"0"));
  });
  on("uReset", ()=>{ const x=uFind(USEL.u)||AUTH.users[0]; if(!x) return;
    x.perms=defaultPerms(x.role); touch("perm", x.u+" · "+T("إعادة ضبط","reset")); });
  v.querySelectorAll("[data-uren]").forEach(b=>b.onclick=()=>{
    const x=uFind(b.dataset.uren); if(!x) return;
    askText(T("اسم المستخدم المعروض","Display name"), x.name, "", n=>{ x.name=n; touch("user_ren", x.u+" → "+n); });
  });
  v.querySelectorAll("[data-utog]").forEach(b=>b.onclick=()=>{
    const x=uFind(b.dataset.utog); if(!x) return; x.active=x.active?0:1;
    touch("user_tog", x.u+" → "+(x.active?"active":"suspended"));
  });
  v.querySelectorAll("[data-udel]").forEach(b=>b.onclick=()=>{
    const x=uFind(b.dataset.udel); if(!x) return;
    if(AUTH.users.filter(y=>y.role==="admin"&&y.active).length<=1 && x.role==="admin"){
      toast(T("لا يمكن حذف مدير النظام الوحيد","Cannot delete the only administrator")); return; }
    askOk(T("حذف المستخدم","Delete user"),
      T(`سيُحذف حساب <b>${esc(x.name)}</b> (<span dir="ltr">${esc(x.u)}</span>) نهائيًا.`,
        `Account <b>${esc(x.name)}</b> (<span dir="ltr">${esc(x.u)}</span>) will be deleted permanently.`),
      ()=>{ AUTH.users=AUTH.users.filter(y=>y.u!==x.u); touch("user_del", x.u); }, T("حذف","Delete"));
  });
  v.querySelectorAll("[data-upwd]").forEach(b=>b.onclick=()=>{
    const x=uFind(b.dataset.upwd); if(!x) return;
    const w=document.createElement("div"); w.className="askwrap";
    w.innerHTML=`<div class="askbox"><h4>${T("تعيين كلمة مرور جديدة","Set a new password")}</h4>
      <p>${T("لـ","for")} <b>${esc(x.name)}</b> (<span dir="ltr">${esc(x.u)}</span>). ${T("لن تُعرض هذه الكلمة بعد الحفظ.","It will never be shown again after saving.")}</p>
      <span class="pwrow"><input type="password" id="spP" dir="ltr" autocomplete="off" placeholder="${T("4 أحرف فأكثر","4+ characters")}">
        <button type="button" class="pweye" id="spEye">👁</button></span>
      <div id="spErr" class="gate-err" hidden></div>
      <div class="askbtns"><button class="btn sm" id="spNo">${T("إلغاء","Cancel")}</button>
        <button class="btn sm pri" id="spYes">${T("حفظ","Save")}</button></div></div>`;
    document.body.appendChild(w);
    const close=()=>w.remove(), inp=w.querySelector("#spP"); setTimeout(()=>inp.focus(),30);
    w.querySelector("#spNo").onclick=close;
    w.querySelector("#spEye").onclick=()=>{ inp.type=inp.type==="password"?"text":"password"; };
    w.querySelector("#spYes").onclick=async()=>{
      if(inp.value.length<4){ const e=w.querySelector("#spErr"); e.hidden=false; e.textContent=T("4 أحرف على الأقل","At least 4 characters"); return; }
      x.hash=await iltHash(x.u, inp.value); close(); touch("user_pwd", x.u);
      toast(T("تم تعيين كلمة المرور","Password set"));
    };
    inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); w.querySelector("#spYes").click(); } if(e.key==="Escape") close(); };
    w.onclick=e=>{ if(e.target===w) close(); };
  });
  on("uAdd", ()=>{
    askText(T("اسم المستخدم (إنجليزي بلا مسافات)","Username (latin, no spaces)"), "", "username", u=>{
      const un=u.trim().toLowerCase().replace(/\s+/g,"");
      if(!/^[a-z0-9._-]{3,20}$/.test(un)){ toast(T("اسم غير صالح — حروف إنجليزية وأرقام من 3 إلى 20","Invalid — 3–20 latin characters or digits")); return; }
      if(uFind(un)){ toast(T("هذا المستخدم موجود","That username already exists")); return; }
      askText(T("الاسم المعروض","Display name"), "", "", nm=>{
        askText(T("كلمة المرور الأولية (4 أحرف فأكثر)","Initial password (4+ characters)"), "", "", async pw=>{
          if(pw.length<4){ toast(T("4 أحرف على الأقل","At least 4 characters")); return; }
          AUTH.users.push({u:un, name:nm, role:"pm", active:1, hash:await iltHash(un,pw), perms:defaultPerms("pm")});
          USEL.u=un; touch("user_add", un+" · "+nm);
          toast(T("أُضيف المستخدم بدور «مدير مشاريع» — عدّل صلاحياته من الجدول","User added as projects manager — adjust the permission grid"));
        });
      });
    });
  });
  on("uClr", ()=>askOk(T("تفريغ السجل","Clear the log"),
    T("سيُحذف سجل الأحداث بالكامل ولا يمكن استرجاعه.","The entire audit log will be deleted and cannot be recovered."),
    ()=>{ AUTH.log=[]; iltSave(); render(); }, T("تفريغ","Clear")));
  on("uExp", async()=>{
    const data=JSON.stringify({app:"iltizam", v:1, at:new Date().toISOString(),
      note:"لا يحتوي هذا الملف أي كلمة مرور صريحة — فقط تجزئات SHA-256",
      project_manager:PM_NAME, users:AUTH.users, reqs:AUTH.reqs.map(r=>({...r, codeHash:undefined})), log:AUTH.log}, null, 1);
    const r=await saveFile(`iltizam-users-${new Date().toISOString().slice(0,10)}.json`, data, "application/json");
    if(r===true){ logAdd("exported","users"); iltSave(); toast(T("تم تصدير دفتر المستخدمين","User register exported")); }
  });
  on("uImp", ()=>$("uFile").click());
  const fi=$("uFile");
  if(fi) fi.onchange=()=>{
    const f=fi.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{
        const o=JSON.parse(r.result);
        if(!Array.isArray(o.users)||!o.users.length) throw 0;
        if(!o.users.some(x=>x.role==="admin")) throw 0;
        AUTH.users=o.users; AUTH.reqs=[]; if(Array.isArray(o.log)) AUTH.log=o.log;
        touch("user_add", T("استيراد الدفتر","register imported"));
        toast(T("تم استيراد دفتر المستخدمين","User register imported"));
      }catch(e){ toast(T("ملف غير صالح — يجب أن يحتوي مستخدمين وفيهم مدير نظام","Invalid file — it must contain users including an administrator")); } };
    r.readAsText(f); fi.value="";
  };
  v.querySelectorAll("[data-pwok]").forEach(b=>b.onclick=async()=>{
    const q=AUTH.reqs.find(x=>x.id===b.dataset.pwok); if(!q) return;
    await pwApply(q); logAdd("pw_approved", q.u); iltSave(); render();
  });
  v.querySelectorAll("[data-pwno]").forEach(b=>b.onclick=()=>{
    const q=AUTH.reqs.find(x=>x.id===b.dataset.pwno); if(!q) return;
    q.status="rejected"; logAdd("pw_rejected", q.u); iltSave(); render();
    toast(T("تم رفض الطلب","Request rejected"));
  });
}

<script>
"use strict";
/* ═══════════ حالة كل مشروع — لون يعبّر عن الحالة، ومعه رمز واسم ═══════════ */
const STATES = {
  ready  :{ar:"جاهز للفاتورة",  en:"Ready to invoice",   g:"✓", c:"good"},
  run    :{ar:"قيد التنفيذ",    en:"In progress",        g:"●", c:"info"},
  pending:{ar:"بانتظار الحصر",  en:"Awaiting takeoff",   g:"▲", c:"warn"},
  nogeo  :{ar:"ناقص إحداثيات",  en:"Missing coordinates",g:"◆", c:"serious"},
  draft  :{ar:"مسودة بلا ملفات",en:"Draft — no files",   g:"○", c:"neutral"}
};
const ST_ORDER = ["ready","run","pending","nogeo","draft"];
const stVar = k => "var(--st-"+STATES[k].c+")";
const stSoft = k => "var(--st-"+STATES[k].c+"-s)";
const DASH = {filter:null};
const gaWO  = () => allProjPts().filter(g=>g.n).length;
const gaPts = () => allProjPts().reduce((a,g)=>a+g.n,0);

function projState(p){
  const s=projStats(p), files=(p.files||[]).length;
  const setPct = s.rmus? s.set/s.rmus*100 : 0;
  const bill = s.plan? (s.exec/s.plan*100) : 0;
  let k;
  if(!files && !s.derived && !s.rmus) k="draft";
  else if(!s.derived) k="pending";
  else if(!s.pts) k="nogeo";
  else if(setPct>=80 && s.exec>0) k="ready";
  else k="run";
  return Object.assign({}, s, {files, setPct, bill, k});
}
function meter(pct, label, tone){
  const v=Math.max(0,Math.min(pct,100));
  return `<span class="mtr" title="${esc(label)}: ${nf(pct)}%">
    <span class="t"><i style="width:${v}%;${tone?`--mc:${tone}`:""}"></i></span>
    <span class="n">${nf(pct)}%</span></span>`;
}

/* ═══════════ لوحة التحكم ═══════════ */
function viewDash2(){
  const cur=CF(), mine=firmProjects(cur).map(o=>o.p);
  const st=mine.map(projState);
  const tot={est:0, exec:0, plan:0, pts:0, rmu:0, tr:0, mv:0, files:0, wo:new Set()};
  mine.forEach((p,i)=>{ const s=st[i];
    tot.est+=s.est; tot.exec+=s.exec; tot.plan+=s.plan; tot.pts+=s.pts; tot.files+=s.files;
    tot.rmu+=s.t.rmuNew||0; tot.tr+=s.t.trTot||0; tot.mv+=s.t.htCable||0;
    if(String(p.wo||"").trim()) tot.wo.add(String(p.wo).trim()); });
  const varPct = tot.plan? (tot.exec-tot.plan)/tot.plan*100 : 0;
  const varTone = Math.abs(varPct)<=10?"var(--st-good)":Math.abs(varPct)<=30?"var(--st-warn)":"var(--st-serious)";

/* الجلسة: تنتهي بإغلاق التبويب — فأول صفحة دائمًا كلمة المرور ثم الدخول */
sessionSet = function(u){
  try{ sessionStorage.setItem(ILT_SESS, JSON.stringify({u, at:Date.now()})); }catch(e){}
  try{ localStorage.removeItem(ILT_SESS); }catch(e){}
};
sessionGet = function(){
  try{ const o=JSON.parse(sessionStorage.getItem(ILT_SESS)||"null");
    if(o && o.u && Date.now()-o.at < 12*3600e3) return o.u; }catch(e){}
  return null;
};
sessionClear = function(){
  try{ sessionStorage.removeItem(ILT_SESS); }catch(e){}
  try{ localStorage.removeItem(ILT_SESS); }catch(e){}
};
/* استعادة جلسة التبويب بعد تحديث الصفحة (الإقلاع تم قبل تبديل التخزين) */
(function(){
  try{ localStorage.removeItem(ILT_SESS); }catch(e){}
  if(AUTH.me) return;
  const u=sessionGet();
  if(u && uFind(u) && uFind(u).active){ AUTH.me=u; AUTH.lock=true; gateRender(); render(); }

})();

        <div><b>${T("مسح الملفات والبيانات المستوردة منها","Clear files and the data imported from them")}</b>
        <span>${T("يعيد جداول الحصر والمقايسة والمواد والوحدات والاستلام إلى الصفر لإعادة الاستيراد من نظيف. بيانات المشروع الأساسية (الاسم، أمر العمل، التكلفة التقديرية) تبقى.","Resets tally, BOQ, materials, units and acceptance to empty for a clean re-import. Core project info (name, W/O, estimate) stays.")}</span></div></label>
      <div class="muted" style="font-size:11.5px">${T("يمكنك التراجع بعدها بزر «تراجع عن آخر استيراد» ما دمت لم تغلق المنصة.","You can undo afterwards with “Undo last import” as long as the platform stays open.")}</div>
    </div>
    <div class="ft"><button class="btn gh" id="clrNo">${T("إلغاء","Cancel")}</button>
      <button class="btn danger" id="clrYes">${T("مسح","Clear")}</button></div></div>`;
  w.hidden=false;
  const close=()=>{ w.hidden=true; w.innerHTML=""; };
  $("clrNo").onclick=close;
  w.onclick=e=>{ if(e.target===w) close(); };
  $("clrYes").onclick=async()=>{
    const all=w.querySelector('input[name=clrmode]:checked').value==="all";
    close();
    const k=await clearUploads(pi, all);
    render(); toast(T(`مُسح ${nf(k)} ملف — يمكنك رفعها من جديد`, `${nf(k)} files cleared — you can upload them again`));
  };
}
guard("clearUploads","import","del");
(function(){
  const _r=render;
  render=function(){
    _r();
    const v=$("view"); if(!v) return;
    const open=()=>{ if(!can("import","del")){ denyToast("import","del"); return; } if(AUTH.lock){ lockToast(); return; } clearUploadsDlg(S.active); };
    const mk=(cls,label)=>{ const b=document.createElement("button"); b.type="button"; b.className=cls; b.dataset.clrup="1";
      b.textContent=label; b.onclick=open; return b; };
    const L=T("مسح الملفات المرفوعة","Clear uploaded files");
    // شريط التحديث في كل الصفحات
    const add=$("updAdd");
    if(add && !v.querySelector('.updbar [data-clrup]')) add.insertAdjacentElement("afterend", mk("btn sm gh danger-t", "🗑 "+L));
    // سجل الكروكيات في الصفحة الماستر
    const rc=$("regClear");
    if(rc && !(rc.previousElementSibling && rc.previousElementSibling.dataset.clrup)){
      const b=mk("btn sm gh noprint regx","🗑 "+L); rc.insertAdjacentElement("beforebegin", b); }
  };
  render();
})();
</script>

</body>
