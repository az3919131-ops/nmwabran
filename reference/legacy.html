<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>محفظة مشاريع المقاول</title>
<style>
  html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  body{margin:0;font-size:14px}
  img{max-width:100%}
  [hidden]{display:none!important}
</style>
</head>
<body>
<title>محفظة مشاريع المقاول</title>
<style>
:root{
  --ground:#f4f6f4; --surface:#ffffff; --surface-2:#eef1ee; --surface-3:#e4e9e5;
  --ink:#10201c; --ink-2:#3d5149; --ink-3:#6d827a;
  --line:#d5ddd8; --line-2:#c2cdc6;
  --accent:#0b5f57; --accent-ink:#ffffff; --accent-soft:#dff0ec; --accent-2:#a9641f;
  --ok:#1d6f47; --ok-soft:#dff0e5; --warn:#9c6410; --warn-soft:#faedd6; --bad:#a8332a; --bad-soft:#fae2df;
  --shadow:0 1px 2px rgba(16,32,28,.06),0 6px 18px rgba(16,32,28,.05);
  --rail:280px;
  --f-ui:"Segoe UI","Dubai","Noto Sans Arabic",Tahoma,"Geeza Pro",system-ui,-apple-system,Arial,sans-serif;
  --f-mono:"Cascadia Mono",Consolas,ui-monospace,SFMono-Regular,Menlo,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0d1614; --surface:#141f1c; --surface-2:#1a2724; --surface-3:#22312d;
  --ink:#e6ede9; --ink-2:#adbfb8; --ink-3:#7e928b;
  --line:#26332f; --line-2:#33443e;
  --accent:#49b9a4; --accent-ink:#06231f; --accent-soft:#14312c; --accent-2:#d09c53;
  --ok:#54c089; --ok-soft:#12301f; --warn:#e0ab55; --warn-soft:#33260f; --bad:#e58076; --bad-soft:#331916;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
}}
:root[data-theme="dark"]{
  --ground:#0d1614; --surface:#141f1c; --surface-2:#1a2724; --surface-3:#22312d;
  --ink:#e6ede9; --ink-2:#adbfb8; --ink-3:#7e928b;
  --line:#26332f; --line-2:#33443e;
  --accent:#49b9a4; --accent-ink:#06231f; --accent-soft:#14312c; --accent-2:#d09c53;
  --ok:#54c089; --ok-soft:#12301f; --warn:#e0ab55; --warn-soft:#33260f; --bad:#e58076; --bad-soft:#331916;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.28);
}
/* ── قفل كامل: لا شيء من المنصة يُرسم قبل تسجيل الدخول ── */
body:not(.authed) .shell,
body:not(.authed) .deck,
body:not(.authed) .toast,
body:not(.authed) .aifab,
body:not(.authed) .gwrap,
body:not(.authed) .aiwrap,
body:not(.authed) .dwrap,
body:not(.authed) #pmPrint{display:none!important;visibility:hidden!important}
body:not(.authed){overflow:hidden}
@media print{ body:not(.authed) *{display:none!important} }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%}
body[dir="rtl"]{direction:rtl}
body[dir="ltr"]{direction:ltr}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.code{font-family:var(--f-mono);font-size:.82em;letter-spacing:.01em;direction:ltr;unicode-bidi:isolate;color:var(--ink-2)}

/* ── shell ─────────────────────────────────────────── */
.shell{display:flex;min-height:100%;align-items:stretch}
.rail{width:var(--rail);flex:0 0 var(--rail);background:var(--surface);border-inline-end:1px solid var(--line);
  display:flex;flex-direction:column;gap:0;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.rail-head{padding:16px 16px 12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--f-mono)}
.brand-t{font-size:14px;font-weight:600;line-height:1.25}
.brand-s{font-size:11px;color:var(--ink-3);line-height:1.3}
.railsec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.railsec > .lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.nav{padding:10px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:9px 10px;border:0;border-radius:8px;
  background:transparent;cursor:pointer;color:var(--ink-2);font-size:13.5px;font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .ix{font-family:var(--f-mono);font-size:11px;width:18px;flex:0 0 18px;text-align:center;color:var(--ink-3)}
.nav button[aria-current="true"] .ix{color:var(--accent)}
.rail-foot{margin-top:auto;padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);
  display:flex;flex-direction:column;gap:8px}
.ver{font-size:10.5px;color:var(--ink-3);font-family:var(--f-mono)}

.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .t{font-size:15px;font-weight:600}
.topbar .s{font-size:11.5px;color:var(--ink-3)}
.topbar .sp{flex:1 1 auto}
.wrap{padding-block:20px 56px;padding-inline:20px;max-width:1420px;width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:18px}
.burger{display:none}

/* ── controls ──────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 13px;border-radius:8px;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.07)}
.btn.big{padding:12px 14px;width:100%;font-size:13.5px}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:6px}
.btn.gh{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.gh:hover{background:var(--surface-2);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
select,input[type="text"],input[type="number"],input[type="date"],textarea{
  width:100%;padding:7px 9px;border:1px solid var(--line-2);border-radius:7px;background:var(--surface);color:var(--ink);font-size:13px}
input[type="number"]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
textarea{resize:vertical;line-height:1.6}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink-3);font-weight:500;min-width:0}
label.fld > span{display:block}
.chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2)}

/* ── cards & tables ────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.card > header{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card > header h3{font-size:14px}
.card > header .sub{font-size:11.5px;color:var(--ink-3)}
.card > header .sp{flex:1 1 auto}
.card .body{padding:16px}
.card .body.tight{padding:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.g6{grid-template-columns:repeat(auto-fit,minmax(118px,1fr))}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 10px;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--surface-2);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600;z-index:1;border-bottom:1px solid var(--line-2)}
tbody tr:hover{background:var(--surface-2)}
tfoot td{background:var(--surface-2);font-weight:600;border-top:2px solid var(--line-2);border-bottom:0}
td.n,th.n{text-align:end;font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
th.n{text-align:end}
td.wrap-t{white-space:normal;min-width:240px;max-width:430px}
table input{padding:4px 6px;font-size:12px;border-radius:5px;min-width:64px}

.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;
  background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.delta.up{color:var(--bad)}
.delta.down{color:var(--ok)}
.delta.zero{color:var(--ink-3)}

/* stat tiles */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 14px;display:flex;flex-direction:column;gap:3px}
.stat .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stat .v{font-family:var(--f-mono);font-size:21px;font-weight:600;letter-spacing:-.02em;direction:ltr;unicode-bidi:isolate}
.stat .d{font-size:11.5px;color:var(--ink-3)}
.stat.hero{background:linear-gradient(145deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 78%,#000) 100%);
  border-color:transparent;color:var(--accent-ink)}
.stat.hero .k,.stat.hero .d{color:color-mix(in srgb,var(--accent-ink) 78%,transparent)}

/* bars */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-row{display:grid;grid-template-columns:minmax(120px,1.1fr) 1fr auto;gap:10px;align-items:center;font-size:12px}
.bar-track{height:9px;border-radius:5px;background:var(--surface-3);overflow:hidden;position:relative;min-width:70px}
.bar-fill{display:block;height:100%;border-radius:5px;background:var(--accent)}
.bar-fill.over{background:var(--bad)}
.bar-fill.under{background:var(--ok)}
.bar-val{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);direction:ltr;unicode-bidi:isolate}

/* drop zone */
.drop{border:1.5px dashed var(--line-2);border-radius:12px;padding:26px 18px;text-align:center;background:var(--surface-2);
  display:flex;flex-direction:column;align-items:center;gap:9px;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .ic{font-size:26px;line-height:1}
.drop h4{font-size:14px}
.drop p{font-size:12px;color:var(--ink-3);max-width:46ch}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.thumb{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface-2);display:flex;flex-direction:column}
.thumb img{width:100%;height:104px;object-fit:cover;display:block;background:var(--surface-3)}
.thumb .ph{height:104px;display:grid;place-items:center;font-size:26px;color:var(--ink-3);background:var(--surface-3)}
.thumb .meta{padding:6px 8px;font-size:11px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px}
.thumb .meta b{font-weight:600;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* misc */
.note{border-inline-start:3px solid var(--accent);background:var(--accent-soft);padding:10px 13px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--ink-2)}
body[dir="rtl"] .note{border-radius:8px 0 0 8px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)}
.note b{color:var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:12.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0;font-weight:500}
.hr{height:1px;background:var(--line);border:0;margin:2px 0}
.rowflex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.sec-title{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.sec-title h2{font-size:17px}
.sec-title .s{font-size:12px;color:var(--ink-3)}
.eyebrow{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent);font-weight:700}
.toast{position:fixed;inset-block-end:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:9px;font-size:13px;font-weight:500;z-index:200;
  box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.doc h4{font-size:13.5px;margin-bottom:6px}
.sign{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:14px;font-size:12px}
.sign div{border-top:1px solid var(--line-2);padding-top:7px;color:var(--ink-3)}
.sign b{display:block;color:var(--ink);font-weight:600;font-size:12.5px}
details.acc{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
details.acc + details.acc{margin-top:9px}
details.acc > summary{padding:11px 14px;cursor:pointer;font-weight:600;font-size:13.5px;list-style:none;display:flex;align-items:center;gap:9px}
details.acc > summary::-webkit-details-marker{display:none}
details.acc > summary::after{content:"+";margin-inline-start:auto;font-family:var(--f-mono);color:var(--ink-3);font-size:15px}
details.acc[open] > summary::after{content:"−"}
details.acc > .c{padding:0 14px 14px;font-size:12.8px;color:var(--ink-2);display:flex;flex-direction:column;gap:9px}
details.acc > .c ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:4px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}


/* ── presentation deck ─────────────────────────────── */
.deck{position:fixed;inset:0;z-index:120;background:var(--ground);display:flex;flex-direction:column}
.deck[hidden]{display:none!important}
.deck-bar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);
  background:var(--surface);flex-wrap:wrap;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.deck-bar .lab{font-size:12.5px;font-weight:600}
.deck-bar .sp{flex:1 1 auto}
.deck-pos{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);direction:ltr;unicode-bidi:isolate}
.deck-dots{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.ddot{width:8px;height:8px;border-radius:50%;border:0;padding:0;background:var(--surface-3);cursor:pointer}
.ddot.on{background:var(--accent);width:20px;border-radius:4px}
.deck-stage{flex:1 1 auto;overflow-y:auto;display:flex;justify-content:center;padding:18px 16px 28px}
.slide{display:none;width:100%;max-width:1060px;background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);padding:26px 30px 16px;flex-direction:column;gap:16px;min-height:min(620px,72vh)}
.slide.on{display:flex}
.sl-head{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--accent);padding-bottom:10px}
.sl-head h2{font-size:21px}
.sl-ix{font-family:var(--f-mono);font-size:12px;color:var(--accent);font-weight:600}
.sl-body{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:15px;min-width:0}
.sl-foot{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:8px}
.cover{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:12px 0}
.cov-mark{width:52px;height:52px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  font-family:var(--f-mono);font-weight:700;font-size:16px;margin-bottom:6px}
.cover h1{font-size:clamp(25px,4.4vw,40px);line-height:1.18}
.cov-sub{font-size:15px;color:var(--ink-2)}
.cov-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:20px;
  border-top:1px solid var(--line);padding-top:14px}
.cov-meta div{display:flex;flex-direction:column;gap:2px;font-size:12.5px}
.cov-meta b{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.cover.end h1{color:var(--accent)}
.sgrid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.sgrid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.stile{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 13px;display:flex;flex-direction:column;gap:2px}
.stile-v{font-family:var(--f-mono);font-size:24px;font-weight:600;letter-spacing:-.02em;direction:ltr;unicode-bidi:isolate}
.stile-k{font-size:11.5px;color:var(--ink-2);font-weight:500}
.stile-s{font-size:10.5px;color:var(--ink-3)}
.stile.big .stile-v{font-size:27px}
.stile.hi{background:var(--accent);border-color:transparent;color:var(--accent-ink)}
.stile.hi .stile-k,.stile.hi .stile-s{color:color-mix(in srgb,var(--accent-ink) 80%,transparent)}
.snote{font-size:12.5px;color:var(--ink-2);line-height:1.7;max-width:86ch}
.stack{display:flex;flex-direction:column;gap:7px}
.stack-t{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stack-bar{display:flex;height:30px;border-radius:7px;overflow:hidden}
.stack-bar span{display:grid;place-items:center;color:#fff;font-family:var(--f-mono);font-size:11.5px;font-weight:600;min-width:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:block}
.callout{border-inline-start:3px solid var(--accent);background:var(--accent-soft);padding:9px 13px;border-radius:0 8px 8px 0;font-size:12.5px;color:var(--ink-2)}
body[dir="rtl"] .callout{border-radius:8px 0 0 8px}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}
.callout b{color:var(--ink)}
.sbars,.dbars{display:flex;flex-direction:column;gap:8px}
.sbar{display:grid;grid-template-columns:minmax(96px,1.1fr) 1fr auto;gap:10px;align-items:center;font-size:12px}
.sbar-t{height:11px;border-radius:6px;background:var(--surface-3);overflow:hidden;min-width:50px}
.sbar-f{display:block;height:100%;border-radius:6px}
.sbar-v{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2);direction:ltr;unicode-bidi:isolate}
.dbar{display:grid;grid-template-columns:minmax(150px,1.3fr) 1fr auto;gap:10px;align-items:center;font-size:11.5px}
.dbar-l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbar-t{position:relative;height:15px;background:var(--surface-2);border-radius:4px;min-width:90px}
.dbar-mid{position:absolute;inset-block:0;inset-inline-start:50%;width:1px;background:var(--line-2)}
.dbar-f{position:absolute;inset-block:2px;border-radius:3px}
.dbar-v{font-family:var(--f-mono);font-size:11.5px;font-weight:600;direction:ltr;unicode-bidi:isolate}
.stbl{width:100%;border-collapse:collapse;font-size:12.5px}
.stbl th,.stbl td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.stbl thead th{background:var(--surface-2);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.stbl td.n,.stbl th.n{text-align:end;font-family:var(--f-mono);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.stbl tr.tot td{font-weight:600;border-top:2px solid var(--line-2)}
.stbl.compact td{padding:5px 9px;font-size:12px}
.scols{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.scols > div{display:flex;flex-direction:column;gap:9px;min-width:0}
.rings{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.ringbox{display:flex;align-items:center;gap:11px}
.ringlab{display:flex;flex-direction:column;gap:2px;font-size:11.5px}
.ringlab b{font-size:12.5px}
.ringlab span{color:var(--ink-3)}
.risks{display:flex;flex-direction:column;gap:9px}
.risk{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:var(--surface-2)}
.risk .rlv{flex:0 0 auto;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:999px;letter-spacing:.04em}
.risk.high{border-inline-start:3px solid var(--bad)}
.risk.high .rlv{background:var(--bad-soft);color:var(--bad)}
.risk.med{border-inline-start:3px solid var(--warn)}
.risk.med .rlv{background:var(--warn-soft);color:var(--warn)}
.risk.low{border-inline-start:3px solid var(--ink-3)}
.risk.low .rlv{background:var(--surface-3);color:var(--ink-2)}
.risk b{font-size:13px}
.risk p{font-size:12px;color:var(--ink-2);margin-top:2px}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:11px;counter-reset:st}
.steps li{font-size:12.5px}
.steps li b{display:block;font-size:13.5px;margin-bottom:2px}
.steps li span{color:var(--ink-2)}
.steps li::marker{color:var(--accent);font-weight:700;font-family:var(--f-mono)}
@media (max-width:640px){
  .slide{padding:18px 16px 12px;min-height:auto}
  .sl-head h2{font-size:17px}
  .dbar{grid-template-columns:1fr auto;}
  .dbar-t{display:none}
}
@media print{
  .deck{position:static}
  .deck-bar{display:none!important}
  .deck-stage{display:block;padding:0;overflow:visible}
  .slide{display:flex!important;break-after:page;page-break-after:always;max-width:none;border:0;box-shadow:none;
    border-radius:0;min-height:0;padding:12mm 10mm}
  .slide:last-child{break-after:auto;page-break-after:auto}
}

@media (max-width:900px){
  .rail{position:fixed;inset-block:0;inset-inline-start:0;z-index:60;transform:translateX(-102%);transition:transform .22s;height:100%}
  body[dir="rtl"] .rail{transform:translateX(102%)}
  .rail.open{transform:translateX(0)!important;box-shadow:0 0 0 100vmax rgba(0,0,0,.42)}
  .burger{display:inline-flex}
  .wrap{padding-inline:16px}
  .topbar{padding-inline:16px}
}
@media print{
  .rail,.topbar,.noprint{display:none!important}
  .wrap{padding:0;max-width:none}
  .card{break-inside:avoid;box-shadow:none;border-color:#999}
  body{background:#fff;color:#000;font-size:11px}
  thead th{background:#eee;color:#000}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const money = n => nf(Math.round(n||0));
function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),2200); }
function copyTable(id){
  const tb=document.querySelector(id); if(!tb) return;
  const rows=[...tb.querySelectorAll("tr")].map(tr=>[...tr.querySelectorAll("th,td")].map(c=>{
    const i=c.querySelector("input,select"); return (i? i.value : c.textContent).trim().replace(/\s+/g," ");
  }).join("\t")).join("\n");
  navigator.clipboard.writeText("﻿"+rows).then(
    ()=>toast(T("تم نسخ الجدول — الصقه مباشرة في إكسل","Table copied — paste into Excel")),
    ()=>toast(T("تعذّر النسخ","Copy failed")));

/* ═══════════ محرك الاشتقاق ═══════════ */
function totals(p){
  const t={}; SHEET_FIELDS.forEach(g=>g.f.forEach(f=>t[f[0]]=0));
  p.sheets.forEach(s=>SHEET_FIELDS.forEach(g=>g.f.forEach(f=>t[f[0]] += (+s[f[0]]||0))));
  t.rmuNew = t.rmu3w + t.rmu4w;
  t.trTot  = t.tr220 + t.tr400 + t.trIndoor;
  t.trench = t.asHT1+t.saHT1+t.asHT2+t.saHT2+t.asHT3+t.saHT3+t.saHT4+t.asLT13+t.saLT13+t.saLT4;
  return t;
}
function derive(p){
  const t = totals(p), F = p.factors, w = 1 + (+F.wastePct||0)/100, up = n => Math.ceil(n);
  const works = {
    "301010201":t.saHT1, "301010205":t.asHT1, "301010202":t.saHT2, "301010206":t.asHT2,
    "301010203":t.saHT3, "301010204":t.saHT4, "301010101":t.saLT13, "301010103":t.asLT13, "301010102":t.saLT4,
    "304010202":t.htCable, "304010203":t.mvSingle, "304010101":t.lt185+t.lt70, "304010102":t.lt300,
    "306010002":t.asphalt, "306010004":t.milling, "302020001":t.hdd,
    "305020104":Math.max(t.joints, up(t.htCable/(+F.drumLen||1000))),
    "305020404":t.term3x400,
    "305020407":(+F.elbowPhases)*(t.trTot + t.riser400),
    "305010301":t.lt185Term + t.lt70Term, "305010302":t.lt300Term,
    "308020101":t.rmuNew, "308020105":t.trTot,
    "309020101":t.rmuNew, "309020203":t.trTot,
    "310020001":t.rmuNew, "310010001":t.pillars, "309010102":t.pillars,
    "207000006":t.riserRem,
    "604000002":(+F.bollardPerRMU)*(t.rmuNew + t.trTot),
    "201040003":t.poleSteel, "201040006":t.poleWood,
    "205040101":t.trPole1, "205040102":t.trPole2,
    "204020301":t.condMV, "204010301":t.abcLV,
    "304040205":t.riserRem, "205040206":t.lbsRem,
    "311000016":up(t.term3x400/2)*(+F.vlfPerSection||1),
    "307010002":up(t.trench/800), "307010005":up(t.trench/800),
    "307040002":Math.max(t.asphalt+t.milling>0?1:0, up((t.asphalt+t.milling)/2500))
  };
  const mats = {
    "8114005":Math.round(t.htCable*w), "8111007":Math.round(t.lt300*w),
    "8111006":Math.round(t.lt185*w),   "8111005":Math.round(t.lt70*w),
    "8113009":Math.round(t.mvSingle*w),
    "8327004":t.rmu3w, "8327005":t.rmu4w,
    "8567054":t.tr220+t.tr400, "8569108":t.trIndoor,
    "8121179":works["305020104"],
    "8121182":(+F.elbowPerTR)*t.trTot + (+F.elbowPhases)*t.riser400,
    "8121139":(+F.elbowPhases)*Math.round(t.mvSingle/12),
    "8121008":(+F.elbowPhases)*t.riser400,
    "8121009":t.lt185Term, "8121010":t.lt300Term,
    "8111102":(+F.cuPerRMU)*t.rmuNew, "8111101":(+F.cuPerTR)*t.trTot,
    "8202054":(+F.rodsPerRMU)*t.rmuNew + (+F.rodsPerTR)*t.trTot + (+F.rodsPerPillar)*t.pillars,
    "8202189":(+F.cConnPerRMU)*t.rmuNew, "8202098":(+F.clampPerTR)*t.trTot,
    "8202030":(+F.connPerTR)*t.trTot,   "8122034":(+F.luPerRMU)*t.rmuNew
  };
  let wc=0, mc=0;
  WORKS.forEach(x=>{ wc += (works[x.c]||0)*x.p; });
  MATERIALS.forEach(x=>{ mc += (mats[x.c]||0)*x.p; });
  const ind = (mc+wc)*(+p.factors.indirectPct||0)/100;
  return {works, mats, t, cost:{mat:mc, inst:wc, ind, total:mc+wc+ind}, at:new Date().toISOString()};
}
function authorityFor(pct){ const a = AUTHORITY.find(x=>Math.abs(pct)<=x.max)||AUTHORITY[AUTHORITY.length-1]; return T(a.ar,a.en); }

/* ═══════════ 2 · المقايسة والمقارنة ═══════════ */
function viewBOQ(){
  const p=P(), d=p.derived;
  const rows = WORKS.map(x=>{
    const b=p.boq[x.c]||{plan:0,exec:0}, der=d?(d.works[x.c]||0):null;
    return {x, plan:+b.plan||0, exec:+b.exec||0, der};
  }).filter(r=>r.plan||r.exec||r.der);
  const sum = k => rows.reduce((s,r)=>s+(r[k]||0)*r.x.p,0);
  const planC=sum("plan"), execC=sum("exec"), derC=d?sum("der"):0;
  const matRows = MATERIALS.map(m=>{
    const b=p.mat[m.c]||{iss:0,req:0}, der=d?(d.mats[m.c]||0):null;
    return {m, iss:+b.iss||0, req:+b.req||0, der};
  }).filter(r=>r.iss||r.req||r.der);
  const issC=matRows.reduce((s,r)=>s+r.iss*r.m.p,0), reqC=matRows.reduce((s,r)=>s+r.req*r.m.p,0);
  return `
  <div class="sec-title"><span class="eyebrow">${T("الصفحة الثانية","Page two")}</span>
    <h2>${T("المقايسة ومقارنة المصروف بالمركّب","BOQ — issued vs installed vs layout")}</h2></div>

  <div class="grid g4">
    <div class="stat"><span class="k">${T("أجور المقايسة","BOQ works")}</span><span class="v">${money(planC)}</span><span class="d">${T("مخطط","Planned")}</span></div>
    <div class="stat"><span class="k">${T("أجور المنفّذ","Executed works")}</span><span class="v">${money(execC)}</span>
      <span class="d ${execC>planC?"delta up":"delta down"}">${execC>planC?"+":""}${money(execC-planC)} ${T("ريال","SAR")}</span></div>
    <div class="stat"><span class="k">${T("أجور الكروكي","Layout works")}</span><span class="v">${d?money(derC):"—"}</span><span class="d">${T("مستنبط آليًا","Auto-derived")}</span></div>
    <div class="stat"><span class="k">${T("فرق المواد","Material gap")}</span><span class="v ${reqC>issC?"delta up":"delta down"}">${money(reqC-issC)}</span><span class="d">${T("مطلوب − مصروف","Required − issued")}</span></div>
  </div>

  <div class="card"><header><h3>${T("بنود التركيبات والأجور","Installation & works items")}</h3>
    <span class="sub">${T("المخطط بالمقايسة · المنفّذ على الطبيعة · المستنبط من الكروكي","BOQ planned · site executed · layout derived")}</span>
    <span class="sp"></span><button class="btn sm gh noprint" id="copyBoq">${T("نسخ للإكسل","Copy to Excel")}</button></header>
  <div class="body tight scroll"><table id="tblBoq"><thead><tr>
    <th>${T("رقم البند","Code")}</th><th>${T("وصف البند","Description")}</th><th>${T("الوحدة","Unit")}</th>
    <th class="n">${T("السعر","Price")}</th><th class="n">${T("المخطط","Planned")}</th><th class="n">${T("المنفّذ","Executed")}</th>
    <th class="n">${T("الكروكي","Layout")}</th><th class="n">${T("فرق الكمية","Qty diff")}</th>
    <th class="n">${T("تكلفة الفرق","Cost diff")}</th><th>${T("الحالة","Status")}</th></tr></thead>
    <tbody>${rows.map(r=>{
      const diff=r.exec-r.plan, cd=diff*r.x.p;
      const dev = r.der!=null && r.exec ? Math.abs(r.exec-r.der)/Math.max(r.der,1)*100 : null;
      const st = dev==null?["","—"]:dev<=5?["ok",T("مطابق للكروكي","Matches layout")]:dev<=20?["warn",T("انحراف بسيط","Minor deviation")]:["bad",T("يحتاج مراجعة","Needs review")];
      return `<tr>
        <td class="code">${r.x.c}</td><td class="wrap-t">${esc(AR()?r.x.ar:r.x.en)}</td><td>${esc(r.x.u)}</td>
        <td class="n">${nf(r.x.p,2)}</td>
        <td class="n"><input type="number" step="any" data-boq="${r.x.c}" data-f="plan" value="${r.plan}"></td>
        <td class="n"><input type="number" step="any" data-boq="${r.x.c}" data-f="exec" value="${r.exec}"></td>
        <td class="n">${r.der==null?"—":nf(r.der,r.der%1?1:0)}</td>
        <td class="n ${diff>0?"delta up":diff<0?"delta down":"delta zero"}">${diff>0?"+":""}${nf(diff,diff%1?1:0)}</td>
        <td class="n ${cd>0?"delta up":cd<0?"delta down":"delta zero"}">${cd>0?"+":""}${money(cd)}</td>
        <td><span class="pill ${st[0]}">${st[1]}</span></td></tr>`;}).join("")}
    </tbody>
    <tfoot><tr><td colspan="4">${T("الإجمالي","Total")}</td><td class="n">${money(planC)}</td><td class="n">${money(execC)}</td>
      <td class="n">${d?money(derC):"—"}</td><td class="n">—</td>
      <td class="n ${execC>planC?"delta up":"delta down"}">${execC>planC?"+":""}${money(execC-planC)}</td><td></td></tr></tfoot>
  </table></div></div>

  <div class="card"><header><h3>${T("موازنة المواد","Material balance")}</h3>
    <span class="sub">${T("المصروف من المستودع (DDO) مقابل المطلوب للتنفيذ ومقابل الكروكي","Store-issued (DDO) vs required vs layout")}</span>
    <span class="sp"></span><button class="btn sm gh noprint" id="copyMat">${T("نسخ للإكسل","Copy to Excel")}</button></header>
  <div class="body tight scroll"><table id="tblMat"><thead><tr>
    <th>${T("الصنف","Class")}</th><th>${T("رقم المادة","Code")}</th><th>${T("وصف المادة","Description")}</th><th>${T("الوحدة","Unit")}</th>
    <th class="n">${T("السعر","Price")}</th><th class="n">${T("المصروف","Issued")}</th><th class="n">${T("المطلوب","Required")}</th>
    <th class="n">${T("الكروكي","Layout")}</th><th class="n">${T("العجز/الفائض","Gap")}</th><th class="n">${T("قيمة الفرق","Value")}</th></tr></thead>
    <tbody>${matRows.map(r=>{
      const gap=r.req-r.iss;
      return `<tr>
        <td><span class="pill ${r.m.k==="main"?"acc":""}">${r.m.k==="main"?T("رئيسية","Main"):T("تفصيلية","Detail")}</span></td>
        <td class="code">${r.m.c}</td><td class="wrap-t">${esc(AR()?r.m.ar:r.m.en)}</td><td>${esc(r.m.u)}</td>
        <td class="n">${nf(r.m.p,2)}</td>
        <td class="n"><input type="number" step="any" data-mat="${r.m.c}" data-f="iss" value="${r.iss}"></td>
        <td class="n"><input type="number" step="any" data-mat="${r.m.c}" data-f="req" value="${r.req}"></td>
        <td class="n">${r.der==null?"—":nf(r.der)}</td>
        <td class="n ${gap>0?"delta up":gap<0?"delta down":"delta zero"}">${gap>0?"+":""}${nf(gap)}</td>
        <td class="n ${gap>0?"delta up":gap<0?"delta down":"delta zero"}">${gap>0?"+":""}${money(gap*r.m.p)}</td></tr>`;}).join("")}
    </tbody>
    <tfoot><tr><td colspan="5">${T("الإجمالي","Total")}</td><td class="n">${money(issC)}</td><td class="n">${money(reqC)}</td>
      <td class="n">—</td><td class="n">—</td><td class="n ${reqC>issC?"delta up":"delta down"}">${money(reqC-issC)}</td></tr></tfoot>
  </table></div></div>

  <div class="note">${T("قاعدة المقارنة: المصروف يُؤخذ من أوامر التسليم المباشر (DDO) ودخول المستودع، والمركّب يُحصر على الطبيعة، والكروكي هو المرجع الهندسي. أي مادة مصروفة ولم تُركّب ولم تُرجَع للمستودع تُخصم من مستحقات المقاول وفق آلية خصم المواد المفقودة.","Comparison basis: issued quantities come from Direct Delivery Orders and store intake, installed quantities are measured on site, and the layout drawing is the engineering reference. Any material issued but neither installed nor returned is deducted from contractor dues under the lost-materials deduction mechanism.")}</div>`;
}

<script>

  const ind = (worksTotal+matReq)*p.factors.indirectPct/100;
  const curTotal = worksTotal + matReq + ind;
  const estTotal = p.estCost.mat+p.estCost.inst+p.estCost.ind;

    <div class="stat"><span class="k">${T("إجمالي الاعتماد الحالي","Current approval total")}</span><span class="v">${money(curTotal)}</span>
      <span class="d ${varPct>0?"delta up":"delta down"}">${varPct>0?"+":""}${nf(varPct,2)}% ${T("عن التقديرية","vs estimate")}</span></div>
  </div>

  <div class="grid g2">
    <div class="card"><header><h3>${T("توزيع الأجور على مجموعات الأعمال","Wages by work group")}</h3></header>
      <div class="body bars">${groups.map(([g,ar,en])=>{const v=gTot(g);return `<div class="bar-row">
        <span>${esc(T(ar,en))}</span><span class="bar-track"><span class="bar-fill" style="width:${v/maxG*100}%"></span></span>
        <span class="bar-val">${money(v)}</span></div>`;}).join("")}</div></div>

    <div class="card"><header><h3>${T("أكبر بنود الفرق","Largest variance items")}</h3>

      <div class="body tight scroll"><table><thead><tr><th>${T("البند","Code")}</th><th>${T("الوصف","Description")}</th>
        <th class="n">${T("فرق الكمية","Qty diff")}</th><th class="n">${T("قيمة الفرق","Value")}</th></tr></thead>
        <tbody>${bigItems.map(o=>`<tr><td class="code">${o.x.c}</td><td class="wrap-t">${esc(AR()?o.x.ar:o.x.en)}</td>
          <td class="n ${o.dq>0?"delta up":"delta down"}">${o.dq>0?"+":""}${nf(o.dq,o.dq%1?1:0)}</td>
          <td class="n ${o.dv>0?"delta up":"delta down"}">${o.dv>0?"+":""}${money(o.dv)}</td></tr>`).join("")}
        </tbody></table></div></div>

      <div class="note ${Math.abs(varPct)>30?"warn":""}" style="margin-top:12px">

function deckStats(p){
  const t=totals(p), d=p.derived;
  const pr = c => (WORKS.find(x=>x.c===c)||{p:0}).p;
  let planC=0, execC=0;
  WORKS.forEach(x=>{const b=p.boq[x.c]||{}; planC+=(+b.plan||0)*x.p; execC+=(+b.exec||0)*x.p;});
  const matIss = MATERIALS.reduce((s,m)=>{const b=p.mat[m.c]||{};return s+(+b.iss||0)*m.p;},0);
  const matReq = MATERIALS.reduce((s,m)=>{const b=p.mat[m.c]||{};return s+(+b.req||0)*m.p;},0);
  const ind = (execC+matReq)*p.factors.indirectPct/100;
  const cur = execC+matReq+ind;
  const est = p.estCost.mat+p.estCost.inst+p.estCost.ind;
  const varPct = est? (cur-est)/est*100 : 0;
  const setDone = p.rmus.filter(r=>r.set).length;
  const highOhm = p.rmus.filter(r=>+r.ohm>3).length;
  return {t,d,planC,execC,matIss,matReq,ind,cur,est,varPct,setDone,highOhm,pr};
}

/* شريط أفقي بسيط داخل الشريحة */
function sBar(label, val, max, color, valText){
  const w = max? Math.max(Math.min(Math.abs(val)/max*100,100),1.2) : 1.2;
  return `<div class="sbar"><span class="sbar-l">${esc(label)}</span>
    <span class="sbar-t"><span class="sbar-f" style="width:${w}%;background:${color}"></span></span>
    <span class="sbar-v">${esc(valText)}</span></div>`;
}
/* شريط ثنائي الاتجاه للفروق */
function dBar(label, val, max, fmt){
  const w = max? Math.max(Math.abs(val)/max*50,0.8) : 0.8;
  const pos = val>=0;
  return `<div class="dbar"><span class="dbar-l">${esc(label)}</span>
    <span class="dbar-t"><span class="dbar-mid"></span>
      <span class="dbar-f" style="width:${w}%;${pos?"inset-inline-start:50%":"inset-inline-end:50%"};background:${pos?"var(--bad)":"var(--ok)"}"></span></span>
    <span class="dbar-v" style="color:${pos?"var(--bad)":"var(--ok)"}">${pos?"+":""}${fmt(val)}</span></div>`;
}
/* حلقة نسبة */
function ring(pct, label, sub){
  const r=42, c=2*Math.PI*r, off=c*(1-Math.min(Math.max(pct,0),100)/100);
  return `<div class="ringbox"><svg viewBox="0 0 110 110" width="110" height="110" role="img" aria-label="${esc(label)} ${nf(pct)}%">
    <circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="11"></circle>
    <circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--accent)" stroke-width="11" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 55 55)"></circle>
    <text x="55" y="61" text-anchor="middle" fill="var(--ink)" font-size="22" font-weight="600"
      font-family="ui-monospace, Menlo, Consolas, monospace">${nf(pct)}%</text></svg>
    <div class="ringlab"><b>${esc(label)}</b><span>${esc(sub)}</span></div></div>`;
}

  ].filter(r=>r[0]);
  sl.push({k:T("المخاطر","Risks"), t:T("المخاطر والمعوقات وإجراءات المعالجة","Risks, blockers and mitigating actions"),
    h:`<div class="risks">${risks.map(([,ar,en,dar,den,lv])=>`<div class="risk ${lv}">
      <span class="rlv">${lv==="high"?T("عالٍ","High"):lv==="med"?T("متوسط","Medium"):T("منخفض","Low")}</span>
      <div><b>${esc(T(ar,en))}</b><p>${esc(T(dar,den))}</p></div></div>`).join("")}</div>`});

  /* 11 — التوصيات */
  sl.push({k:T("التوصيات","Recommendations"), t:T("التوصيات والخطوات التالية","Recommendations and next steps"),
    h:`<ol class="steps">
      ${[["رفع نموذج تعديل المقايسة 02 بالكميات المنفّذة الفعلية","Submit BOQ revision Form 02 with the actual executed quantities",
          `${T("بقيمة","Value")} ${money(S1.cur-S1.est)} ${T("ريال ونسبة","SAR at")} ${nf(S1.varPct,1)}% — ${esc(authorityFor(S1.varPct))}`],
         ["إرجاع المواد الفائضة للمستودع قبل طلب الإغلاق","Return surplus materials to the store before requesting closure",
          T("لتفادي تطبيق آلية خصم قيمة المواد المفقودة من مستحقات المقاول.","To avoid the lost-materials deduction from contractor dues.")],
         ["استكمال ضبط الحماية واعتماده من إدارة الحماية","Complete relay settings and obtain Protection approval",
          `${p.rmus.length-S1.setDone} ${T("وحدة متبقية — شرط لازم للتغذية والاستلام النهائي.","units remaining — a precondition for energisation and final acceptance.")}`],
         ["تجميع تقارير VLF والبروكتر والكثافة الحقلية في ملف واحد","Compile VLF, Proctor and field-density reports into one file",
          T("مرتبة بأرقام البنود ومواقعها على الكروكي، لأنها أول ما يطلبه الاستشاري.","Ordered by item code and layout location — the first thing the consultant asks for.")],
         ["تسليم كروكي As-Built موقّعًا بإحداثيات كل معدة","Hand over a signed As-Built drawing with per-unit GPS",
          T("وتحديث بيانات GIS لتفادي إعادة فتح أمر العمل لاحقًا.","And update GIS to avoid the work order being reopened later.")],
         ["إقفال أمر العمل بمحضر استلام نهائي ومخالصة","Close the work order with a final acceptance record and discharge",
          T("بعد اكتمال البنود الخمسة السابقة دون ملاحظات معلّقة.","Once the five steps above are closed with no outstanding observations.")]
        ].map(([ar,en,sub])=>`<li><b>${esc(T(ar,en))}</b><span>${esc(sub)}</span></li>`).join("")}
    </ol>`});

  /* 12 — الخاتمة */
  sl.push({k:T("الخاتمة","Closing"), h:`<div class="cover end">
    <div class="eyebrow">${T("انتهى التقرير","End of report")}</div>
    <h1>${T("جاهز للعرض على الاستشاري","Ready for the consultant")}</h1>
    <p class="cov-sub">${esc(p.name)} · <span class="num">${esc(p.wo)}</span></p>
    <div class="cov-meta">
      <div><b>${T("مهندس المشروع","Project engineer")}</b><span>${T("م / أحمد زهران","Eng. Ahmed Zahran")}</span></div>
      <div><b>${T("المقاول","Contractor")}</b><span>${esc(CONTRACTORS[p.contractor]||"")}</span></div>
      <div><b>${T("الإدارة","Department")}</b><span>${T("إدارة كهرباء ","")}${esc(p.admin)}</span></div>
      <div><b>${T("التاريخ","Date")}</b><span>${esc(today)}</span></div>
    </div></div>`});

  DECK.slides = sl;
}

function renderDeck(){
  const n = DECK.slides.length;
  DECK.i = Math.max(0, Math.min(DECK.i, n-1));
  $("deckStage").innerHTML = DECK.slides.map((s,i)=>`
    <section class="slide${i===DECK.i?" on":""}" data-si="${i}" ${i===DECK.i?"":"aria-hidden=\"true\""}>
      ${s.t?`<header class="sl-head"><span class="sl-ix">${String(i+1).padStart(2,"0")}</span><h2>${esc(s.t)}</h2></header>`:""}
      <div class="sl-body">${s.h}</div>
      <footer class="sl-foot"><span>${esc(P().name)} · ${esc(P().wo)}</span><span class="num">${i+1} / ${n}</span></footer>
    </section>`).join("");
  $("deckPos").textContent = (DECK.i+1)+" / "+n;
  $("deckDots").innerHTML = DECK.slides.map((s,i)=>
    `<button class="ddot${i===DECK.i?" on":""}" data-di="${i}" title="${esc(s.k)}" aria-label="${esc(s.k)}"></button>`).join("");
  $("deckDots").querySelectorAll("button").forEach(b=>b.onclick=()=>{DECK.i=+b.dataset.di;renderDeck();});
  $("deckLabel").textContent = DECK.slides[DECK.i].k;
}
function openDeck(){
  buildDeck(); DECK.i=0;
  $("deck").hidden=false; document.body.style.overflow="hidden";
  renderDeck(); $("deckNext").focus();
}
function closeDeck(){ $("deck").hidden=true; document.body.style.overflow=""; }
function stepDeck(d){ DECK.i=(DECK.i+d+DECK.slides.length)%DECK.slides.length; renderDeck(); }
document.addEventListener("keydown", e=>{
  if($("deck").hidden) return;
  if(e.key==="Escape") closeDeck();
  else if(e.key==="ArrowRight") stepDeck(AR()?-1:1);
  else if(e.key==="ArrowLeft") stepDeck(AR()?1:-1);
  else if(e.key==="ArrowDown"||e.key===" "||e.key==="PageDown"){e.preventDefault();stepDeck(1);}
  else if(e.key==="ArrowUp"||e.key==="PageUp"){e.preventDefault();stepDeck(-1);}
  else if(e.key==="Home"){DECK.i=0;renderDeck();}
  else if(e.key==="End"){DECK.i=DECK.slides.length-1;renderDeck();}
});
</script>
<script>
"use strict";
/* ═══════════ العرض والربط ═══════════ */
const VIEWS = {dash:viewDash, master:viewMaster, boq:viewBOQ, wages:viewWages, forms:viewForms, recs:viewRecs};

function applyLang(){
  document.body.setAttribute("dir", AR()?"rtl":"ltr");
  document.body.setAttribute("lang", AR()?"ar":"en");
  document.querySelectorAll("[data-ar]").forEach(el=>{ el.textContent = AR()? el.dataset.ar : el.dataset.en; });
  $("langAr").setAttribute("aria-pressed", String(AR()));
  $("langEn").setAttribute("aria-pressed", String(!AR()));
  $("btnTheme").textContent = document.documentElement.getAttribute("data-theme")==="dark"
    ? T("الوضع النهاري","Light mode") : T("الوضع الليلي","Dark mode");
}
function render(){
  applyLang();
  renderRail();
  $("view").innerHTML = (VIEWS[S.page]||viewDash)();
  wire();
  window.scrollTo(0,0);
}

function wire(){
  const p = P(), v = $("view");

  // بيانات المشروع
  const bind = (id, fn) => { const el=$(id); if(el) el.onchange = () => { fn(el.value); save(); render(); }; };
  bind("f_name", x=>p.name=x); bind("f_wo", x=>p.wo=x); bind("f_site", x=>p.site=x);
  bind("f_admin", x=>p.admin=x); bind("f_sector", x=>p.sector=x); bind("f_date", x=>p.approvedDate=x);
  bind("f_em", x=>p.estCost.mat=+x||0); bind("f_ei", x=>p.estCost.inst=+x||0);
  ["f_notes","f_notes2"].forEach(id=>{ const el=$(id); if(el) el.onchange=()=>{p.notes=el.value;save();}; });

  // مدخلات اللوحات
  v.querySelectorAll("[data-sheet]").forEach(inp=>{
    inp.onchange = () => { p.sheets[+inp.dataset.sheet][inp.dataset.key] = +inp.value||0; p.derived=null; save(); render(); };
  });
  v.querySelectorAll("[data-factor]").forEach(inp=>{
    inp.onchange = () => { p.factors[inp.dataset.factor] = +inp.value||0; save(); if(p.derived){p.derived=derive(p);} render(); };
  });
  v.querySelectorAll("[data-boq]").forEach(inp=>{
    inp.onchange = () => { const c=inp.dataset.boq; p.boq[c]=p.boq[c]||{plan:0,exec:0}; p.boq[c][inp.dataset.f]=+inp.value||0; save(); render(); };
  });
  v.querySelectorAll("[data-mat]").forEach(inp=>{
    inp.onchange = () => { const c=inp.dataset.mat; p.mat[c]=p.mat[c]||{iss:0,req:0}; p.mat[c][inp.dataset.f]=+inp.value||0; save(); render(); };
  });
  v.querySelectorAll("[data-rmu]").forEach(inp=>{
    inp.onchange = () => { p.rmus[+inp.dataset.rmu][inp.dataset.f] = inp.checked; save(); render(); };
  });
  v.querySelectorAll("[data-go]").forEach(tr=>{ tr.onclick = () => { S.active=+tr.dataset.go; S.page="master"; save(); render(); }; });
  v.querySelectorAll("[data-rmfile]").forEach(b=>{ b.onclick = e => { e.stopPropagation(); p.files.splice(+b.dataset.rmfile,1); save(); render(); }; });

  const on = (id, fn) => { const el=$(id); if(el) el.onclick = fn; };
  on("addSheet", ()=>{ p.sheets.push(blankSheet(p.sheets.length+1)); p.derived=null; save(); render(); });
  on("dashAdd", addProject);
  on("addRmu", ()=>{ const n=p.rmus.length+1;
    p.rmus.push({no:n,feeder:"NER —",rmu:"R"+(101580+n),type:"3W",tr:"",relay:"—",model:"—",set:false,ratio:"",ohm:"3.0",gps:""});
    save(); render(); });
  on("copySheets", ()=>copyTable("#tblSheets")); on("copyDerived", ()=>copyTable("#tblDerived"));
  on("copyBoq", ()=>copyTable("#tblBoq")); on("copyMat", ()=>copyTable("#tblMat"));
  on("copyWages", ()=>copyTable("#tblWages")); on("copyProt", ()=>copyTable("#tblProt"));
  on("copyAcc", ()=>copyTable("#tblAcc")); on("printWages", ()=>window.print());

  // رفع الكروكي
  const drop = $("drop"), fileIn = $("fileIn");
  if(drop && fileIn){
    const pick = () => fileIn.click();
    drop.onclick = pick;
    drop.onkeydown = e => { if(e.key==="Enter"||e.key===" "){ e.preventDefault(); pick(); } };
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); intake(e.dataTransfer.files); };
    fileIn.onchange = () => intake(fileIn.files);
  }
  function intake(list){
    const files = [...list].slice(0,12);
    if(!files.length) return;
    let pending = files.length;
    files.forEach(f=>{
      const rec = {name:f.name, size:f.size, type:f.type||"application/pdf", url:""};
      if(f.type && f.type.startsWith("image") && f.size < 1.6e6){
        const r = new FileReader();
        r.onload = () => { rec.url = r.result; P().files.push(rec); if(!--pending) done(); };
        r.onerror = () => { P().files.push(rec); if(!--pending) done(); };
        r.readAsDataURL(f);
      } else { P().files.push(rec); if(!--pending) done(); }
    });
    function done(){ save(); render(); toast(T("تم رفع الكروكي — أدخل حصر اللوحات ثم اضغط الاستنباط","Layout uploaded — enter the sheet tally, then derive")); }
  }
}

/* ═══════════ أزرار اللوحة الجانبية ═══════════ */
function addProject(){
  const n = S.projects.length + 1;
  const pr = newProject(T("مشروع تحويل رقم ","Conversion project ")+n, "");
  S.projects.push(pr); S.active = S.projects.length-1; S.page = "master"; save(); render();
  toast(T("أُضيف مشروع جديد — أدخل بياناته","New project added — fill in its data"));
}
$("btnAddProject").onclick = addProject;
$("btnDupProject").onclick = () => {
  const c = JSON.parse(JSON.stringify(P()));
  c.id = "P"+Math.random().toString(36).slice(2,8);
  c.name = c.name + T(" (نسخة)"," (copy)"); c.files = [];
  S.projects.push(c); S.active = S.projects.length-1; save(); render();
  toast(T("تم نسخ المشروع","Project duplicated"));
};
$("btnDelProject").onclick = () => {
  if(S.projects.length<=1){ toast(T("لا يمكن حذف المشروع الوحيد","Cannot delete the only project")); return; }
  S.projects.splice(S.active,1); S.active = 0; save(); render();
  toast(T("تم حذف المشروع","Project deleted"));
};
$("selProject").onchange = e => { S.active = +e.target.value; save(); render(); };
$("selContractor").onchange = e => { P().contractor = +e.target.value; save(); render(); };

$("btnDeriveAll").onclick = () => {
  const p = P(), t = totals(p);
  if(!t.htCable && !t.lt300 && !t.rmuNew){
    toast(T("أدخل حصر اللوحات أولًا في الصفحة الماستر","Enter the sheet tally on the Master page first"));
    S.page="master"; save(); render(); return;
  }
  p.derived = derive(p);
  // ملء ما لم يُدخل يدويًا في المقايسة من ناتج الكروكي
  Object.entries(p.derived.works).forEach(([c,q])=>{
    p.boq[c] = p.boq[c] || {plan:0, exec:0};
    if(!p.boq[c].plan && !p.boq[c].exec){ p.boq[c].plan = Math.round(q*10)/10; p.boq[c].exec = Math.round(q*10)/10; }
  });
  Object.entries(p.derived.mats).forEach(([c,q])=>{
    p.mat[c] = p.mat[c] || {iss:0, req:0};
    if(!p.mat[c].iss && !p.mat[c].req){ p.mat[c].iss = q; p.mat[c].req = q; }
  });
  if(!p.rmus.length){
    const n = t.rmuNew;
    p.rmus = Array.from({length:n},(_,i)=>({no:i+1,feeder:"NER —",rmu:"R"+(101580+i+1),
      type:i<t.rmu3w?"3W":"4W",tr:"",relay:"—",model:"—",set:false,ratio:"",ohm:"3.0",gps:""}));
  }
  save(); S.page = "master"; render();
  toast(T("تم استنباط الحصر وكل النماذج من الكروكي","Takeoff and all forms derived from the layout"));
};

/* ═══════════ لغة ومظهر وتنقل ═══════════ */
$("langAr").onclick = () => { S.lang="ar"; save(); render(); };
$("langEn").onclick = () => { S.lang="en"; save(); render(); };
$("btnTheme").onclick = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(LS+"-theme", next); }catch(e){}
  applyLang();
};
try{ const th = localStorage.getItem(LS+"-theme"); if(th) document.documentElement.setAttribute("data-theme", th); }catch(e){}
$("btnPrint").onclick = () => window.print();
$("burger").onclick = () => $("rail").classList.toggle("open");

render();
</script>
<script>
"use strict";
/* ═══════════ حفظ الملفات: يعمل في التطبيق المستقل وفي النسخة المنشورة ═══════════ */
const STANDALONE = (function(){ try{ return window.self === window.top; }catch(e){ return false; } })();
let DL = null;
(async()=>{ try{ DL = await (window.claude && window.claude.use ? window.claude.use("downloads") : null); }catch(e){ DL = null; } })();

async function saveFile(name, data, mime){
  if(DL){
    try{ await DL.save({filename:name, data: (data instanceof Uint8Array)? new Blob([data],{type:mime}) : data});
      return true;
    }catch(e){
      if(e && e.code === "declined") return null;
      toast(T("تعذّر الحفظ: ","Save failed: ")+((e&&e.code)||"error")); return false;
    }
  }
  try{
    const blob = (data instanceof Blob)? data : new Blob([data], {type:mime||"application/octet-stream"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
    return true;
  }catch(e){ return false; }
}

/* ── كاتب ملفات XLSX مصغّر (ZIP بدون ضغط + أوراق XML) ── */
const CRC_T = (()=>{ const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320 ^ (c>>>1) : c>>>1; t[n]=c>>>0; }
  return t; })();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c>>>8); return (c ^ 0xFFFFFFFF)>>>0; }
const ENC = new TextEncoder();
function zipStore(files){
  const parts=[], central=[]; let off=0;
  const u16=n=>[n&255,(n>>8)&255], u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  files.forEach(f=>{
    const nb = ENC.encode(f.name), db = f.data, crc = crc32(db);
    const lh = [].concat([0x50,0x4b,0x03,0x04], u16(20), u16(0x0800), u16(0), u16(0), u16(0),
                 u32(crc), u32(db.length), u32(db.length), u16(nb.length), u16(0));
    parts.push(new Uint8Array(lh), nb, db);
    central.push({nb, crc, size:db.length, off});
    off += lh.length + nb.length + db.length;
  });
  const cd=[];
  central.forEach(c=>{
    const ch = [].concat([0x50,0x4b,0x01,0x02], u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
                 u32(c.crc), u32(c.size), u32(c.size), u16(c.nb.length), u16(0), u16(0), u16(0), u16(0),
                 u32(0), u32(c.off));
    cd.push(new Uint8Array(ch), c.nb);
  });
  const cdSize = cd.reduce((s,a)=>s+a.length,0);
  const eocd = new Uint8Array([].concat([0x50,0x4b,0x05,0x06], u16(0), u16(0),
                 u16(central.length), u16(central.length), u32(cdSize), u32(off), u16(0)));
  const all = parts.concat(cd, [eocd]);
  const total = all.reduce((s,a)=>s+a.length,0);
  const out = new Uint8Array(total); let p=0;
  all.forEach(a=>{ out.set(a,p); p+=a.length; });
  return out;
}
const xEsc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))
  .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");
function colRef(i){ let s="", n=i+1; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return s; }
function sheetXml(rows){
  const body = rows.map((r,ri)=>`<row r="${ri+1}">`+ r.map((v,ci)=>{
    const ref = colRef(ci)+(ri+1);
    if(typeof v === "number" && isFinite(v)) return `<c r="${ref}"><v>${v}</v></c>`;
    const s = String(v==null?"":v); if(!s) return "";
    return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xEsc(s)}</t></is></c>`;
  }).join("") + `</row>`).join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView rightToLeft="${AR()?1:0}" workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>
<sheetData>${body}</sheetData></worksheet>`;
}
function buildXlsx(sheets){
  const files = [];
  const add = (name, str) => files.push({name, data: ENC.encode(str)});
  add("[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("")}
</Types>`);
  add("_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`);
  add("xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${sheets.map((s,i)=>`<sheet name="${xEsc(s[0]).slice(0,28)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join("")}</sheets></workbook>`);
  add("xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}
</Relationships>`);
  sheets.forEach((s,i)=> add(`xl/worksheets/sheet${i+1}.xml`, sheetXml(s[1])));
  return zipStore(files);
}

/* ── تجميع أوراق المشروع ── */
function projectSheets(){
  const p = P(), t = totals(p), d = p.derived, sheets = [];
  const s1 = [[T("البند","Item"), ...p.sheets.map((s,i)=>s.name||("لوحة "+(i+1))), T("الإجمالي","Total")]];
  SHEET_FIELDS.forEach(g=>{
    s1.push([T(g.g,g.gEn)]);

  sheets.push([T("فاتورة الأجور","Wages invoice"), s5]);

  const s6 = [["#", T("المغذي","Feeder"), T("رقم الوحدة","RMU"), T("النوع","Type"), T("المحول","TR"),

  sheets.push([T("ضبط الحماية","Protection"), s6]);
  return sheets;
}

async function backupData(){

function restoreData(file){
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result);
      if(!o.projects || !o.projects.length) throw 0;
      S.projects = o.projects; S.active = 0; if(o.lang) S.lang = o.lang;
      save(); render();
      toast(T("تم استعادة المشاريع","Projects restored"));
    }catch(e){ toast(T("الملف غير صالح — اختر ملف نسخة احتياطية بصيغة JSON","Invalid file — choose a JSON backup")); }

  r.readAsText(file);
}

<script>

/* WGS84 → UTM */
function toUTM(lat, lon){
  const a=6378137, f=1/298.257223563, k0=0.9996, e2=f*(2-f), ep2=e2/(1-e2);
  const zone=Math.floor((lon+180)/6)+1, lon0=(zone-1)*6-180+3;
  const ph=lat*Math.PI/180, la=(lon-lon0)*Math.PI/180;
  const s=Math.sin(ph), c=Math.cos(ph), t=Math.tan(ph);
  const N=a/Math.sqrt(1-e2*s*s), T=t*t, C=ep2*c*c, A=c*la;
  const M=a*((1-e2/4-3*e2*e2/64-5*e2**3/256)*ph-(3*e2/8+3*e2*e2/32+45*e2**3/1024)*Math.sin(2*ph)
          +(15*e2*e2/256+45*e2**3/1024)*Math.sin(4*ph)-(35*e2**3/3072)*Math.sin(6*ph));
  const E=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000;
  let Nn=k0*(M+N*t*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));
  if(lat<0) Nn+=10000000;
  return {E, N:Nn, zone};
}
function hav(a, b){
  const R=6371008.8, r=x=>x*Math.PI/180;
  const dl=r(b.lat-a.lat), dn=r(b.lon-a.lon);
  const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
/* نقاط المشروع من جدول الوحدات الحلقية */
function geoPoints(p){
  const pts=[];
  p.rmus.forEach(r=>{
    const m=String(r.gps||"").match(/(-?\d+(?:\.\d+)?)\s*[,،\s]\s*(-?\d+(?:\.\d+)?)/);
    if(!m) return;
    const lat=+m[1], lon=+m[2];
    if(!isFinite(lat)||!isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180) return;
    const u=toUTM(lat,lon);
    pts.push({...r, id:r.rmu.replace(/\s+/g,""), lat, lon, E:u.E, N:u.N, zone:u.zone, hasTR:!!(r.tr&&r.tr.trim())});
  });
  (p.geo||[]).forEach(x=>{
    if(!isFinite(x.lat)||!isFinite(x.lon)) return;
    if(pts.some(q=>Math.abs(q.lat-x.lat)<5e-5 && Math.abs(q.lon-x.lon)<5e-5)) return;
    const u=toUTM(x.lat,x.lon);
    pts.push({no:0, feeder:EXTRA_FEEDER, rmu:x.id||"PT", id:(x.id||"PT").replace(/\s+/g,""), type:x.type||"PT", tr:"",
      relay:x.src||"—", model:"—", set:false, ratio:"", ohm:"", gps:x.lat+","+x.lon,
      lat:x.lat, lon:x.lon, E:u.E, N:u.N, zone:u.zone, hasTR:false, extra:true, src:x.src||""});
  });
  return pts;
}
/* ترتيب كل مغذي على امتداد المسار (أقرب جار بدءًا من أقصى الجنوب) */
const EXTRA_FEEDER = "نقاط مستخرجة";
function feeders(pts){
  const g={};
  pts.forEach(q=>{ (g[q.feeder||"—"]=g[q.feeder||"—"]||[]).push(q); });
  const out=[];
  Object.keys(g).sort().forEach((f,fi)=>{
    if(f===EXTRA_FEEDER){
      out.push({name:f, pts:g[f].map(q=>({...q, seg:0})), len:0, color:"#b08ee8", idx:out.length, noRoute:true});
      return;
    }
    const left=g[f].slice(); left.sort((a,b)=>a.lat-b.lat);
    const chain=[left.shift()];
    while(left.length){
      const last=chain[chain.length-1]; let bi=0, bd=1e18;
      left.forEach((q,i)=>{ const d=hav(last,q); if(d<bd){bd=d;bi=i;} });
      chain.push(left.splice(bi,1)[0]);
    }
    let len=0; chain.forEach((q,i)=>{ q.seg = i? hav(chain[i-1],q) : 0; len+=q.seg; });
    out.push({name:f, pts:chain, len, color:["#49b9a4","#e0ab55","#8fb3ff","#e58076"][fi%4], idx:fi});
  });
  return out;
}

      <div class="card"><header><h3>${T("النقطة المحددة","Selected point")}</h3></header>

/* ── رسم مخطط CAD (SVG بالأمتار، الشمال لأعلى) ── */
function drawCad(){
  const svg=$("cadSvg"); if(!svg) return;
  const p=P(), pts=geoPoints(p), fs=feeders(pts);
  if(!pts.length){ svg.innerHTML=`<text x="50%" y="50%" fill="#8aa" text-anchor="middle" font-size="14">No coordinates in the protection table</text>`; svg.setAttribute("viewBox","0 0 400 300"); return; }
  const minE=Math.min(...pts.map(q=>q.E)), maxE=Math.max(...pts.map(q=>q.E));
  const minN=Math.min(...pts.map(q=>q.N)), maxN=Math.max(...pts.map(q=>q.N));
  const box=svg.getBoundingClientRect(), ar=(box.width||600)/(box.height||680);
  if(!MAPV.view || MAPV.view.key!==p.id){
    const w=(maxE-minE)||500, h=(maxN-minN)||500;
    let spanH=h*1.26, spanW=w*1.6;
    if(spanW/spanH<ar) spanW=spanH*ar; else spanH=spanW/ar;
    MAPV.view={key:p.id, cx:(minE+maxE)/2, cy:(minN+maxN)/2, w:spanW, h:spanH, fit:{cx:(minE+maxE)/2, cy:(minN+maxN)/2, w:spanW, h:spanH}};
  }
  const v=MAPV.view; v.h=v.w/ar;
  const X=E=>E, Y=N=>-N;                              // SVG y down → negate N
  const vx=v.cx-v.w/2, vy=-(v.cy+v.h/2);
  svg.setAttribute("viewBox",`${vx} ${vy} ${v.w} ${v.h}`);
  const px=v.w/(box.width||600);                     // metres per screen pixel
  const step=[25,50,100,200,250,500,1000,2000,5000].find(s=>s/px>=90)||5000;
  let g=`<rect x="${vx}" y="${vy}" width="${v.w}" height="${v.h}" fill="#0d171b"/>`;
  // grid
  const e0=Math.floor((v.cx-v.w/2)/step)*step, e1=v.cx+v.w/2, n0=Math.floor((v.cy-v.h/2)/step)*step, n1=v.cy+v.h/2;
  for(let e=e0;e<=e1;e+=step) g+=`<line x1="${e}" y1="${vy}" x2="${e}" y2="${vy+v.h}" stroke="#1d2e33" stroke-width="${px}"/>
      <text x="${e+3*px}" y="${vy+v.h-8*px}" fill="#5f7d80" font-size="${10*px}" font-family="ui-monospace,Consolas,monospace">E ${Math.round(e)}</text>`;
  for(let n=n0;n<=n1;n+=step) g+=`<line x1="${vx}" y1="${Y(n)}" x2="${vx+v.w}" y2="${Y(n)}" stroke="#1d2e33" stroke-width="${px}"/>
      <text x="${vx+6*px}" y="${Y(n)-3*px}" fill="#5f7d80" font-size="${10*px}" font-family="ui-monospace,Consolas,monospace">N ${Math.round(n)}</text>`;
  // routes
  fs.forEach(f=>{
    if(f.noRoute) return;
    g+=`<polyline points="${f.pts.map(q=>X(q.E)+","+Y(q.N)).join(" ")}" fill="none" stroke="${f.color}" stroke-width="${3*px}" stroke-linejoin="round" stroke-dasharray="${9*px} ${4*px}" opacity=".9"/>`;
  });
  // symbols + labels (feeder 1 labels to the east, feeder 2 to the west)
  const r=6*px;
  fs.forEach(f=>{
    const side = f.idx%2===0 ? 1 : -1;
    f.pts.forEach(q=>{
      const x=X(q.E), y=Y(q.N), on=q.id===MAPV.sel;
      const stroke=on?"#ffffff":f.color, sw=(on?2.6:1.6)*px;
      g+= q.type==="3W"
        ? `<circle cx="${x}" cy="${y}" r="${r}" fill="#0d171b" stroke="${stroke}" stroke-width="${sw}" data-pt="${esc(q.id)}"/>`
        : `<rect x="${x-r}" y="${y-r}" width="${2*r}" height="${2*r}" fill="#0d171b" stroke="${stroke}" stroke-width="${sw}" data-pt="${esc(q.id)}"/>`;
      if(q.hasTR) g+=`<path d="M${x+side*(r+9*px)} ${y-5*px} l${5*px} ${9*px} l${-10*px} 0 z" fill="#e58076" pointer-events="none"/>`;
      g+=`<text x="${x+side*(r+(q.hasTR?20:6)*px)}" y="${y+4*px}" fill="${on?"#ffffff":"#cfe0db"}" font-size="${(on?12:10.5)*px}" font-weight="${on?700:400}"
          text-anchor="${side>0?"start":"end"}" font-family="ui-monospace,Consolas,monospace" pointer-events="none">${esc(q.id)}</text>`;
      g+=`<circle cx="${x}" cy="${y}" r="${r*2.2}" fill="transparent" data-pt="${esc(q.id)}" style="cursor:pointer"/>`;
    });
  });
  // north arrow + scale bar (screen-anchored)
  const nx=vx+v.w-34*px, ny=vy+60*px;
  g+=`<path d="M${nx} ${ny-22*px} l${9*px} ${24*px} l${-9*px} ${-6*px} l${-9*px} ${6*px} z" fill="#cfe0db"/>
      <text x="${nx}" y="${ny-28*px}" fill="#cfe0db" font-size="${12*px}" text-anchor="middle" font-family="ui-monospace,Consolas,monospace">N</text>`;
  const sb=step, sx=vx+v.w-(sb/px+30)*px, sy=vy+v.h-44*px;
  g+=`<rect x="${sx}" y="${sy}" width="${sb/2}" height="${5*px}" fill="#cfe0db"/><rect x="${sx+sb/2}" y="${sy}" width="${sb/2}" height="${5*px}" fill="none" stroke="#cfe0db" stroke-width="${px}"/>
      <text x="${sx}" y="${sy-5*px}" fill="#cfe0db" font-size="${10*px}" font-family="ui-monospace,Consolas,monospace">0</text>
      <text x="${sx+sb}" y="${sy-5*px}" fill="#cfe0db" font-size="${10*px}" text-anchor="end" font-family="ui-monospace,Consolas,monospace">${sb} m</text>`;
  svg.innerHTML=g;
}

/* تحويل موقع الفأرة إلى إحداثيات */
function svgToWorld(ev){
  const svg=$("cadSvg"), b=svg.getBoundingClientRect(), v=MAPV.view;
  const fx=(ev.clientX-b.left)/b.width, fy=(ev.clientY-b.top)/b.height;
  return {E: v.cx-v.w/2+fx*v.w, N: v.cy+v.h/2-fy*v.h};
}
function utmToLL(E, N, zone){
  const a=6378137, f=1/298.257223563, k0=0.9996, e2=f*(2-f), ep2=e2/(1-e2), e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const x=E-500000, M=N/k0, mu=M/(a*(1-e2/4-3*e2*e2/64-5*e2**3/256));
  const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu);
  const s=Math.sin(p1), c=Math.cos(p1), t=Math.tan(p1), N1=a/Math.sqrt(1-e2*s*s), T1=t*t, C1=ep2*c*c, R1=a*(1-e2)/Math.pow(1-e2*s*s,1.5), D=x/(N1*k0);
  const lat=p1-(N1*t/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720);
  const lon=(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/c;
  return {lat:lat*180/Math.PI, lon:(zone-1)*6-180+3+lon*180/Math.PI};
}

function wireMap(){
  const svg=$("cadSvg"); if(!svg) return;
  const p=P(), pts=geoPoints(p), zone=pts[0]?pts[0].zone:38;
  drawCad();
  const tip=$("cadTip"), coord=$("cadCoord");
  let drag=null;
  svg.onpointerdown=e=>{ drag={x:e.clientX,y:e.clientY,cx:MAPV.view.cx,cy:MAPV.view.cy,moved:false}; svg.setPointerCapture(e.pointerId); svg.classList.add("drag"); };
  svg.onpointermove=e=>{
    const w=svgToWorld(e), ll=utmToLL(w.E,w.N,zone);
    coord.textContent=`E ${w.E.toFixed(1)}  N ${w.N.toFixed(1)}  ·  ${ll.lat.toFixed(6)}, ${ll.lon.toFixed(6)}`;
    if(drag){
      const b=svg.getBoundingClientRect(), dx=(e.clientX-drag.x)/b.width*MAPV.view.w, dy=(e.clientY-drag.y)/b.height*MAPV.view.h;
      if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>3) drag.moved=true;
      MAPV.view.cx=drag.cx-dx; MAPV.view.cy=drag.cy+dy; drawCad(); tip.hidden=true; return;
    }
    const id=e.target.getAttribute && e.target.getAttribute("data-pt"), q=id&&pts.find(x=>x.id===id);
    if(q){
      const b=$("cad").getBoundingClientRect();
      tip.innerHTML=`<b>${esc(q.id)}</b> · ${esc(q.feeder)} · ${esc(q.type)}${q.hasTR?" + TR":""}<br>${q.lat.toFixed(6)}, ${q.lon.toFixed(6)}<br>E ${q.E.toFixed(2)}  N ${q.N.toFixed(2)}`;
      tip.style.left=(e.clientX-b.left+14)+"px"; tip.style.top=(e.clientY-b.top+14)+"px"; tip.hidden=false;
    } else tip.hidden=true;
  };
  svg.onpointerup=e=>{
    svg.classList.remove("drag");
    const wasDrag=drag&&drag.moved; drag=null;
    if(wasDrag) return;
    const id=e.target.getAttribute && e.target.getAttribute("data-pt");
    if(id){ selectPt(id); }
  };
  svg.onpointerleave=()=>{ tip.hidden=true; };
  svg.onwheel=e=>{
    e.preventDefault();
    const w=svgToWorld(e), k=e.deltaY>0?1.2:1/1.2, v=MAPV.view;
    v.cx=w.E+(v.cx-w.E)*k; v.cy=w.N+(v.cy-w.N)*k; v.w*=k; v.h*=k; drawCad();
  };
  const zoom=k=>{ const v=MAPV.view; v.w*=k; v.h*=k; drawCad(); };
  $("vIn").onclick=()=>zoom(1/1.4); $("vOut").onclick=()=>zoom(1.4);
  $("vFit").onclick=()=>{ const f=MAPV.view.fit; Object.assign(MAPV.view,{cx:f.cx,cy:f.cy,w:f.w,h:f.h}); drawCad(); if(MAPV.leaflet) fitSat(); };
  $("vCad").onclick=()=>{ MAPV.mode="cad"; render(); };
  $("vSat").onclick=()=>{ MAPV.mode="sat"; render(); };
  document.querySelectorAll("#tblGeo tr[data-pt]").forEach(tr=>tr.onclick=()=>selectPt(tr.dataset.pt, true));
  $("copyGeo").onclick=()=>copyTable("#tblGeo");
  $("gKml").onclick=()=>exportGeo("kml"); $("gDxf").onclick=()=>exportGeo("dxf");
  $("gCsv").onclick=()=>exportGeo("csv"); $("gGeo").onclick=()=>exportGeo("geojson"); $("gSvg").onclick=()=>exportGeo("svg");
  if(MAPV.mode==="sat") mountSat();
}
function selectPt(id, center){
  MAPV.sel=id;
  const p=P(), q=geoPoints(p).find(x=>x.id===id);
  if(center && q && MAPV.view){ MAPV.view.cx=q.E; MAPV.view.cy=q.N; if(MAPV.view.w>MAPV.view.fit.w/3){ MAPV.view.w=MAPV.view.fit.w/3; } }
  $("selCard").innerHTML=selCardHTML(q);
  document.querySelectorAll("#tblGeo tr[data-pt]").forEach(tr=>tr.classList.toggle("on", tr.dataset.pt===id));
  const row=document.querySelector(`#tblGeo tr[data-pt="${CSS.escape(id)}"]`); if(row && !center) row.scrollIntoView({block:"nearest"});
  drawCad();
  if(MAPV.leaflet && q) MAPV.leaflet.map.setView([q.lat,q.lon], Math.max(MAPV.leaflet.map.getZoom(),17));
}

/* ── عرض الأقمار الصناعية (نسخة الجهاز + اتصال إنترنت) ── */
function loadLeaflet(){
  return new Promise((res,rej)=>{
    if(window.L) return res(window.L);
    const css=document.createElement("link"); css.rel="stylesheet"; css.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(css);
    const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    s.onload=()=>res(window.L); s.onerror=rej; document.head.appendChild(s);
    setTimeout(()=>rej(new Error("timeout")), 12000);
  });
}
function fitSat(){
  const pts=geoPoints(P()); if(!pts.length||!MAPV.leaflet) return;
  MAPV.leaflet.map.fitBounds(pts.map(q=>[q.lat,q.lon]), {padding:[40,40]});
}
async function mountSat(){
  const host=$("sat");
  if(!STANDALONE){
    host.innerHTML=`<div style="position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#cfe0db;font-size:13px;line-height:1.8">
      ${T("صور الأقمار الصناعية تعمل في نسخة التطبيق على جهازك.<br>هنا استخدم «فتح في Google Earth (KML)» أو روابط Google Maps لكل نقطة.","Satellite imagery works in the desktop copy of the app.<br>Here, use “Open in Google Earth (KML)” or the Google Maps links per point.")}</div>`;
    return;
  }
  try{
    const L=await loadLeaflet();
    if(!$("sat")) return;
    host.innerHTML=""; const div=document.createElement("div"); div.style.cssText="position:absolute;inset:0"; host.appendChild(div);
    const map=L.map(div,{zoomControl:false,attributionControl:true});
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {maxZoom:20, maxNativeZoom:19, attribution:"Imagery © Esri"}).addTo(map);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:19,opacity:.7}).addTo(map);
    const pts=geoPoints(P()), fs=feeders(pts);
    fs.forEach(f=>{
      L.polyline(f.pts.map(q=>[q.lat,q.lon]),{color:f.color,weight:4,dashArray:"8 5",opacity:.95}).addTo(map);
      f.pts.forEach(q=>{
        const m=L.circleMarker([q.lat,q.lon],{radius:q.type==="4W"?8:6.5,color:"#fff",weight:2,fillColor:f.color,fillOpacity:1}).addTo(map);
        m.bindTooltip(`${q.id}${q.hasTR?" + TR":""}`,{permanent:true,direction:f.idx%2?"left":"right",className:"",opacity:.9});
        m.on("click",()=>selectPt(q.id));
      });
    });
    MAPV.leaflet={map}; fitSat();
  }catch(e){
    host.innerHTML=`<div style="position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#cfe0db;font-size:13px">
      ${T("تعذّر تحميل صور الأقمار الصناعية — تأكد من اتصال الإنترنت ثم اضغط «قمر صناعي» مرة أخرى.","Could not load satellite imagery — check the internet connection and press “Satellite” again.")}</div>`;
  }
}

/* ══════════ ملفات التصدير ══════════ */
const ascii = s => String(s||"").replace(/[^\x20-\x7E]/g,"").trim();
function kmlDoc(p){
  const pts=geoPoints(p), fs=feeders(pts);
  const kcol = hex => "ff"+hex.slice(4,6)+hex.slice(2,4)+hex.slice(0,2);
  const x = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const styles = fs.map((f,i)=>`
  <Style id="line${i}"><LineStyle><color>${kcol(FEED_HEX[i%4])}</color><width>4</width></LineStyle></Style>
  <Style id="p3_${i}"><IconStyle><color>${kcol(FEED_HEX[i%4])}</color><scale>1.1</scale><Icon><href>http://maps.google.com/mapfiles/kml/shapes/placemark_circle.png</href></Icon></IconStyle><LabelStyle><scale>0.85</scale></LabelStyle></Style>
  <Style id="p4_${i}"><IconStyle><color>${kcol(FEED_HEX[i%4])}</color><scale>1.2</scale><Icon><href>http://maps.google.com/mapfiles/kml/shapes/square.png</href></Icon></IconStyle><LabelStyle><scale>0.85</scale></LabelStyle></Style>`).join("");
  const folders = fs.map((f,i)=>`
  <Folder><name>${x(f.name)} — ${f.pts.length} ${f.noRoute?"points":"RMU"}${f.noRoute?"":" — "+Math.round(f.len)+" m"}</name><open>1</open>
    ${f.noRoute?"":`<Placemark><name>${x(f.name)} route</name><styleUrl>#line${i}</styleUrl>
      <description>Straight-line sequence between units: ${Math.round(f.len)} m</description>
      <LineString><tessellate>1</tessellate><coordinates>${f.pts.map(q=>`${q.lon},${q.lat},0`).join(" ")}</coordinates></LineString></Placemark>`}
    ${f.pts.map(q=>`<Placemark><name>${x(q.id)}</name><styleUrl>#p${q.type==="3W"?3:4}_${i}</styleUrl>
      <description><![CDATA[<b>${q.id}</b><br/>Feeder: ${q.feeder}<br/>Type: RMU ${q.type}${q.hasTR?" + "+q.tr:""}<br/>Relay: ${q.relay} ${q.model}<br/>Setting done: ${q.set?"YES":"NO"}<br/>Earth: ${q.ohm} ohm<br/>Lat/Lon: ${q.lat.toFixed(6)}, ${q.lon.toFixed(6)}<br/>UTM ${q.zone}N: E ${q.E.toFixed(2)} N ${q.N.toFixed(2)}]]></description>
      <ExtendedData><Data name="feeder"><value>${x(q.feeder)}</value></Data><Data name="type"><value>${x(q.type)}</value></Data><Data name="tr"><value>${x(q.tr)}</value></Data><Data name="E_utm"><value>${q.E.toFixed(2)}</value></Data><Data name="N_utm"><value>${q.N.toFixed(2)}</value></Data></ExtendedData>
      <Point><coordinates>${q.lon},${q.lat},0</coordinates></Point></Placemark>`).join("\n    ")}
  </Folder>`).join("");
  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>
  <name>${x(p.name)} — ${x(p.wo)}</name>
  <description>${x(p.site)} · WGS84</description>${styles}${folders}
</Document>
</kml>`;
}
function csvDoc(p){
  const pts=geoPoints(p), fs=feeders(pts);
  const rows=[["Name","Latitude","Longitude","Feeder","Type","TR","Relay","Setting","Earth_ohm","UTM_E","UTM_N","UTM_Zone","Seq"]];
  fs.forEach(f=>f.pts.forEach((q,i)=>rows.push([q.id,q.lat.toFixed(6),q.lon.toFixed(6),q.feeder,"RMU "+q.type,q.tr||"",q.relay+" "+q.model,q.set?"YES":"NO",q.ohm,q.E.toFixed(2),q.N.toFixed(2),q.zone+"N",i+1])));
  return "﻿"+rows.map(r=>r.map(c=>/[",\n]/.test(String(c))?`"${String(c).replace(/"/g,'""')}"`:c).join(",")).join("\r\n");
}
function geojsonDoc(p){
  const pts=geoPoints(p), fs=feeders(pts), feats=[];
  fs.forEach(f=>{
    feats.push({type:"Feature",properties:{name:f.name+" route",feeder:f.name,length_m:Math.round(f.len)},geometry:{type:"LineString",coordinates:f.pts.map(q=>[q.lon,q.lat])}});
    f.pts.forEach(q=>feats.push({type:"Feature",properties:{name:q.id,feeder:q.feeder,type:q.type,tr:q.tr||"",relay:q.relay,setting:q.set,earth_ohm:+q.ohm,utm_e:+q.E.toFixed(2),utm_n:+q.N.toFixed(2)},geometry:{type:"Point",coordinates:[q.lon,q.lat]}}));
  });
  return JSON.stringify({type:"FeatureCollection",name:p.name,features:feats},null,1);
}
/* DXF R12 بإحداثيات UTM حقيقية (متر) */
function dxfDoc(p){
  const pts=geoPoints(p), fs=feeders(pts), zone=pts[0]?pts[0].zone:38, out=[];
  const w=(...a)=>{ for(let i=0;i<a.length;i+=2){ out.push(String(a[i])); out.push(String(a[i+1])); } };
  const f3=n=>Number(n).toFixed(3);
  const layers=[["RMU-3W",4],["RMU-4W",5],["TR",1],["TEXT",7],["COORD",8],["GRID",252],["FRAME",7],["NORTH",7]];
  fs.forEach((f,i)=>layers.push(["MV-"+ascii(f.name).replace(/\s+/g,"_"),[4,2,5,1][i%4]]));
  const minE=Math.min(...pts.map(q=>q.E))-400, maxE=Math.max(...pts.map(q=>q.E))+400;
  const minN=Math.min(...pts.map(q=>q.N))-400, maxN=Math.max(...pts.map(q=>q.N))+400;
  w(0,"SECTION",2,"HEADER",9,"$ACADVER",1,"AC1009",9,"$INSBASE",10,"0.0",20,"0.0",30,"0.0",
    9,"$EXTMIN",10,f3(minE),20,f3(minN),30,"0.0",9,"$EXTMAX",10,f3(maxE),20,f3(maxN),30,"0.0",
    9,"$LIMMIN",10,f3(minE),20,f3(minN),9,"$LIMMAX",10,f3(maxE),20,f3(maxN),9,"$TEXTSIZE",40,"5.0",0,"ENDSEC");
  w(0,"SECTION",2,"TABLES",
    0,"TABLE",2,"LTYPE",70,"1",0,"LTYPE",2,"CONTINUOUS",70,"0",3,"Solid line",72,"65",73,"0",40,"0.0",0,"ENDTAB",
    0,"TABLE",2,"LAYER",70,String(layers.length));
  layers.forEach(([n,c])=>w(0,"LAYER",2,n,70,"0",62,String(c),6,"CONTINUOUS"));
  w(0,"ENDTAB",0,"TABLE",2,"STYLE",70,"1",0,"STYLE",2,"STANDARD",70,"0",40,"0.0",41,"1.0",50,"0.0",71,"0",42,"2.5",3,"txt",4,"",0,"ENDTAB",0,"ENDSEC");
  w(0,"SECTION",2,"ENTITIES");
  const line=(L,x1,y1,x2,y2)=>w(0,"LINE",8,L,10,f3(x1),20,f3(y1),30,"0.0",11,f3(x2),21,f3(y2),31,"0.0");
  const text=(L,x,y,h,s,rot=0)=>w(0,"TEXT",8,L,10,f3(x),20,f3(y),30,"0.0",40,f3(h),1,ascii(s)||"-",50,f3(rot));
  const poly=(L,vs)=>{ w(0,"POLYLINE",8,L,66,"1",70,"1",10,"0.0",20,"0.0",30,"0.0"); vs.forEach(([x,y])=>w(0,"VERTEX",8,L,10,f3(x),20,f3(y),30,"0.0")); w(0,"SEQEND",8,L); };
  // grid 500 m
  const g=500;
  for(let e=Math.ceil(minE/g)*g;e<=maxE;e+=g){ line("GRID",e,minN,e,maxN); text("GRID",e+4,minN+6,8,"E "+e,90); }
  for(let n=Math.ceil(minN/g)*g;n<=maxN;n+=g){ line("GRID",minE,n,maxE,n); text("GRID",minE+6,n+4,8,"N "+n); }
  // frame + title block
  poly("FRAME",[[minE,minN],[maxE,minN],[maxE,maxN],[minE,maxN]]);
  const tbx=minE+10, tby=minN+20;
  text("TEXT",tbx,tby+72,16,"OH TO UG CONVERSION - W/O "+ascii(p.wo));
  text("TEXT",tbx,tby+50,10,"SITE: "+(ascii(p.site)||"NAJRAN")+"  |  RMU: "+pts.length+"  |  FEEDERS: "+fs.map(f=>ascii(f.name)).join(", "));
  text("TEXT",tbx,tby+32,9,"COORDINATES: WGS84 / UTM ZONE "+zone+"N  -  UNITS: METRES");
  text("TEXT",tbx,tby+15,9,fs.map(f=>ascii(f.name)+" ROUTE "+Math.round(f.len)+" m").join("   "));
  text("TEXT",tbx,tby,7,"Generated from project coordinates - straight line between consecutive units, not trench path");
  // north arrow
  const nx=maxE-60, ny=maxN-120;
  line("NORTH",nx,ny,nx,ny+80); line("NORTH",nx,ny+80,nx-14,ny+50); line("NORTH",nx,ny+80,nx+14,ny+50); text("NORTH",nx-6,ny+90,18,"N");
  // routes
  fs.forEach(f=>{
    if(f.noRoute) return;
    const L="MV-"+ascii(f.name).replace(/\s+/g,"_");
    for(let i=1;i<f.pts.length;i++){
      const a=f.pts[i-1], b=f.pts[i]; line(L,a.E,a.N,b.E,b.N);
      const mx=(a.E+b.E)/2, my=(a.N+b.N)/2, ang=Math.atan2(b.N-a.N,b.E-a.E)*180/Math.PI;
      const rot = (ang>90||ang<-90) ? ang+180 : ang;
      text(L,mx+6,my+6,5,Math.round(b.seg)+" m",rot);
    }
  });
  // symbols
  fs.forEach(f=>{
    const side = f.idx%2===0 ? 1 : -1;
    f.pts.forEach(q=>{
      w(0,"POINT",8,q.type==="3W"?"RMU-3W":"RMU-4W",10,f3(q.E),20,f3(q.N),30,"0.0");
      if(q.type==="3W") w(0,"CIRCLE",8,"RMU-3W",10,f3(q.E),20,f3(q.N),30,"0.0",40,"8.0");
      else poly("RMU-4W",[[q.E-8,q.N-8],[q.E+8,q.N-8],[q.E+8,q.N+8],[q.E-8,q.N+8]]);
      if(q.hasTR){ const tx=q.E+side*22; poly("TR",[[tx-7,q.N-6],[tx+7,q.N-6],[tx,q.N+8]]); }
      const lx = side>0 ? q.E+(q.hasTR?34:14) : q.E-(q.hasTR?34:14)-110;
      text("TEXT",lx,q.N+2,8,q.id+" ("+q.type+(q.hasTR?"+TR":"")+")");
      text("COORD",lx,q.N-9,4.5,"E "+q.E.toFixed(2)+"  N "+q.N.toFixed(2));
      text("COORD",lx,q.N-16,4.5,q.lat.toFixed(6)+", "+q.lon.toFixed(6));
    });
  });
  w(0,"ENDSEC",0,"EOF");
  return out.join("\r\n");
}

  }
  const r = await saveFile(name, content, mime);
  if(r===true) toast(T("تم التنزيل: ","Downloaded: ")+name);
}
