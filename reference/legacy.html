<script>
"use strict";
/* ═══════════ محرّك التقاط الإحداثيات — كروكي / إكسل / PDF / Word / KML ═══════════ */
const TEXTDATA = {};                 // id → نص الملف (PDF/Word) لإعادة المسح السريع
const GEO_BOX = {lat:[15.5,33.5], lon:[33.5,56.5]};   // حدود المملكة — تمنع الأرقام العابرة
const inKSA = (la,lo) => la>=GEO_BOX.lat[0] && la<=GEO_BOX.lat[1] && lo>=GEO_BOX.lon[0] && lo<=GEO_BOX.lon[1];
const okLL  = (la,lo) => isFinite(la) && isFinite(lo) && Math.abs(la)<=90 && Math.abs(lo)<=180;

/* درجات/دقائق/ثوان → عشري */
function dms(str){
  const m=String(str).match(/(-?\d{1,3})\s*[°ºd:\s]\s*(\d{1,2})\s*['′m:\s]\s*(\d{1,2}(?:\.\d+)?)\s*["″s]?\s*([NSEWنجشق])?/i);
  if(!m) return null;
  let v=Math.abs(+m[1]) + (+m[2])/60 + (+m[3])/3600;
  if(+m[1]<0 || /[SW]/i.test(m[4]||"")) v=-v;
  return {v, hemi:(m[4]||"").toUpperCase()};
}
/* خلية واحدة قد تحمل زوج إحداثيات كاملًا */
function cellPair(v){
  const s=String(v==null?"":v).trim();
  if(s.length<7 || s.length>80) return null;
  if(!/\d[.,°º\s]\d/.test(s)) return null;               // فحص سريع قبل التعبيرات النمطية
  // 17°41'37.4"N 44°27'33.9"E
  const two=s.split(/[,;|]|\s{2,}|(?<=["″NSEW])\s+/i).filter(x=>/\d/.test(x));
  if(two.length>=2){
    const a=dms(two[0]), b=dms(two[1]);
    if(a&&b){
      let la=a.v, lo=b.v;
      if(a.hemi==="E"||b.hemi==="N"){ la=b.v; lo=a.v; }
      if(okLL(la,lo) && inKSA(la,lo)) return {lat:la, lon:lo};
    }
  }
  // 17.693713, 44.459428  |  N17.693713 E44.459428  |  17.693713 44.459428
  const m=s.match(/([NSنج]?\s*-?\d{1,3}\.\d{3,10})\s*[°º]?\s*[,;\s]+\s*([EWشق]?\s*-?\d{1,3}\.\d{3,10})/i);
  if(m){
    let a=parseFloat(String(m[1]).replace(/[^\d.\-]/g,"")), b=parseFloat(String(m[2]).replace(/[^\d.\-]/g,""));
    let la=a, lo=b;
    if(!inKSA(la,lo) && inKSA(b,a)){ la=b; lo=a; }
    if(okLL(la,lo) && inKSA(la,lo)) return {lat:la, lon:lo};
  }
  return null;
}
/* أعمدة الإحداثيات في ورقة إكسل */
const H_LAT = /(lat(itude)?|خطالعرض|خط العرض|شمال|احداثيشمالي|عرض)/i;
const H_LON = /(lon(g(itude)?)?|خطالطول|خط الطول|شرق|احداثيشرقي|طول)/i;
const H_ANY = /(gps|coord|احداث|الاحداثيات|الموقع|location|position|utm)/i;
const H_E   = /^(e|easting|utm ?e|شرقي|الاحداثي الشرقي)$/i;
const H_N   = /^(n|northing|utm ?n|شمالي|الاحداثي الشمالي)$/i;
const H_ID  = /(unit|rmu|اسم|رقم|الوحده|المحطه|النقطه|point|name|id|وصف|بيان)/i;

function headerRow(rows){
  let best=-1, score=0;
  for(let r=0;r<Math.min(12, rows.length);r++){
    const s=(rows[r]||[]).reduce((a,c)=>a+((H_LAT.test(nz(c))||H_LON.test(nz(c))||H_ANY.test(nz(c))||H_E.test(String(c).trim())||H_N.test(String(c).trim()))?1:0),0);
    if(s>score){ score=s; best=r; }
  }
  return score? best : -1;
}
/* كل إحداثيات ورقة واحدة — بلا ذكاء اصطناعي، سريع */
function sheetGeo(sh, fileName){
  const rows=sh.rows||[], out=[];
  if(!rows.length) return out;
  const hr=headerRow(rows);
  let cLat=-1, cLon=-1, cE=-1, cN=-1, cId=-1, cZone=-1;
  if(hr>=0){
    const hdr=(rows[hr]||[]).map(c=>nz(c)), raw=(rows[hr]||[]).map(c=>String(c==null?"":c).trim());
    hdr.forEach((h,i)=>{
      if(cLat<0 && H_LAT.test(h)) cLat=i;
      else if(cLon<0 && H_LON.test(h)) cLon=i;
      if(cE<0 && H_E.test(raw[i])) cE=i;
      if(cN<0 && H_N.test(raw[i])) cN=i;
      if(cZone<0 && /zone|منطقه/i.test(h)) cZone=i;
      if(cId<0 && H_ID.test(h)) cId=i;
    });
  }
  const rowId = (r, i) => {
    if(cId>=0 && String(r[cId]||"").trim()) return String(r[cId]).trim().slice(0,22);
    for(const c of r){ const s=String(c==null?"":c).trim(); if(/^R\s?1\d{5}$/i.test(s)) return s.replace(/\s+/g,""); }
    for(const c of r){ const s=String(c==null?"":c).trim();
      if(s.length>=3 && s.length<=22 && !/^\d+([.,]\d+)?$/.test(s) && !cellPair(s)) return s; }
    return "PT";
  };
  const push = (lat, lon, id, row) => {
    if(!okLL(lat,lon) || !inKSA(lat,lon)) return;
    out.push({id, lat, lon, type:"PT", src:`${fileName} · ${sh.name} · ${T("صف","row")} ${row+1}`});
  };
  const max=Math.min(rows.length, 6000);
  for(let i=(hr>=0?hr+1:0); i<max; i++){
    const r=rows[i]||[]; if(!r.length) continue;
    let done=false;
    if(cLat>=0 && cLon>=0){
      const a=String(r[cLat]==null?"":r[cLat]).trim(), b=String(r[cLon]==null?"":r[cLon]).trim();
      if(a&&b){
        let la=parseFloat(a.replace(/[^\d.\-]/g,"")), lo=parseFloat(b.replace(/[^\d.\-]/g,""));
        const da=dms(a), db=dms(b); if(da&&db){ la=da.v; lo=db.v; }
        if(okLL(la,lo)){
          if(!inKSA(la,lo) && inKSA(lo,la)){ const t=la; la=lo; lo=t; }
          if(inKSA(la,lo)){ push(la,lo,rowId(r,i),i); done=true; }
        }
      }
    }
    if(!done && cE>=0 && cN>=0){
      const E=parseFloat(String(r[cE]).replace(/[^\d.\-]/g,"")), N=parseFloat(String(r[cN]).replace(/[^\d.\-]/g,""));
      const z=cZone>=0? (parseInt(String(r[cZone]).replace(/\D/g,""),10)||38) : 38;
      if(isFinite(E)&&isFinite(N)&&E>100000&&E<900000&&N>1000000&&N<4000000){
        const ll=utmToLL(E,N,z); if(inKSA(ll.lat,ll.lon)){ push(ll.lat, ll.lon, rowId(r,i), i); done=true; }
      }
    }
    if(!done){
      for(const c of r){ const q=cellPair(c); if(q){ push(q.lat, q.lon, rowId(r,i), i); break; } }
    }
  }
  return out;
}
/* كل إحداثيات مصنّف كامل */
function bookGeo(sheets, fileName){
  const out=[];
  (sheets||[]).forEach(sh=>{ try{ sheetGeo(sh, fileName).forEach(x=>out.push(x)); }catch(e){} });
  return out;
}
/* مسح نصي موسّع: عشري + DMS + N/E + UTM */
function textGeo(text, name){
  const out=[], s=String(text||"");
  const push=(la,lo,id)=>{ if(okLL(la,lo)&&inKSA(la,lo)) out.push({id:id||"PT", lat:la, lon:lo, type:"PT", src:name}); };
  let m;
  const dec=/(-?\d{1,3}\.\d{3,10})\s*[°º]?\s*[,;\s]+\s*(-?\d{1,3}\.\d{3,10})/g;
  while((m=dec.exec(s))){ let a=+m[1], b=+m[2]; if(inKSA(a,b)) push(a,b); else if(inKSA(b,a)) push(b,a); }
  const d2=/(\d{1,3})\s*[°º]\s*(\d{1,2})\s*['′]\s*(\d{1,2}(?:\.\d+)?)\s*["″]?\s*([NSشج])[\s,;]+(\d{1,3})\s*[°º]\s*(\d{1,2})\s*['′]\s*(\d{1,2}(?:\.\d+)?)\s*["″]?\s*([EWقغ])/gi;
  while((m=d2.exec(s))){
    const la=+m[1]+(+m[2])/60+(+m[3])/3600, lo=+m[5]+(+m[6])/60+(+m[7])/3600;
    push(/[Ss]/.test(m[4])?-la:la, /[Ww]/.test(m[8])?-lo:lo);
  }
  const lab=/(?:lat(?:itude)?|خط\s*العرض)\D{0,12}(-?\d{1,3}\.\d{3,10})[\s\S]{0,40}?(?:lon(?:g|gitude)?|خط\s*الطول)\D{0,12}(-?\d{1,3}\.\d{3,10})/gi;
  while((m=lab.exec(s))) push(+m[1], +m[2]);
  const utm=/\bE\s*[:=]?\s*(\d{6}(?:\.\d+)?)\D{1,12}N\s*[:=]?\s*(\d{7}(?:\.\d+)?)/gi;
  while((m=utm.exec(s))){ const ll=utmToLL(+m[1], +m[2], 38); push(ll.lat, ll.lon); }
  return out;
}
/* دمج مع منع التكرار الدقيق (≈1 م) */
function mergeGeo(p, pts, rep, name){
  if(!pts.length) return 0;
  p.geo = p.geo || [];
  const key=(la,lo)=>la.toFixed(5)+","+lo.toFixed(5);
  const seen=new Set(p.geo.map(g=>key(+g.lat,+g.lon)));
  (p.rmus||[]).forEach(r=>{ const m=String(r.gps||"").match(/(-?\d+\.\d+)\s*[,،\s]\s*(-?\d+\.\d+)/); if(m) seen.add(key(+m[1],+m[2])); });
  let n=0;
  pts.forEach(x=>{
    const k=key(+x.lat,+x.lon); if(seen.has(k)) return; seen.add(k);
    p.geo.push({id:(x.id&&x.id!=="PT")?String(x.id).slice(0,22):"PT-"+(p.geo.length+1),
                lat:+x.lat, lon:+x.lon, src:x.src||name, type:x.type||"PT"});
    n++;
  });
  if(n && rep) rep.push(["ok", T(`${n} إحداثي جديد من «${name}» — يظهر على الخريطة و Google Earth`,
    `${n} new coordinates from “${name}” — visible on the map and in Google Earth`)]);
  return n;
}

/* ── قارئ PDF أمرن: Flate + ASCII85 + deflate-raw + نصوص hex ── */
function a85(s){
  s=s.replace(/^<~/,"").replace(/~>[\s\S]*$/,"").replace(/\s+/g,"");
  const out=[]; let t=0, n=0;
  for(const ch of s){
    if(ch==="z" && n===0){ out.push(0,0,0,0); continue; }
    const c=ch.charCodeAt(0)-33; if(c<0||c>84) continue;
    t=t*85+c; if(++n===5){ out.push((t>>>24)&255,(t>>>16)&255,(t>>>8)&255,t&255); t=0; n=0; }
  }
  if(n){ for(let i=n;i<5;i++) t=t*85+84; const b=[(t>>>24)&255,(t>>>16)&255,(t>>>8)&255,t&255]; out.push(...b.slice(0,n-1)); }
  return new Uint8Array(out);
}
async function inflateBytes(bytes, mode){
  const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream(mode));
  return new Uint8Array(await new Response(ds).arrayBuffer());
}
async function readPdfTextPlus(buf){
  const u8=new Uint8Array(buf), L=new TextDecoder("latin1"), raw=L.decode(u8);
  let out="";
  const re=/stream\r?\n/g; let m;
  while((m=re.exec(raw))){
    const st=m.index+m[0].length, en=raw.indexOf("endstream", st);
    if(en<0) continue;
    const head=raw.slice(Math.max(0,m.index-400), m.index);
    let bytes=u8.subarray(st,en), s="";
    try{
      if(/ASCII85Decode/.test(head)) bytes=a85(L.decode(bytes));
      if(/FlateDecode/.test(head)){
        try{ bytes=await inflateBytes(bytes,"deflate"); }
        catch(e){ bytes=await inflateBytes(bytes,"deflate-raw"); }
      }
      s=L.decode(bytes);
    }catch(e){ s=raw.slice(st,en); }
    if(!/T[Jj]/.test(s)){ re.lastIndex=en; continue; }
    s.replace(/\(((?:\\.|[^\\()])*)\)\s*Tj/g, (_,g)=>{ out+=g.replace(/\\([()\\])/g,"$1")+" "; return ""; });
    s.replace(/\[((?:[^\][]|\\.)*)\]\s*TJ/g, (_,g)=>{ g.replace(/\(((?:\\.|[^\\()])*)\)/g,(__,t)=>{ out+=t.replace(/\\([()\\])/g,"$1"); return ""; }); out+=" "; return ""; });
    s.replace(/<([0-9A-Fa-f\s]{4,})>\s*Tj/g, (_,g)=>{ const h=g.replace(/\s+/g,"");
      for(let i=0;i+3<h.length;i+=4){ const cp=parseInt(h.substr(i,4),16); if(cp>31&&cp<65533) out+=String.fromCharCode(cp); } out+=" "; return ""; });
    out+="\n";
    re.lastIndex=en;
  }
  return out;
}
readPdfText = readPdfTextPlus;

/* ── توسيع خط المعالجة: التقاط الإحداثيات من كل ملف ── */
(function(){
  const _pf = processFile;
  processFile = async function(f, rec, rep){
    const p=P(), ext=rec.ext;
    // نص PDF/Word يُحفظ لإعادة المسح لاحقًا بلا رفع جديد
    const out = await _pf(f, rec, rep);
    try{
      let pts=[];
      if(["xlsx","xlsm","csv"].includes(ext) && Array.isArray(FILEDATA[rec.id])) pts = bookGeo(FILEDATA[rec.id], rec.name);
      else if(ext==="pdf" || ext==="docx"){
        const t = TEXTDATA[rec.id] || (ext==="pdf" ? await readPdfText(await f.arrayBuffer()) : await readDocxText(await f.arrayBuffer()));
        TEXTDATA[rec.id]=t; pts = textGeo(t, rec.name);
      } else if(["txt","xml"].includes(ext)){
        const t=await f.text(); TEXTDATA[rec.id]=t; pts = textGeo(t, rec.name);
      } else if(["kml","gpx","geojson","json"].includes(ext)){
        const t=await f.text(); TEXTDATA[rec.id]=t;          // يُحفظ لإعادة المسح بلا رفع
        pts = readGeoText(t, rec.name).concat(textGeo(t, rec.name));
      }
      const n = mergeGeo(p, pts, rep, rec.name);
      rec.geoN = (rec.geoN||0) + n;
      if(n) rec.imported = true;
    }catch(e){}
    return out;
  };
})();

/* ── إعادة مسح كل الملفات المحفوظة (سريع، بلا رفع) ── */
function rescanGeo(rep){
  const p=P(); let n=0, scanned=0;
  (p.files||[]).forEach(f=>{
    if(f.blocked) return;
    let pts=null;
    if(Array.isArray(FILEDATA[f.id])) pts = bookGeo(FILEDATA[f.id], f.name);
    else if(TEXTDATA[f.id]) pts = ["kml","gpx","geojson","json"].includes(f.ext)
      ? readGeoText(TEXTDATA[f.id], f.name).concat(textGeo(TEXTDATA[f.id], f.name))
      : textGeo(TEXTDATA[f.id], f.name);
    if(!pts) return;
    scanned++;
    const k = mergeGeo(p, pts, null, f.name);
    f.geoN=(f.geoN||0)+k; n+=k;
  });
  if(rep) rep.push([n?"ok":"warn", n
    ? T(`مسح ${scanned} ملف — ${n} إحداثي جديد أُضيف`, `Scanned ${scanned} file(s) — ${n} new coordinates added`)
    : T(`مسح ${scanned} ملف — لا إحداثيات جديدة`, `Scanned ${scanned} file(s) — no new coordinates`)]);
  return n;
}

/* ── إدراج المسح داخل «تحديث واستكمال» ── */
(function(){
  const _mg = matchGeoUnits;

     :`<div class="note">${T("لم تُستخرج إحداثيات من الملفات بعد. ارفع الكروكي (KML/KMZ/GPX)، أو أي إكسل به أعمدة Latitude/Longitude أو E/N بنظام UTM، أو PDF مكتوب به إحداثيات — ثم اضغط «التقاط كل الإحداثيات».",

<script>
"use strict";
/* ═══════════ استيراد مستقل لكل قسم ═══════════ */
const SEC = {

  mat:{ar:"المواد",en:"Materials"}, units:{ar:"جدول الوحدات",en:"Unit schedule"},

async function secImport(kind, list){

/* ═══════════ الفاتورة — أجور ومواد ═══════════ */
function invOf(p){
  p.inv = p.inv || {no:"", date:"", period:"", retentionPct:10, deduct:0, prev:0, vatPct:15, useVat:false};
  return p.inv;
}
function invRows(p){
  const works=[], mats=[];
  Object.keys(p.boq).forEach(c=>{
    const w=libWork(c); const q=+p.boq[c].exec||0; if(!q) return;
    works.push({c, name:T(w?w.ar:c, w?w.en:c), u:w?w.u:"—", p:(w?(+w.p||0):0), q, amt:(w?(+w.p||0):0)*q, plan:+p.boq[c].plan||0});
  });
  Object.keys(p.mat).forEach(c=>{
    const m=libMat(c); const iss=+p.mat[c].iss||0, req=+p.mat[c].req||0; if(!iss && !req) return;
    mats.push({c, name:T(m?m.ar:c, m?m.en:c), u:m?m.u:"—", p:(m?(+m.p||0):0), iss, req, amt:(m?(+m.p||0):0)*req, k:m?m.k:"detail"});
  });
  works.sort((a,b)=>b.amt-a.amt); mats.sort((a,b)=>b.amt-a.amt);
  return {works, mats};
}
function viewInv(){
  const p=P(), iv=invOf(p), {works, mats}=invRows(p);
  const tab=S.invTab||"works";
  const wSum=works.reduce((s,x)=>s+x.amt,0), mSum=mats.reduce((s,x)=>s+x.amt,0);
  const mMain=mats.filter(x=>x.k==="main").reduce((s,x)=>s+x.amt,0);
  const ind=(wSum+mSum)*(+p.factors.indirectPct||0)/100;
  const gross=wSum+mSum+ind;
  const estTot=(p.estCost.mat||0)+(p.estCost.inst||0)+(p.estCost.ind||0);
  const varPct=estTot? (gross-estTot)/estTot*100 : 0;
  const ret=gross*(+iv.retentionPct||0)/100;
  const vat=iv.useVat? (gross-ret)*(+iv.vatPct||0)/100 : 0;
  const net=gross-ret-(+iv.deduct||0)-(+iv.prev||0)+vat;

  const wTbl=`<table id="tblInvW"><thead><tr><th>#</th><th>${T("رقم البند","Item")}</th><th>${T("الوصف","Description")}</th>
    <th>${T("الوحدة","Unit")}</th><th class="n">${T("السعر","Rate")}</th><th class="n">${T("المخطط","Planned")}</th>
    <th class="n">${T("المنفّذ","Executed")}</th><th class="n">${T("القيمة","Amount")}</th></tr></thead>
    <tbody>${works.map((x,i)=>`<tr><td class="n">${i+1}</td><td class="code">${esc(x.c)}</td>
      <td class="wrap-t">${esc(x.name)}</td><td>${esc(x.u)}</td><td class="n">${nf(x.p,2)}</td>
      <td class="n muted">${nf(x.plan)}</td><td class="n">${nf(x.q)}</td><td class="n">${money(x.amt)}</td></tr>`).join("")
      ||`<tr><td colspan="8" class="muted" style="padding:16px;text-align:center">${T("لا توجد بنود منفّذة — ارفع فاتورة الأجور أو المقايسة","No executed items — upload the wages invoice or the BOQ")}</td></tr>`}</tbody>
    <tfoot><tr><td colspan="7">${T("إجمالي الأجور (التركيبات)","Total works")}</td><td class="n">${money(wSum)}</td></tr></tfoot></table>`;

  const mTbl=`<table id="tblInvM"><thead><tr><th>#</th><th>${T("رقم المادة","Code")}</th><th>${T("الوصف","Description")}</th>
    <th>${T("الوحدة","Unit")}</th><th>${T("التصنيف","Class")}</th><th class="n">${T("السعر","Rate")}</th>
    <th class="n">${T("المصروف","Issued")}</th><th class="n">${T("المركّب","Installed")}</th>

  <div class="body grid g4">
    <label class="fld"><span>${T("رقم المستخلص","Invoice no.")}</span><input type="text" id="iv_no" value="${esc(iv.no)}"></label>

async function invExcel(){
  const p=P(), iv=invOf(p), {works, mats}=invRows(p);
  const wSum=works.reduce((s,x)=>s+x.amt,0), mSum=mats.reduce((s,x)=>s+x.amt,0);
  const ind=(wSum+mSum)*(+p.factors.indirectPct||0)/100, gross=wSum+mSum+ind;
  const ret=gross*(+iv.retentionPct||0)/100, vat=iv.useVat?(gross-ret)*(+iv.vatPct||0)/100:0;
  const net=gross-ret-(+iv.deduct||0)-(+iv.prev||0)+vat;
  const head=[["المشروع", p.name],["أمر العمل", p.wo],["المقاول", CONTRACTORS[p.contractor]||""],
    ["رقم المستخلص", iv.no],["التاريخ", iv.date],["الفترة", iv.period],[]];
  const s1=[...head,["#","رقم البند","الوصف","الوحدة","السعر","المخطط","المنفّذ","القيمة"],
    ...works.map((x,i)=>[i+1,x.c,x.name,x.u,x.p,x.plan,x.q,Math.round(x.amt)]),
    ["","","","","","","إجمالي الأجور",Math.round(wSum)]];
  const s2=[...head,["#","رقم المادة","الوصف","الوحدة","التصنيف","السعر","المصروف","المركّب","الفرق","القيمة"],
    ...mats.map((x,i)=>[i+1,x.c,x.name,x.u,x.k==="main"?"رئيسية":"تفصيلية",x.p,x.iss,x.req,x.req-x.iss,Math.round(x.amt)]),
    ["","","","","","","","","إجمالي المواد",Math.round(mSum)]];
  const s3=[...head,["البند","القيمة (ر.س)"],["إجمالي الأجور",Math.round(wSum)],["إجمالي المواد",Math.round(mSum)],
    [`التكاليف غير المباشرة ${p.factors.indirectPct}%`,Math.round(ind)],["الإجمالي قبل الخصومات",Math.round(gross)],
    [`المحتجز ${iv.retentionPct}%`,-Math.round(ret)],["استقطاعات",-Math.round(iv.deduct||0)],
    ["مستخلصات سابقة",-Math.round(iv.prev||0)],...(iv.useVat?[[`ضريبة ${iv.vatPct}%`,Math.round(vat)]]:[]),
    ["صافي المستحق",Math.round(net)]];
  try{
    const bytes=buildXlsx([["فاتورة الأجور",s1],["فاتورة المواد",s2],["الملخص",s3]]);
    const r=await saveFile(`invoice-${p.wo||"project"}-${(iv.no||"1")}.xlsx`, bytes,
      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
    if(r===true) toast(T("تم تصدير الفاتورة بثلاث أوراق","Invoice exported with three sheets"));
  }catch(e){ toast(T("تعذّر بناء ملف الفاتورة","Could not build the invoice file")); }
}

/* ═══════════ التسجيل والربط ═══════════ */
VIEWS.qty = viewQty; VIEWS.inv = viewInv;
(function(){
  if(!PAGES.some(x=>x.id==="qty")){
    const i=PAGES.findIndex(x=>x.id==="boq");
    PAGES.splice(i<0?2:i, 0, {id:"qty", ar:"الحصر الشامل", en:"Full takeoff"});
    const j=PAGES.findIndex(x=>x.id==="wages");
    PAGES.splice(j<0?PAGES.length:j+1, 0, {id:"inv", ar:"الفاتورة (أجور ومواد)", en:"Invoice (works & materials)"});
  }
  if(typeof PAGE_NAMES!=="undefined"){
    PAGE_NAMES.qty=["الحصر الشامل","Full takeoff"]; PAGE_NAMES.inv=["الفاتورة","Invoice"];
  }
  // أزرار الاستيراد المستقل داخل رؤوس الأقسام القائمة
  const MOUNT={copySheets:"tally", copyBoq:"boq", copyMat:"mat", copyProt:"units", copyAcc:"units", copyWages:"boq"};
  const _r=render;
  render=function(){
    _r();
    const v=$("view"); if(!v) return;
    Object.entries(MOUNT).forEach(([id,kind])=>{ const b=$(id); if(b && !b.previousElementSibling?.dataset?.sec) b.insertAdjacentHTML("beforebegin", secBtnHTML(kind)); });
    const gs=$("geoScan"); if(gs && !gs.previousElementSibling?.dataset?.sec) gs.insertAdjacentHTML("beforebegin", secBtnHTML("geo"));
    if(!$("secFile")){
      const inp=document.createElement("input");
      inp.type="file"; inp.id="secFile"; inp.multiple=true; inp.hidden=true;
      inp.accept=".xlsx,.xlsm,.csv";
      document.body.appendChild(inp);
    }
    const inp=$("secFile");
    inp.onchange=()=>{ if(inp.files && inp.files.length) secImport(S.secKind||"boq", inp.files); };
    v.querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{ S.secKind=b.dataset.sec; inp.value=""; inp.click(); });
    const on=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
    on("copyQty", ()=>copyTable("#tblQty"));
    if(S.page==="inv"){
      const p=P(), iv=invOf(p);
      const bindV=(id,k,num)=>{ const el=$(id); if(el) el.onchange=()=>{ iv[k]=num?(+el.value||0):el.value; save(); render(); }; };
      bindV("iv_no","no"); bindV("iv_date","date"); bindV("iv_period","period");
      bindV("iv_ret","retentionPct",1); bindV("iv_ded","deduct",1); bindV("iv_prev","prev",1); bindV("iv_vat","vatPct",1);
      const uv=$("iv_usevat"); if(uv) uv.onchange=()=>{ iv.useVat=uv.checked; save(); render(); };
      on("invTabW", ()=>{ S.invTab="works"; save(); render(); });
      on("invTabM", ()=>{ S.invTab="mats"; save(); render(); });
      on("invCopy", ()=>copyTable(S.invTab==="mats"?"#tblInvM":"#tblInvW"));
      on("invXls", invExcel);
      on("invPrint", ()=>window.print());
    }
  };
  render();
})();

<script>
"use strict";
/* ═══════════ عرض أصل المستند — كل المرفقات في كل المشاريع ═══════════ */
const DOCDB = {db:null, ok:true};
const BLOBMEM = {};        // احتياطي في الذاكرة لهذه الجلسة
let BLOBSET = new Set();   // معرّفات الملفات التي يوجد أصلها مخزّنًا

function dbOpen(){
  if(DOCDB.db) return Promise.resolve(DOCDB.db);
  return new Promise((res,rej)=>{
    try{
      const rq=indexedDB.open("sec-conv-docs", 1);
      rq.onupgradeneeded=()=>{ const d=rq.result; if(!d.objectStoreNames.contains("files")) d.createObjectStore("files"); };
      rq.onsuccess=()=>{ DOCDB.db=rq.result; res(rq.result); };
      rq.onerror=()=>{ DOCDB.ok=false; rej(rq.error); };
    }catch(e){ DOCDB.ok=false; rej(e); }
  });
}
async function dbPut(id, blob, meta){
  BLOBMEM[id]={blob, ...meta}; BLOBSET.add(id);
  try{
    const d=await dbOpen();
    await new Promise((res,rej)=>{ const t=d.transaction("files","readwrite");
      t.objectStore("files").put({blob, ...meta, at:Date.now()}, id);
      t.oncomplete=res; t.onerror=()=>rej(t.error); });
    return true;
  }catch(e){ return false; }
}
async function dbGet(id){
  if(BLOBMEM[id]) return BLOBMEM[id];
  try{
    const d=await dbOpen();
    return await new Promise((res,rej)=>{ const t=d.transaction("files","readonly");
      const r=t.objectStore("files").get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error); });
  }catch(e){ return null; }
}
async function dbDel(id){
  delete BLOBMEM[id]; BLOBSET.delete(id);
  try{ const d=await dbOpen();
    await new Promise(res=>{ const t=d.transaction("files","readwrite"); t.objectStore("files").delete(id); t.oncomplete=res; t.onerror=res; });
  }catch(e){}
}
async function dbKeys(){
  try{
    const d=await dbOpen();
    return await new Promise((res,rej)=>{ const t=d.transaction("files","readonly");
      const r=t.objectStore("files").getAllKeys(); r.onsuccess=()=>res(r.result||[]); r.onerror=()=>rej(r.error); });
  }catch(e){ return []; }
}
const hasDoc = id => BLOBSET.has(id);

/* ── حفظ أصل كل ملف يُرفع ── */
(function(){
  const _pf = processFile;
  processFile = async function(f, rec, rep){
    try{ if(f && f.size!=null && f.size <= 60e6) await dbPut(rec.id, f, {name:rec.name, type:f.type||"", ext:rec.ext, size:f.size}); }catch(e){}
    return await _pf(f, rec, rep);
  };
})();

/* ── عارض المستند ── */
const DOCV = {id:null, url:null, sheets:null, sh:0};
function docClose(){
  const w=$("docWrap"); if(!w) return;
  if(DOCV.url){ try{ URL.revokeObjectURL(DOCV.url); }catch(e){} DOCV.url=null; }
  w.hidden=true; w.innerHTML=""; DOCV.id=null; DOCV.sheets=null; document.body.style.overflow="";
}
function docSheetHTML(sh){
  const rows=(sh.rows||[]).slice(0,600);
  const wide=rows.reduce((m,r)=>Math.max(m,r.length),0);
  const head="<thead><tr><th></th>"+Array.from({length:Math.min(wide,40)},(_,i)=>{
    let s="", n=i+1; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); } return `<th>${s}</th>`;}).join("")+"</tr></thead>";
  const body=rows.map((r,i)=>`<tr><td class="rn">${i+1}</td>`+
    Array.from({length:Math.min(wide,40)},(_,j)=>`<td>${esc(String(r[j]==null?"":r[j]).slice(0,120))}</td>`).join("")+`</tr>`).join("");
  return `<div class="dsheet"><table>${head}<tbody>${body}</tbody></table></div>
    ${(sh.rows||[]).length>600?`<div class="note">${T(`عُرضت أول 600 صف من ${nf(sh.rows.length)} — نزّل الملف لعرضه كاملًا.`,`First 600 of ${nf(sh.rows.length)} rows shown — download the file to see all of it.`)}</div>`:""}`;
}
function docRenderSheets(){
  const st=$("docStage"); if(!st||!DOCV.sheets) return;
  st.innerHTML=`<div class="dtabs">${DOCV.sheets.map((s,i)=>
    `<button data-dsh="${i}" aria-pressed="${i===DOCV.sh}">${esc(s.name||("Sheet"+(i+1)))} · ${nf((s.rows||[]).length)}</button>`).join("")}</div>
    ${docSheetHTML(DOCV.sheets[DOCV.sh]||{rows:[]})}`;
  st.querySelectorAll("[data-dsh]").forEach(b=>b.onclick=()=>{ DOCV.sh=+b.dataset.dsh; docRenderSheets(); });
}
async function docOpen(id, name){
  const w=$("docWrap"); if(!w) return;
  const rec=(P().files||[]).find(f=>f.id===id) || {name:name||"", ext:""};
  w.innerHTML=`
    <div class="dbar2">
      <button class="btn sm" id="docClose">✕</button>
      <div><div class="t" id="docTitle">${esc(rec.name||name||"")}</div><div class="s" id="docSub">${T("جارٍ الفتح…","Opening…")}</div></div>
      <span class="sp"></span>
      <button class="btn sm" id="docDl">${T("تنزيل الأصل","Download original")}</button>
      <button class="btn sm gh" id="docTab">${T("فتح في تبويب","Open in a tab")}</button>
    </div>
    <div class="dstage" id="docStage"><p class="muted">${T("جارٍ تحميل المستند…","Loading the document…")}</p></div>`;
  w.hidden=false; document.body.style.overflow="hidden"; DOCV.id=id; DOCV.sh=0;
  $("docClose").onclick=docClose;

  const item=await dbGet(id);
  const st=$("docStage"), sub=$("docSub");
  if(!item || !item.blob){
    st.innerHTML=`<div class="note warn">${T("أصل هذا الملف غير محفوظ في هذا المتصفح — رُفع قبل تفعيل حفظ الأصول، أو مُسح تخزين المتصفح. أعد رفعه ليُحفظ أصله ويُعرض هنا.",
      "The original of this file is not stored in this browser — it was uploaded before original-file storage was enabled, or the browser storage was cleared. Upload it again to view it here.")}</div>`;
    sub.textContent=T("الأصل غير متاح","Original unavailable");
    $("docDl").disabled=true; $("docTab").disabled=true;
    return;
  }
  const ext=(rec.ext||(item.name||"").split(".").pop()||"").toLowerCase();
  const url=URL.createObjectURL(item.blob); DOCV.url=url;
  sub.textContent=`${(ext||"—").toUpperCase()} · ${nf((item.size||item.blob.size||0)/1024)} KB`;
  $("docDl").onclick=async()=>{ const r=await saveFile(rec.name||item.name||"document", item.blob, item.type||"application/octet-stream");
    if(r===true) toast(T("تم تنزيل الأصل","Original downloaded")); };
  $("docTab").onclick=()=>{ try{ window.open(url,"_blank","noopener"); }catch(e){ toast(T("تعذّر فتح تبويب جديد","Could not open a new tab")); } };

  try{
    if(["png","jpg","jpeg","webp","gif","bmp","svg"].includes(ext) || /^image\//.test(item.type||"")){
      st.innerHTML=`<img src="${url}" alt="${esc(rec.name||"")}">`;
    }
    else if(ext==="pdf"){
      st.innerHTML=`<iframe src="${url}#view=FitH" title="${esc(rec.name||"PDF")}"></iframe>
        <div class="note">${T("إن لم تظهر الصفحات، اضغط «فتح في تبويب» لعرض الملف بعارض المتصفح.","If the pages do not appear, press “Open in a tab” to view it in the browser's own viewer.")}</div>`;
    }
    else if(["xlsx","xlsm","csv"].includes(ext)){
      let sheets = Array.isArray(FILEDATA[id]) ? FILEDATA[id] : null;
      if(!sheets) sheets = ext==="csv" ? readCsvText(await item.blob.text()) : await readXlsx(await item.blob.arrayBuffer());
      DOCV.sheets=sheets; docRenderSheets();
    }
    else if(ext==="docx"){
      const t=await readDocxText(await item.blob.arrayBuffer());
      st.innerHTML=`<pre style="direction:rtl;text-align:start;font-family:var(--f-ui);font-size:13px">${esc(t||T("المستند بلا نص قابل للقراءة","No readable text in this document"))}</pre>`;
    }
    else if(["kml","gpx","geojson","json","txt","xml","csv"].includes(ext)){
      const t=await item.blob.text();
      st.innerHTML=`<pre>${esc(t.slice(0,200000))}</pre>`;
    }
    else {
      st.innerHTML=`<div class="note">${T("لا يمكن عرض هذه الصيغة داخل المنصة — استخدم «تنزيل الأصل» أو «فتح في تبويب».",
        "This format cannot be previewed inside the platform — use “Download original” or “Open in a tab”.")}</div>`;
    }
  }catch(e){
    st.innerHTML=`<div class="note warn">${T("تعذّر عرض الملف: ","Could not render the file: ")+esc(e.message||e)}</div>`;
  }
}

/* ── زر «عرض أصل المستند» بجوار كل مرفق ── */
function docBtnHTML(id){
  return hasDoc(id)
    ? `<button class="btn sm docbtn noprint" data-doc="${esc(id)}">👁 ${T("عرض الأصل","View original")}</button>`
    : `<button class="btn sm gh docbtn noprint" data-doc="${esc(id)}" title="${T("الأصل غير محفوظ — أعد رفع الملف","Original not stored — upload the file again")}">👁 ${T("عرض الأصل","View original")}</button>`;
}
/* بطاقة كل المرفقات في كل المشاريع */
function docAllCard(){
  const rows=[];
  S.projects.forEach((p,pi)=>(p.files||[]).forEach(f=>rows.push({pi, wo:p.wo, pname:p.name, f})));
  const stored=rows.filter(r=>hasDoc(r.f.id)).length;
  return `
  <div class="card" id="docAll"><header><h3>${T("أصول المستندات — كل المشاريع","Original documents — all projects")}</h3>
    <span class="sub">${nf(rows.length)} ${T("مرفق","attachments")} · ${nf(stored)} ${T("أصلها محفوظ ويُعرض هنا","stored and viewable here")}</span></header>
  <div class="body tight scroll" style="max-height:430px;overflow-y:auto"><table class="stbl"><thead><tr>
    <th>${T("أمر العمل","W/O")}</th><th>${T("المشروع","Project")}</th><th>${T("الملف","File")}</th>
    <th>${T("النوع","Type")}</th><th class="n">${T("الحجم","Size")}</th><th>${T("الحالة","Status")}</th><th>${T("عرض","View")}</th></tr></thead>
    <tbody>${rows.length? rows.map(r=>`<tr>
      <td class="code">${esc(r.wo||"—")}</td><td class="wrap-t">${esc(r.pname)}</td>
      <td class="wrap-t">${esc(r.f.name)}</td><td>${esc(r.f.ext||r.f.kind||"—")}</td>
      <td class="n">${nf((r.f.size||0)/1024)} KB</td>
      <td><span class="pill ${hasDoc(r.f.id)?"ok":"warn"}">${hasDoc(r.f.id)?T("الأصل محفوظ","Stored"):T("أعد رفعه","Re-upload")}</span></td>
      <td class="act">${docBtnHTML(r.f.id)}${r.pi!==S.active?`<button class="btn sm gh noprint" data-gopr="${r.pi}">${T("افتح المشروع","Open project")}</button>`:""}</td></tr>`).join("")
      :`<tr><td colspan="7" class="muted" style="padding:16px;text-align:center">${T("لا مرفقات بعد في أي مشروع","No attachments in any project yet")}</td></tr>`}
    </tbody></table></div>
  <div class="body"><div class="note">${T("يُحفظ أصل كل ملف يُرفع داخل متصفح جهازك (حتى 60 ميجابايت للملف)، فيمكن فتحه لاحقًا من أي صفحة دون إعادة رفعه — الإكسل يُعرض بأوراقه، والـPDF والصور تُعرض كما هي.",
    "Every uploaded file's original is stored inside your browser (up to 60 MB each), so it can be reopened later from any page without re-uploading — Excel opens with its sheets, PDFs and images render as they are.")}</div></div></div>`;
}

/* ── الربط ── */
(function(){
  if(!$("docWrap")){
    const d=document.createElement("div");
    d.className="dwrap"; d.id="docWrap"; d.hidden=true; d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true");
    document.body.appendChild(d);
  }
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("docWrap").hidden) docClose(); });

  const _me = masterExtras;
  masterExtras = function(){ return _me() + docAllCard(); };

  const _r = render;
  render = function(){
    _r();
    const v=$("view"); if(!v) return;
    // زر العرض داخل سجل الكروكيات (عمود الإجراءات) وداخل لوحة تعديل الاستيراد
    v.querySelectorAll("[data-rmf]").forEach(b=>{
      const i=+b.dataset.rmf, f=(P().files||[])[i];
      if(f && !b.previousElementSibling?.dataset?.doc) b.insertAdjacentHTML("beforebegin", docBtnHTML(f.id));
    });
    v.querySelectorAll("[data-uprm]").forEach(b=>{
      const i=+b.dataset.uprm, f=(P().files||[])[i];
      if(f && !b.previousElementSibling?.dataset?.doc) b.insertAdjacentHTML("beforebegin", docBtnHTML(f.id));
    });
    v.querySelectorAll("[data-doc]").forEach(b=>b.onclick=()=>docOpen(b.dataset.doc));
    v.querySelectorAll("[data-gopr]").forEach(b=>b.onclick=()=>{ S.active=+b.dataset.gopr; save(); render(); });
  };
  // تحميل قائمة الأصول المحفوظة ثم إعادة الرسم مرة واحدة
  dbKeys().then(ks=>{
    if(!ks || !ks.length) return;
    BLOBSET=new Set(ks);
    // تنظيف أصول الملفات المحذوفة من السجلات
    const live=new Set(); S.projects.forEach(p=>(p.files||[]).forEach(f=>live.add(f.id)));
    ks.forEach(k=>{ if(!live.has(k)) dbDel(k); });
    render();
  });
  render();
})();
</script>

<script>
"use strict";
/* ═══════════ تفاصيل المعدة + رمز تفاعلي + بالون احترافي ═══════════ */

/* نوع الرمز: 3W دائرة · 4W مربع · مع محول معيّن · نقطة مستوردة */
function mkKind(q){ return q.extra ? "kp" : (q.hasTR ? "kt" : (q.type==="4W" ? "k4" : "k3")); }
function mkGlyphTxt(q){ return q.extra?"◇":(q.hasTR?"◆":(q.type==="4W"?"■":"●")); }

/* نموذج بيانات موحّد لكل معدة */
function uDet(p,q){
  const con = (typeof CONTRACTORS!=="undefined" && CONTRACTORS[p.contractor]) || CONTRACTORS[0] || "";
  return {
    wo:String(p.wo||"").trim(), proj:p.name||"", site:p.site||"",
    admin:p.admin||"", sector:p.sector||"", contractor:con,
    unit:q.id, type:q.type||"", tr:q.hasTR?(q.tr||"TR"):"", feeder:q.feeder||"",
    relay:q.relay||"", model:q.model||"", set:!!q.set, ratio:q.ratio||"", ohm:q.ohm||"",
    lat:q.lat, lon:q.lon, E:q.E, N:q.N, zone:q.zone, seg:+q.seg||0,
    extra:!!q.extra, src:q.src||""
  };
}
/* صفوف التفاصيل — مصدر واحد للبالون وللبطاقة ولملف KML */
function detRows(d){
  const R=[], add=(k,v,m)=>{ if(v===null||v===undefined||v==="") return; R.push([k,v,!!m]); };
  add(T("أمر العمل","Work order"), d.wo||"—", true);
  add(T("المشروع","Project"), d.proj||"—");
  add(T("المقاول","Contractor"), d.contractor||"—");
  add(T("الموقع","Site"), d.site);
  add(T("الإدارة / القطاع","Admin / Sector"), [d.admin,d.sector].filter(Boolean).join(" · "));
  add(T("المغذي","Feeder"), d.feeder||"—");
  add(T("نوع الوحدة","Unit type"), d.extra ? T("نقطة إحداثي مستوردة","Imported geo point")
      : ("RMU "+(d.type||"—")) + (d.tr ? " + "+d.tr : ""));
  if(!d.extra){
    add(T("المحول","Transformer"), d.tr || T("بدون","none"));
    add(T("الريلاي","Relay"), [d.relay,d.model].filter(v=>v&&v!=="—").join(" · ")||"—");
    add(T("نسبة CT","CT ratio"), d.ratio||"—", true);
    add(T("مقاومة التأريض","Earth resistance"), d.ohm!==""?(d.ohm+" Ω"):"—", true);
  }
  if(d.extra && d.src) add(T("مصدر الإحداثي","Coordinate source"), d.src);
  add("WGS84 (Lat, Lon)", d.lat.toFixed(6)+", "+d.lon.toFixed(6), true);
  add("UTM "+d.zone+"N", "E "+nf(d.E,2)+" · N "+nf(d.N,2), true);
  if(d.seg) add(T("من الوحدة السابقة","From previous unit"), nf(Math.round(d.seg))+" m", true);
  return R;
}
const setBadge = d => d.extra ? "" :
  (d.set ? `<span class="bg ok">${T("الضبط مكتمل","Setting done")}</span>`
         : `<span class="bg wr">${T("بانتظار الضبط","Setting pending")}</span>`);

/* ── بالون التفاصيل داخل التطبيق (Leaflet) ── */
function popHTML(d, hex){
  const rows = detRows(d).map(([k,v,m])=>`<tr><th>${esc(k)}</th><td class="${m?"m":""}">${esc(v)}</td></tr>`).join("");
  const kind = d.extra ? T("نقطة","Point") : ("RMU "+(d.type||""));
  return `<div class="secpop" dir="${AR()?"rtl":"ltr"}" style="--mc:${hex}">
    <div class="hd"><div class="u">${esc(d.unit)}<span class="k">${esc(kind)}</span></div>
      <div class="c">${esc(d.contractor||"—")}</div></div>
    <div class="bd">
      ${setBadge(d)?`<div style="margin-bottom:7px">${setBadge(d)}</div>`:""}
      <table>${rows}</table>
      <div class="lk">
        <a href="https://www.google.com/maps/search/?api=1&query=${d.lat},${d.lon}" target="_blank" rel="noopener">Google Maps ↗</a>
        <a href="https://earth.google.com/web/search/${d.lat},${d.lon}" target="_blank" rel="noopener">Earth ↗</a>
        <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${d.lat},${d.lon}" target="_blank" rel="noopener">Street View ↗</a>
        <button type="button" onclick="secCopyPt('${d.lat}','${d.lon}','${esc(d.unit).replace(/'/g,"")}')">${T("نسخ الإحداثي","Copy coord.")}</button>
      </div>
      <div class="ft">${esc(T("الشركة السعودية للكهرباء — تحويل شبكة هوائية إلى أرضية","Saudi Electricity Company — overhead to underground conversion"))}</div>
    </div></div>`;
}
function secCopyPt(lat,lon,id){
  const t=`${id}\t${lat}\t${lon}`;
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(
    ()=>toast(T("تم نسخ إحداثي ","Copied coordinate ")+id), ()=>toast(T("تعذّر النسخ","Copy failed")));
}

/* ── أيقونة Leaflet مخصّصة ── */
function mkIcon(L,q,hex,on){
  return L.divIcon({className:"", iconSize:[24,24], iconAnchor:[12,12], popupAnchor:[0,-12],
    html:`<div class="secmk ${mkKind(q)}${on?" on":""}" style="--mc:${hex}" title="${esc(q.id)}">
      <span class="pg"></span><span class="sh"></span>${q.hasTR?'<span class="tr"></span>':""}</div>`});
}
function mkSync(reg,id){
  if(!reg) return;
  Object.keys(reg).forEach(k=>{
    const el=reg[k] && reg[k]._icon && reg[k]._icon.querySelector(".secmk");
    if(el) el.classList.toggle("on", k===id);
  });
}

/* ══════════ صفحة الكروكي: قمر صناعي برموز تفاعلية ══════════ */
mountSat = async function(){
  const host=$("sat");
  if(!STANDALONE){
    host.innerHTML=`<div style="position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#cfe0db;font-size:13px;line-height:1.8">
      ${T("صور الأقمار الصناعية تعمل في نسخة التطبيق على جهازك.<br>هنا استخدم «فتح في Google Earth (KML)» — البالون بداخله كل تفاصيل المعدة واسم المقاول.","Satellite imagery works in the desktop copy of the app.<br>Here use “Open in Google Earth (KML)” — each balloon carries the full equipment detail and the contractor name.")}</div>`;
    return;
  }
  try{
    const L=await loadLeaflet();
    if(!$("sat")) return;
    host.innerHTML=""; const div=document.createElement("div"); div.style.cssText="position:absolute;inset:0"; host.appendChild(div);
    const map=L.map(div,{zoomControl:false,attributionControl:true});
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {maxZoom:20, maxNativeZoom:19, attribution:"Imagery © Esri"}).addTo(map);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:19,opacity:.7}).addTo(map);
    const p=P(), pts=geoPoints(p), fs=feeders(pts), reg={};
    fs.forEach(f=>{
      if(!f.noRoute) L.polyline(f.pts.map(q=>[q.lat,q.lon]),{color:f.color,weight:4,dashArray:"8 5",opacity:.95}).addTo(map);
      f.pts.forEach(q=>{
        const m=L.marker([q.lat,q.lon],{icon:mkIcon(L,q,f.color,q.id===MAPV.sel),riseOnHover:true,
          keyboard:true, title:q.id}).addTo(map);
        m.bindTooltip(`${q.id}${q.hasTR?" + TR":""}`,{direction:f.idx%2?"left":"right",offset:[f.idx%2?-13:13,0],opacity:.92});
        m.bindPopup(popHTML(uDet(p,q), f.color), {maxWidth:340, minWidth:322, autoPan:true, autoPanPadding:[22,30], keepInView:true, closeButton:true});
        m.on("click",()=>{ selectPt(q.id); });
        reg[q.id]=m;
      });
    });
    MAPV.leaflet={map, reg}; fitSat(); mkSync(reg, MAPV.sel);
  }catch(e){
    host.innerHTML=`<div style="position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#cfe0db;font-size:13px">
      ${T("تعذّر تحميل صور الأقمار الصناعية — تأكد من اتصال الإنترنت ثم اضغط «قمر صناعي» مرة أخرى.","Could not load satellite imagery — check the internet connection and press “Satellite” again.")}</div>`;
  }
};

/* تحديد نقطة: يبرز الرمز ويفتح البالون */
selectPt = function(id, center){
  MAPV.sel=id;
  const p=P(), q=geoPoints(p).find(x=>x.id===id);
  if(center && q && MAPV.view){ MAPV.view.cx=q.E; MAPV.view.cy=q.N; if(MAPV.view.w>MAPV.view.fit.w/3){ MAPV.view.w=MAPV.view.fit.w/3; } }
  const sc=$("selCard"); if(sc) sc.innerHTML=selCardHTML(q);
  document.querySelectorAll("#tblGeo tr[data-pt]").forEach(tr=>tr.classList.toggle("on", tr.dataset.pt===id));
  const row=document.querySelector(`#tblGeo tr[data-pt="${CSS.escape(id)}"]`); if(row && !center) row.scrollIntoView({block:"nearest"});
  drawCad();
  if(MAPV.leaflet){
    mkSync(MAPV.leaflet.reg, id);
    const m=MAPV.leaflet.reg && MAPV.leaflet.reg[id];
    if(q){ MAPV.leaflet.map.setView([q.lat,q.lon], Math.max(MAPV.leaflet.map.getZoom(),17)); }
    if(m && !m.isPopupOpen()) m.openPopup();
  }
};

/* بطاقة النقطة المحددة — نفس مستوى التفاصيل */
selCardHTML = function(q){
  if(!q) return `<p class="muted" style="font-size:12.5px">${T("اضغط أي نقطة على المخطط أو رمز المعدة على الخريطة لعرض كل تفاصيلها.","Click any point on the plan, or an equipment symbol on the map, to see its full detail.")}</p>`;

    <dl class="kv">${rows}</dl>
    <div class="linkrow">
      <a class="btn sm pri" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${q.lat},${q.lon}">Google Maps ↗</a>
      <a class="btn sm" target="_blank" rel="noopener" href="https://earth.google.com/web/search/${q.lat},${q.lon}">Google Earth ↗</a>
      <a class="btn sm gh" target="_blank" rel="noopener" href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${q.lat},${q.lon}">Street View ↗</a>
    </div>
    <div class="cw">${T("المقاول","Contractor")}: <b>${esc(d.contractor||"—")}</b>${d.wo?` · ${T("أمر العمل","W/O")} <b>${esc(d.wo)}</b>`:""}</div>`;
};

<script>
"use strict";
/* ═══════════ KML: رمز متفاعل + بالون تفاصيل احترافي ═══════════ */
const KX = s => String(s==null?"":s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const KCOL = hex => "ff"+hex.slice(4,6)+hex.slice(2,4)+hex.slice(0,2);
const KSH = "https://maps.google.com/mapfiles/kml/shapes/";
const KICON = {c:KSH+"placemark_circle.png", s:KSH+"square.png", t:KSH+"triangle.png", d:KSH+"open-diamond.png"};
const KSCALE = {c:1.15, s:1.2, t:1.3, d:1.05};
/* نوع الرمز في KML */
const kKind = q => q.extra ? "d" : (q.hasTR ? "t" : (q.type==="4W" ? "s" : "c"));
const hx = c => String(c||"").replace("#","");

/* مجموعة أنماط (عادي / عند المرور والضغط) + بالون لكل نوع رمز */
function kStyles(pfx, hex){
  return Object.keys(KICON).map(k=>{
    const balloon = `<BalloonStyle><bgColor>ffF4F8F7</bgColor><textColor>ff10222a</textColor>
      <text>$[description]</text><displayMode>default</displayMode></BalloonStyle>`;
    return `
  <Style id="n_${pfx}_${k}">
    <IconStyle><color>${KCOL(hex)}</color><colorMode>normal</colorMode><scale>${KSCALE[k]}</scale>
      <Icon><href>${KICON[k]}</href></Icon><hotSpot x="0.5" y="0.5" xunits="fraction" yunits="fraction"/></IconStyle>
    <LabelStyle><color>${KCOL(hex)}</color><scale>0.85</scale></LabelStyle>
    ${balloon}</Style>
  <Style id="h_${pfx}_${k}">
    <IconStyle><color>ffffffff</color><colorMode>normal</colorMode><scale>${(KSCALE[k]*1.65).toFixed(2)}</scale>
      <Icon><href>${KICON[k]}</href></Icon><hotSpot x="0.5" y="0.5" xunits="fraction" yunits="fraction"/></IconStyle>
    <LabelStyle><color>ffffffff</color><scale>1.05</scale></LabelStyle>
    ${balloon}</Style>
  <StyleMap id="m_${pfx}_${k}">
    <Pair><key>normal</key><styleUrl>#n_${pfx}_${k}</styleUrl></Pair>
    <Pair><key>highlight</key><styleUrl>#h_${pfx}_${k}</styleUrl></Pair></StyleMap>`;
  }).join("");
}
/* بالون HTML — يظهر عند الضغط على الرمز في Google Earth */
function kBalloon(d, hex){
  const rows = detRows(d).map(([k,v,m])=>
    `<tr><td style="padding:4px 10px;color:#5d6f74;font-size:11px;white-space:nowrap;border-top:1px solid #e2eae9">${KX(k)}</td>
      <td style="padding:4px 10px;color:#10222a;font-size:12.5px;font-weight:bold;border-top:1px solid #e2eae9${m?";font-family:Consolas,monospace;direction:ltr":""}">${KX(v)}</td></tr>`).join("");
  const st = d.extra ? "" : (d.set
    ? `<span style="background:#dff3e4;color:#1d7a3d;padding:2px 8px;border-radius:9px;font-size:10.5px;font-weight:bold">${KX(T("الضبط مكتمل","Setting done"))}</span>`
    : `<span style="background:#fdeed4;color:#8a5b12;padding:2px 8px;border-radius:9px;font-size:10.5px;font-weight:bold">${KX(T("بانتظار الضبط","Setting pending"))}</span>`);
  const kind = d.extra ? KX(T("نقطة إحداثي","Geo point")) : "RMU "+KX(d.type||"");
  return `<div style="font-family:Tahoma,Segoe UI,Arial,sans-serif;direction:${AR()?"rtl":"ltr"};min-width:300px;max-width:400px">
  <div style="background:#${hx(hex)};padding:9px 12px;border-radius:6px 6px 0 0">
    <div style="font:bold 16px Consolas,monospace;color:#08201c;direction:ltr">${KX(d.unit)}
      <span style="font:bold 10px Tahoma;background:rgba(0,0,0,.18);color:#08201c;padding:2px 7px;border-radius:9px;vertical-align:3px">${kind}</span></div>
    <div style="font-size:11.5px;color:#07231d;margin-top:3px;font-weight:bold">${KX(d.contractor||"—")}</div></div>
  ${st?`<div style="padding:7px 12px 0;background:#f4f8f7">${st}</div>`:""}
  <table style="border-collapse:collapse;width:100%;background:#f4f8f7">${rows}</table>
  <div style="padding:8px 12px;background:#e9f1ef;border-radius:0 0 6px 6px;font-size:11px">
    <a href="https://www.google.com/maps/search/?api=1&amp;query=${d.lat},${d.lon}">Google Maps</a> &#183;
    <a href="https://www.google.com/maps/@?api=1&amp;map_action=pano&amp;viewpoint=${d.lat},${d.lon}">Street View</a>
    <div style="margin-top:5px;color:#6a7d80;font-size:10px">${KX(T("الشركة السعودية للكهرباء — تحويل شبكة هوائية إلى أرضية","Saudi Electricity Company — overhead to underground conversion"))}</div></div>
  </div>`;
}
function kExtData(d){
  const e = [["work_order",d.wo],["project",d.proj],["contractor",d.contractor],["site",d.site],
    ["admin",d.admin],["sector",d.sector],["unit",d.unit],["unit_type",d.extra?"POINT":"RMU "+d.type],
    ["transformer",d.tr],["feeder",d.feeder],["relay",d.relay],["relay_model",d.model],
    ["setting_done",d.extra?"":(d.set?"YES":"NO")],["ct_ratio",d.ratio],["earth_ohm",d.ohm],
    ["latitude",d.lat.toFixed(6)],["longitude",d.lon.toFixed(6)],
    ["utm_zone",d.zone+"N"],["utm_e",d.E.toFixed(2)],["utm_n",d.N.toFixed(2)]];
  return "<ExtendedData>"+e.filter(r=>r[1]!==""&&r[1]!=null)
    .map(r=>`<Data name="${r[0]}"><value>${KX(r[1])}</value></Data>`).join("")+"</ExtendedData>";
}
function kPlacemark(pfx, d, q, hex, name){
  return `<Placemark><name>${KX(name)}</name><styleUrl>#m_${pfx}_${kKind(q)}</styleUrl>
      <Snippet maxLines="2">${KX((d.wo?T("أمر عمل ","W/O ")+d.wo+" · ":"")+(d.extra?T("نقطة","Point"):"RMU "+d.type)+(d.tr?" + "+d.tr:"")+" · "+d.contractor)}</Snippet>
      <description><![CDATA[${kBalloon(d,hex)}]]></description>
      ${kExtData(d)}
      <Point><extrude>0</extrude><altitudeMode>clampToGround</altitudeMode><coordinates>${q.lon},${q.lat},0</coordinates></Point></Placemark>`;
}

/* ── KML لمشروع واحد ── */
kmlDoc = function(p){
  const pts=geoPoints(p), fs=feeders(pts);
  const styles = fs.map((f,i)=>`  <Style id="line${i}"><LineStyle><color>${KCOL(hx(f.color))}</color><width>4</width></LineStyle></Style>`+kStyles("f"+i, hx(f.color))).join("");
  const folders = fs.map((f,i)=>`
  <Folder><name>${KX(f.name)} — ${f.pts.length} ${f.noRoute?KX(T("نقطة","points")):"RMU"}${f.noRoute?"":" — "+Math.round(f.len)+" m"}</name><open>1</open>
    ${f.noRoute?"":`<Placemark><name>${KX(f.name)} ${KX(T("مسار","route"))}</name><styleUrl>#line${i}</styleUrl>
      <description><![CDATA[${KX(T("تسلسل خط مستقيم بين الوحدات","Straight-line sequence between units"))}: ${Math.round(f.len)} m]]></description>
      <LineString><tessellate>1</tessellate><coordinates>${f.pts.map(q=>`${q.lon},${q.lat},0`).join(" ")}</coordinates></LineString></Placemark>`}
    ${f.pts.map(q=>kPlacemark("f"+i, uDet(p,q), q, hx(f.color), q.id+(q.hasTR?" + "+q.tr:""))).join("\n    ")}
  </Folder>`).join("");
  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>
  <name>${KX(p.name)} — ${KX(p.wo)}</name>
  <description><![CDATA[${KX(p.site||"")} · ${KX(T("المقاول","Contractor"))}: ${KX((CONTRACTORS[p.contractor]||""))} · WGS84 / UTM ${pts[0]?pts[0].zone:38}N]]></description>
  <open>1</open>${styles}${folders}
</Document>
</kml>`;
};

/* ── KML المجمّع لكل أوامر العمل ── */
kmlAllDoc = function(){
  const gs=gaSelected();
  const styles = gs.map((g,i)=>`  <Style id="gl${i}"><LineStyle><color>${KCOL(g.hex)}</color><width>4</width></LineStyle></Style>`+kStyles("g"+i, g.hex)).join("");
  const folders = gs.map((g,i)=>{
    const p=S.projects[g.i]||S.projects.find(z=>z.id===g.id)||P();
    return `
  <Folder><name>${KX(T("أمر عمل ","W/O ")+(g.wo||"—")+" — "+g.name)}</name><open>0</open>
    <description><![CDATA[${KX(g.site||"")} · ${KX(T("المقاول","Contractor"))}: ${KX(CONTRACTORS[p.contractor]||"")} · ${g.n} ${KX(T("نقطة","points"))} · ${KX(T("مسار","route"))} ${Math.round(g.route)} m]]></description>
    ${g.chain.length>1?`<Placemark><name>${KX((g.wo||g.name)+" — "+T("المسار","route"))}</name><styleUrl>#gl${i}</styleUrl>
      <LineString><tessellate>1</tessellate><coordinates>${g.chain.map(q=>`${q.lon},${q.lat},0`).join(" ")}</coordinates></LineString></Placemark>`:""}
    ${g.pts.map(q=>kPlacemark("g"+i, uDet(p,q), q, g.hex, gaLabel(g,q))).join("\n    ")}
  </Folder>`;
  }).join("");
  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2"><Document>
  <name>${KX(T("تجميع مشاريع ","Portfolio — ")+(CONTRACTORS[P().contractor]||""))}</name>
  <description><![CDATA[${gs.length} ${KX(T("مشروع","projects"))} · ${gs.reduce((s,g)=>s+g.n,0)} ${KX(T("نقطة بإحداثيات","geo points"))} · WGS84]]></description>
  <open>1</open>${styles}${folders}
</Document></kml>`;
};

/* ══════════ خريطة التجميع: رموز تفاعلية ══════════ */
gaMount = async function(){
  const host=$("gaMap"); if(!host) return;
  const gs=gaSelected();
  if(!gs.length){ host.innerHTML=`<div style="position:absolute;inset:0;display:grid;place-items:center;color:#cfe0db;font-size:13px;text-align:center;padding:22px">${T("لا توجد إحداثيات في المشاريع المحددة","No coordinates in the selected projects")}</div>`; return; }
  if(!STANDALONE){
    host.innerHTML=`<div style="position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#cfe0db;font-size:13px;line-height:1.9">
      ${T("معاينة القمر الصناعي تعمل في نسخة التطبيق على جهازك.<br>هنا نزّل KML المجمّع — الضغط على رمز أي معدة يعرض كل تفاصيلها واسم المقاول.","Satellite preview works in the desktop copy.<br>Here, download the combined KML — clicking any equipment symbol shows its full detail and the contractor name.")}</div>`;
    return;
  }
  try{
    const L=await loadLeaflet(); if(!$("gaMap")) return;
    host.innerHTML=""; const div=document.createElement("div"); div.style.cssText="position:absolute;inset:0"; host.appendChild(div);
    const map=L.map(div,{zoomControl:true, attributionControl:true});
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {maxZoom:20, maxNativeZoom:19, attribution:"Imagery © Esri"}).addTo(map);
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}",
      {maxZoom:20, maxNativeZoom:19, opacity:.7}).addTo(map);
    const box=[], reg={};
    gs.forEach(g=>{
      const p=S.projects[g.i]||S.projects.find(z=>z.id===g.id)||P();
      if(g.chain.length>1) L.polyline(g.chain.map(q=>[q.lat,q.lon]),{color:"#"+g.hex,weight:3.5,dashArray:"8 5",opacity:.95}).addTo(map);
      g.pts.forEach(q=>{
        box.push([q.lat,q.lon]);
        const key=g.id+"|"+q.id;
        const m=L.marker([q.lat,q.lon],{icon:mkIcon(L,q,"#"+g.hex,false),riseOnHover:true,title:(g.wo?g.wo+" · ":"")+q.id}).addTo(map);
        m.bindTooltip(`<span class="glab">${esc(gaLabel(g,q))}</span>`,{permanent:true,direction:"right",offset:[13,0],opacity:1,className:"gtt"});
        m.bindPopup(popHTML(uDet(p,q), "#"+g.hex), {maxWidth:340, minWidth:322, autoPan:true, autoPanPadding:[22,30], keepInView:true});
        m.on("popupopen",()=>{ GA.pt=key; mkSync(reg,key); });
        m.on("popupclose",()=>{ if(GA.pt===key){ GA.pt=null; mkSync(reg,null); } });
        reg[key]=m;
      });
    });
    map.fitBounds(L.latLngBounds(box).pad(0.12));
    GA.map=map; GA.reg=reg;
  }catch(e){
    host.innerHTML=`<div style="position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:#cfe0db;font-size:13px">${T("تعذّر تحميل صور الأقمار الصناعية — تحقق من الإنترنت.","Could not load satellite imagery — check the connection.")}</div>`;
  }
};
</script>

<script>
"use strict";
/* ═══════════ دفتر المقاولين ═══════════ */
const FIRM_HEX = ["49b9a4","e0ab55","8fb3ff","e58076","b08ee8","5fc27e","d99ac0","9fb7c9","cbb26a","7fd0c4"];
const fHex = i => "#"+FIRM_HEX[i%FIRM_HEX.length];
function fInitials(name){
  const w=String(name||"").replace(/[^\p{L}\p{N} ]/gu," ").trim().split(/\s+/).filter(Boolean);
  if(!w.length) return "??";
  if(/[A-Za-z]/.test(w[0])) return (w[0][0]+(w[1]?w[1][0]:"")).toUpperCase();
  return (w[0].slice(0,2)+(w[1]?" "+w[1].slice(0,1):"")).trim();
}
/* استرجاع دفتر المقاولين المحفوظ + حفظه مع باقي البيانات */
(function(){
  if(Array.isArray(S.contractors) && S.contractors.length){
    CONTRACTORS.length=0; S.contractors.forEach(c=>CONTRACTORS.push(String(c)));
  }
  S.contractors = CONTRACTORS.slice();
  S.projects.forEach(p=>{ p.contractor = Math.min(Math.max(+p.contractor||0,0), CONTRACTORS.length-1); });
})();
save = function(){
  try{ S.contractors = CONTRACTORS.slice();
    localStorage.setItem(LS, JSON.stringify({lang:S.lang, page:S.page, projects:S.projects,
      active:S.active, contractors:S.contractors}));
  }catch(e){}
};

/* ── نوافذ صغيرة: إدخال نص / تأكيد ── */
function askText(title, val, ph, cb){
  const w=document.createElement("div"); w.className="askwrap"; w.setAttribute("role","dialog");
  w.innerHTML=`<div class="askbox"><h4>${esc(title)}</h4>
    <input type="text" id="askIn" value="${esc(val||"")}" placeholder="${esc(ph||"")}" autocomplete="off">
    <div class="askbtns"><button class="btn sm" id="askNo">${T("إلغاء","Cancel")}</button>
      <button class="btn sm pri" id="askYes">${T("حفظ","Save")}</button></div></div>`;
  document.body.appendChild(w);
  const inp=w.querySelector("#askIn"), close=()=>w.remove();
  setTimeout(()=>{ inp.focus(); inp.select(); },30);
  w.querySelector("#askNo").onclick=close;
  w.querySelector("#askYes").onclick=()=>{ const v=inp.value.trim(); if(!v){ inp.focus(); return; } close(); cb(v); };
  inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); w.querySelector("#askYes").click(); } if(e.key==="Escape") close(); };
  w.onclick=e=>{ if(e.target===w) close(); };
}
function askOk(title, msg, cb, okLabel){
  const w=document.createElement("div"); w.className="askwrap"; w.setAttribute("role","dialog");
  w.innerHTML=`<div class="askbox"><h4>${esc(title)}</h4><p>${msg}</p>
    <div class="askbtns"><button class="btn sm" id="askNo">${T("إلغاء","Cancel")}</button>
      <button class="btn sm pri" id="askYes">${esc(okLabel||T("تأكيد","Confirm"))}</button></div></div>`;
  document.body.appendChild(w);
  const close=()=>w.remove();
  w.querySelector("#askNo").onclick=close;
  w.querySelector("#askYes").onclick=()=>{ close(); cb(); };
  w.onclick=e=>{ if(e.target===w) close(); };
  document.addEventListener("keydown", function k(e){ if(e.key==="Escape"){ close(); document.removeEventListener("keydown",k); } });
}

/* ── عمليات دفتر المقاولين ── */
const CF = () => Math.min(+((P()||{}).contractor)||0, CONTRACTORS.length-1);
const firmProjects = i => S.projects.map((p,ix)=>({p,ix})).filter(o=>(+o.p.contractor||0)===i);
function firmAdd(){
  askText(T("اسم المقاول الجديد","New contractor name"), "", T("مثال: مؤسسة … للمقاولات الكهربائية","e.g. … Electrical Contracting Est."), name=>{
    if(CONTRACTORS.some(c=>c.trim()===name)){ toast(T("هذا المقاول مسجّل بالفعل","This contractor already exists")); return; }
    CONTRACTORS.push(name); save();
    const i=CONTRACTORS.length-1;
    askOk(T("إنشاء أول مشروع","Create the first project"),
      T(`تمت إضافة <b>${esc(name)}</b>. هل تنشئ له مشروعًا جديدًا الآن؟`,

/* ── إحصاءات المشروع والمقاول ── */
function projStats(p){
  const t=totals(p); let plan=0, exec=0;
  WORKS.forEach(x=>{ const b=p.boq[x.c]||{}; plan+=(b.plan||0)*x.p; exec+=(b.exec||0)*x.p; });
  let iss=0, req=0;
  MATERIALS.forEach(x=>{ const m=p.mat[x.c]||{}; iss+=(m.iss||0)*x.p; req+=(m.req||0)*x.p; });
  const est=(p.estCost.mat||0)+(p.estCost.inst||0)+(p.estCost.ind||0);
  const rm=(p.rmus||[]);
  return {t, plan, exec, iss, req, est, pts:geoPoints(p).length, rmus:rm.length,
          set:rm.filter(r=>r.set).length, files:(p.files||[]).length, derived:!!p.derived,
          varPct: plan? (exec-plan)/plan*100 : 0};
}
function firmStats(i){
  const ps=firmProjects(i).map(o=>projStats(o.p));
  const sum=k=>ps.reduce((s,x)=>s+(x[k]||0),0);
  return {n:ps.length, est:sum("est"), plan:sum("plan"), exec:sum("exec"), iss:sum("iss"),
          pts:sum("pts"), rmus:sum("rmus"), set:sum("set"), files:sum("files"),
          derived:ps.filter(x=>x.derived).length,
          rmu:ps.reduce((s,x)=>s+(x.t.rmuNew||0),0), tr:ps.reduce((s,x)=>s+(x.t.trTot||0),0),
          mv:ps.reduce((s,x)=>s+(x.t.htCable||0),0)};
}

          `Project <b>${esc(pr.name)}</b> (W/O ${esc(pr.wo||"—")}) and all of its data will be permanently deleted.`),
        ()=>{ S.projects.splice(ix,1); if(S.active>=S.projects.length) S.active=S.projects.length-1;

<script>
"use strict";

const AIQ = {turns:[], busy:false, ctl:null, scope:"all"};

/* ملخّص مشروع للسياق */
function aiProjBrief(p, full){
  const s=projStats(p), t=s.t, pts=geoPoints(p), fs=feeders(pts).filter(f=>!f.noRoute);
  const b={
    المشروع:p.name, أمر_العمل:p.wo||"—", المقاول:CONTRACTORS[+p.contractor||0]||"—",
    الموقع:p.site||"—", الإدارة:p.admin, القطاع:p.sector, تاريخ_الاعتماد:p.approvedDate||"—",
    عدد_اللوحات:p.sheets.length, مرفقات:s.files,
    معدات:{RMU_3W:t.rmu3w, RMU_4W:t.rmu4w, محطات_وحدة:t.trTot, لوحات_توزيع:t.pillars, RMU_قائمة:t.rmuEx},
    كابلات_م:{ج_متوسط_3x400:t.htCable, "4x300":t.lt300, "4x185":t.lt185, "4x70":t.lt70, أحادي_50:t.mvSingle, نحاس_تأريض:t.htEarth},
    حفريات_م:{مسفلت:t.asHT1+t.asHT2+t.asHT3+t.asLT13, رملي:t.saHT1+t.saHT2+t.saHT3+t.saHT4+t.saLT13},
    سفلتة_م2:{إعادة:t.asphalt, كشط:t.milling}, ثقب_أفقي_م:t.hdd,
    إزالة_هوائي:{أعمدة_حديد:t.poleSteel, أعمدة_خشب:t.poleWood, محولات:t.trPole1+t.trPole2, موصلات_م:t.condMV, معزول_م:t.abcLV},
    التكلفة_ريال:{تقديرية:Math.round(s.est), مقايسة_مخططة:Math.round(s.plan), منفّذ_أجور:Math.round(s.exec),
      مواد_مصروفة:Math.round(s.iss), مواد_مطلوبة:Math.round(s.req), انحراف_نسبة:+s.varPct.toFixed(1)},
    الحماية:{وحدات_بالجدول:s.rmus, مضبوطة:s.set, بدون_ضبط:s.rmus-s.set},
    الإحداثيات:{نقاط:pts.length, مغذيات:fs.length, طول_المسار_م:Math.round(fs.reduce((a,f)=>a+f.len,0))},
    حالة_الحصر:s.derived?"مُستنبَط":"لم يُستنبط بعد"
  };
  if(!full) return b;
  const top=WORKS.map(w=>{const x=p.boq[w.c]||{}; const dq=(+x.exec||0)-(+x.plan||0); return {بند:w.ar.slice(0,46), كود:w.c, فرق_كمية:+dq.toFixed(1), فرق_ريال:Math.round(dq*w.p)};})
    .filter(o=>o.فرق_ريال).sort((a,b)=>Math.abs(b.فرق_ريال)-Math.abs(a.فرق_ريال)).slice(0,12);
  const gaps=MATERIALS.map(m=>{const x=p.mat[m.c]||{}; const g=(+x.req||0)-(+x.iss||0); return {مادة:m.ar.slice(0,44), كود:m.c, عجز:+g.toFixed(1), قيمة:Math.round(g*m.p)};})
    .filter(o=>o.عجز).sort((a,b)=>Math.abs(b.قيمة)-Math.abs(a.قيمة)).slice(0,12);
  b.أكبر_فروق_المقايسة=top; b.فروق_المواد=gaps;

  b.مرفقات_مرفوعة=(p.files||[]).map(f=>f.name).slice(0,30);
  return b;
}

      return {الاسم:c, مشاريع:st.n, محصورة:st.derived, RMU:st.rmu, محطات:st.tr,
              كابل_ج_متوسط_م:Math.round(st.mv), نقاط_إحداثيات:st.pts,

  };

    ctx.باقي_المشاريع=S.projects.filter(p=>p!==cur).map(p=>aiProjBrief(p,false));

}
const AI_SYS =
`أنت "محفظة Ai": مستشار تخطيط ومهندس حصر كميات أول بالشركة السعودية للكهرباء، متخصص في مشاريع تحويل الشبكات الهوائية إلى أرضية والعقد الموحد وأسعار 2023، وتعمل داخل منصة "محفظة مشاريع المقاول".
تجيب عن أسئلة المستخدم اعتمادًا على بيانات المحفظة المرفقة فقط (المقاولون، المشاريع، الحصر، المقايسة، المواد، الحماية، الإحداثيات، المرفقات).
قواعد الإجابة:
• اكتب بالعربية بلغة هندسية دقيقة ومختصرة، إلا إذا سأل المستخدم بالإنجليزية فأجب بالإنجليزية.

• استشهد بالأرقام من البيانات المرفقة حرفيًا، ولا تخترع رقمًا غير موجود.
• إذا كانت البيانات ناقصة، قل تحديدًا أي ملف أو حقل ينقص وأين يُرفع في المنصة (الصفحة الماستر، الحصر الشامل، المقايسة، الأجور، الفاتورة، النماذج، الخريطة).
• عند وجود فرق أو انحراف، اذكر السبب الهندسي المحتمل والإجراء المطلوب قبل الفاتورة أو الاستلام.
• استخدم **نص عريض** للعناوين الفرعية و - للنقاط. لا تستخدم جداول ماركداون.
• لا تزد عن 300 كلمة إلا إذا طُلب تقرير مفصّل.`;

const AI_CHIPS = () => [
  T("ما أهم الملاحظات على حصر المشروع النشط قبل رفع الفاتورة؟","Key takeoff issues before invoicing?"),
  T("قارن بين المقاولين من حيث الانحراف والإنجاز","Compare contractors by variance and progress"),
  T("ما المستندات والنماذج الناقصة لإتمام الاستلام النهائي؟","Which documents are missing for final acceptance?"),
  T("لماذا تختلف المواد المصروفة عن المركّبة؟ وما المطلوب؟","Why do issued vs installed materials differ?"),
  T("راجع الحفريات والسفلتة مقابل أطوال الكابلات","Check excavation & asphalt against cable lengths"),
  T("اكتب ملخصًا تنفيذيًا للاستشاري عن المشروع النشط","Write an executive summary for the consultant"),
  T("ما الوحدات التي بلا ضبط حماية وما أثر ذلك؟","Which units lack protection settings and why it matters?"),

];

/* ماركداون مبسّط آمن */
function mdLite(s){
  let h=esc(String(s||""));
  h=h.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/__([^_]+)__/g,"<b>$1</b>");
  h=h.replace(/^###?\s+(.+)$/gm,"<h5>$1</h5>");
  h=h.replace(/(?:^[-•]\s+.+\n?)+/gm, m=>"<ul>"+m.trim().split(/\n/).map(l=>"<li>"+l.replace(/^[-•]\s+/,"")+"</li>").join("")+"</ul>");
  return h;
}
function aiRow(role, html, idx){
  return `<div class="aimsg ${role==="user"?"u":"a"}" data-aix="${idx}">
    <span class="who">${role==="user"?T("أنت","You"):"محفظة Ai"}</span>
    <div class="bb">${html}</div>
    ${role==="user"?"":`<div class="tools noprint"><button data-aicopy="${idx}">${T("نسخ","Copy")}</button></div>`}</div>`;
}
function aiRender(){
  const b=$("aiBody"); if(!b) return;
  if(!AIQ.turns.length){
    b.innerHTML=`<div class="aiempty">
      <b>${T("اسأل محفظة Ai عن أي شيء في مشاريعك","Ask Portfolio Ai anything about your projects")}</b><br>
      ${T("الحصر، المقايسة، المواد، الأجور، ضبط الحماية، الإحداثيات، النماذج الناقصة، والمقارنة بين المقاولين — كلها متاحة للمساعد.","Takeoff, BOQ, materials, wages, protection settings, coordinates, missing forms and contractor comparison are all in its context.")}</div>`;
  } else {
    b.innerHTML=AIQ.turns.map((t,i)=>aiRow(t.role, t.role==="user"?esc(t.content):mdLite(t.content), i)).join("");
    b.querySelectorAll("[data-aicopy]").forEach(x=>x.onclick=()=>{
      navigator.clipboard.writeText(AIQ.turns[+x.dataset.aicopy].content).then(
        ()=>toast(T("تم نسخ الإجابة","Answer copied")), ()=>toast(T("تعذّر النسخ","Copy failed")));
    });
  }
  b.scrollTop=b.scrollHeight;
  const send=$("aiSend"); if(send){ send.disabled=AIQ.busy; send.textContent=AIQ.busy?T("…جارٍ","…"):T("إرسال","Send"); }
  const st=$("aiStop"); if(st) st.hidden=!AIQ.busy;
}
async function aiSend(q){
  const text=String(q||"").trim(); if(!text||AIQ.busy) return;
  const s=await aiGet();
  AIQ.turns.push({role:"user", content:text});
  if(!s){
    AIQ.turns.push({role:"assistant", content:T(
      "**المساعد الذكي غير متاح في هذه النسخة.**\n- يعمل «محفظة Ai» في نسخة المنصة المنشورة على claude.ai، حيث يُطلب إذنك عند أول سؤال.\n- النسخة المحفوظة على جهازك تعمل بالكامل بدون إنترنت، لكن بدون المساعد الذكي.\n- كل الحسابات والتقارير والمقارنات في المنصة تعمل في النسختين.",
      "**The AI assistant is not available in this copy.**\n- Portfolio Ai runs in the published claude.ai copy, where you are asked for consent on the first question.\n- The offline copy on your device works fully without internet, but without the assistant.\n- All calculations, reports and comparisons work in both copies.")});
    aiRender(); return;
  }
  AIQ.busy=true; AIQ.ctl=new AbortController();
  AIQ.turns.push({role:"assistant", content:T("…يحلل بيانات المحفظة","…analysing the portfolio")});
  aiRender();
  const ix=AIQ.turns.length-1;
  const hist=AIQ.turns.slice(0,-1).filter(t=>t.content).map(t=>({role:t.role, content:t.content}));
  hist[0]={role:"user", content:AI_SYS+"\n\nبيانات المحفظة (JSON):\n"+JSON.stringify(aiContext())+"\n\nسؤال المستخدم: "+hist[0].content};
  try{
    const r=await s(hist, {modelTier:"default", signal:AIQ.ctl.signal,
      onText:({text})=>{ AIQ.turns[ix].content=text; aiRender(); }});
    AIQ.turns[ix].content=(r&&r.text)||AIQ.turns[ix].content;
  }catch(e){
    AIQ.turns[ix].content = (e&&e.text) || ("**"+aiErr(e)+"**");
  }
  AIQ.busy=false; AIQ.ctl=null; aiRender();
}
function aiHTML(){
  return `<div class="aipane" role="dialog" aria-modal="true" aria-label="محفظة Ai">
    <div class="aihd">
      <div class="mk">✦</div>
      <div style="min-width:0"><div class="t">${T("محفظة Ai","Portfolio Ai")}</div>
        <div class="s">${T("مساعد ذكي يقرأ كل بيانات محفظتك ويجيب عنها","An assistant that reads your whole portfolio and answers about it")}</div></div>

      <button class="btn sm gh" id="aiClear">${T("محادثة جديدة","New chat")}</button>

    </div>
    <div class="aiscope">
      <label><input type="radio" name="aisc" value="all" ${AIQ.scope==="all"?"checked":""}>${T("كل المحفظة","Whole portfolio")}</label>
      <label><input type="radio" name="aisc" value="one" ${AIQ.scope==="one"?"checked":""}>${T("المشروع النشط فقط","Active project only")}</label>
      <span class="s" style="font-size:11px;color:var(--ink-3);align-self:center">${nf(S.projects.length)} ${T("مشروع","projects")} · ${nf(CONTRACTORS.length)} ${T("مقاول","contractors")}</span>
    </div>
    <div class="aibody" id="aiBody"></div>
    <div class="aichips" id="aiChips">${AI_CHIPS().map(c=>`<button data-aiq="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="aifoot">
      <textarea id="aiIn" rows="1" placeholder="${T("اكتب سؤالك عن المشاريع، الحصر، المواد، الأجور، النماذج…","Ask about projects, takeoff, materials, wages, forms…")}"></textarea>
      <button class="btn sm gh" id="aiStop" hidden>${T("إيقاف","Stop")}</button>
      <button class="btn pri" id="aiSend">${T("إرسال","Send")}</button>
    </div></div>`;
}
function aiOpen(){
  const w=$("aiWrap"); if(!w) return;
  w.innerHTML=aiHTML(); w.hidden=false; document.body.style.overflow="hidden";
  aiRender();
  const on=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  on("aiClose", aiClose);
  on("aiClear", ()=>{ if(AIQ.ctl) AIQ.ctl.abort(); AIQ.turns=[]; AIQ.busy=false; aiRender(); });
  on("aiStop", ()=>{ if(AIQ.ctl) AIQ.ctl.abort(); });
  on("aiSend", ()=>{ const i=$("aiIn"); const v=i.value; i.value=""; i.style.height="auto"; aiSend(v); });
  const inp=$("aiIn");
  inp.oninput=()=>{ inp.style.height="auto"; inp.style.height=Math.min(inp.scrollHeight,130)+"px"; };
  inp.onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); $("aiSend").click(); } };
  w.querySelectorAll("[data-aiq]").forEach(b=>b.onclick=()=>aiSend(b.dataset.aiq));
  w.querySelectorAll("input[name=aisc]").forEach(r=>r.onchange=()=>{ AIQ.scope=r.value; });
  w.onclick=e=>{ if(e.target===w) aiClose(); };
  setTimeout(()=>{ const i=$("aiIn"); if(i) i.focus(); },60);
}
function aiClose(){ const w=$("aiWrap"); if(!w) return; if(AIQ.ctl) AIQ.ctl.abort(); w.hidden=true; w.innerHTML=""; document.body.style.overflow=""; }

/* ── الزر العائم + زر الشريط الجانبي ── */
(function(){
  if(!$("aiWrap")){
    const d=document.createElement("div"); d.className="aiwrap"; d.id="aiWrap"; d.hidden=true;
    document.body.appendChild(d);
  }
  if(!$("aiFab")){
    const b=document.createElement("button");
    b.className="aifab noprint"; b.id="aiFab"; b.type="button";
    b.innerHTML=`<span class="sp">✦</span><span id="aiFabT">${T("محفظة Ai","Portfolio Ai")}</span>`;
    b.onclick=aiOpen; document.body.appendChild(b);
  }
  const host=$("btnMap");
  if(host && !$("btnAiAsk")){
    const b=document.createElement("button");
    b.className="btn big noprint"; b.id="btnAiAsk"; b.type="button";
    b.textContent="✦  "+T("محفظة Ai — اسأل عن مشاريعك","Portfolio Ai — ask about your projects");
    b.onclick=aiOpen; host.insertAdjacentElement("afterend", b);
  }
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("aiWrap").hidden) aiClose(); });

  const _r = render;
  render = function(){
    _r();
    const t=$("aiFabT"); if(t) t.textContent=T("محفظة Ai","Portfolio Ai");
    const b=$("btnAiAsk"); if(b) b.textContent="✦  "+T("محفظة Ai — اسأل عن مشاريعك","Portfolio Ai — ask about your projects");

})();

.frmscope{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);
  background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:5px 9px;line-height:1.45}

<script>
"use strict";
/* ═══════════ عزل كامل بين مشاريع المقاولين ═══════════
   قائمة المشاريع لا تعرض إلا مشاريع المقاول المختار — لا تداخل إطلاقًا. */

/* تصحيح أي فهرس مقاول خارج النطاق (بعد استرجاع نسخة احتياطية مثلًا) */
function firmGuard(){
  const max=CONTRACTORS.length-1;
  S.projects.forEach(p=>{ const c=+p.contractor; p.contractor = (isFinite(c)&&c>=0&&c<=max)?c:0; });
}

/* الانتقال لمقاول: يعرض مشاريعه فقط — وإن لم تكن له مشاريع يعرض إنشاء أول مشروع */
firmGo = function(i){
  firmGuard();
  const list=firmProjects(i);
  GA.sel=null;                                   // إعادة ضبط تحديد خريطة التجميع على المقاول الجديد
  if(list.length){ S.active=list[0].ix; save(); render(); toast(T("عرض مشاريع: ","Showing projects of: ")+CONTRACTORS[i]); return; }
  askOk(T("لا توجد مشاريع لهذا المقاول","No projects for this contractor"),
    T(`المقاول <b>${esc(CONTRACTORS[i])}</b> ليس له أي مشروع بعد. هل تنشئ له مشروعًا الآن؟<br>
       <span style="color:var(--ink-3);font-size:11.5px">لن تُعرض مشاريع مقاول آخر تحت اسمه.</span>`,
      `<b>${esc(CONTRACTORS[i])}</b> has no projects yet. Create one now?<br>
       <span style="color:var(--ink-3);font-size:11.5px">No other contractor's projects are ever listed under this name.</span>`),
    ()=>firmNewProject(i), T("إنشاء مشروع","Create project"));
  S.page="firms"; save(); render();
};

/* نقل مشروع: يبقى العرض على المقاول الحالي ولا يتسرّب المشروع المنقول */
firmMove = function(ix, to){
  const was = S.active===ix, from=+S.projects[ix].contractor||0;
  S.projects[ix].contractor=+to;
  if(was && from!==+to){
    const rest=firmProjects(from);
    if(rest.length) S.active=rest[0].ix; else S.active=ix;   // إن فرغ المقاول، تابع المشروع لمقاوله الجديد
  }
  GA.sel=null; save(); render();
  toast(T("تم نقل المشروع إلى ","Project moved to ")+CONTRACTORS[+to]);
};

/* حذف المشروع من الشريط الجانبي: يبقى التحديد داخل مشاريع نفس المقاول */
$("btnDelProject").onclick = () => {
  if(S.projects.length<=1){ toast(T("لا يمكن حذف المشروع الوحيد","Cannot delete the only project")); return; }
  const ix=S.active, f=+S.projects[ix].contractor||0, nm=S.projects[ix].name;
  askOk(T("حذف المشروع","Delete project"),
    T(`سيُحذف مشروع <b>${esc(nm)}</b> بكل بياناته ومرفقاته نهائيًا.`,
      `Project <b>${esc(nm)}</b> and all of its data will be permanently deleted.`),
    ()=>{
      S.projects.splice(ix,1);
      const mine=firmProjects(f);
      S.active = mine.length ? mine[0].ix : 0;
      GA.sel=null; save(); render(); toast(T("تم حذف المشروع","Project deleted"));
    }, T("حذف نهائي","Delete"));
};

/* ── الشريط الجانبي: مشاريع المقاول المختار فقط ── */
renderRail = function(){
  firmGuard();
  const cur=CF(), p=P(), mine=firmProjects(cur);

  $("selContractor").innerHTML = CONTRACTORS.map((c,i)=>{
    const n=firmProjects(i).length;
    return `<option value="${i}">${esc(c)} — ${n} ${AR()?"مشروع":"proj."}</option>`;
  }).join("");
  $("selContractor").value = cur;

  /* لا توجد مجموعة «مقاولون آخرون» — عزل تام */
  $("selProject").innerHTML = mine.length
    ? mine.map(o=>`<option value="${o.ix}">${esc(o.p.name)}${o.p.wo?" — "+esc(o.p.wo):""}</option>`).join("")
    : `<option value="${S.active}" disabled selected>${T("لا توجد مشاريع لهذا المقاول","No projects for this contractor")}</option>`;
  if(mine.length) $("selProject").value = S.active;

  const sc=$("frmScope");
  const box=sc||document.createElement("div");
  box.className="frmscope noprint"; box.id="frmScope";
  box.innerHTML=`<i style="background:${fHex(cur)}"></i><span>${T("تُعرض مشاريع","Showing")}
    <b>${esc(CONTRACTORS[cur]||"—")}</b> ${T("فقط","only")} — ${nf(mine.length)} ${T("مشروع","project(s)")}</span>`;
  if(!sc) $("projTags").insertAdjacentElement("beforebegin", box);

  $("nav").innerHTML = PAGES.map((pg,i)=>`<button data-page="${pg.id}" aria-current="${S.page===pg.id}">
      <span class="ix">${i===0?"◎":String(i).padStart(2,"0")}</span><span>${esc(T(pg.ar,pg.en))}</span></button>`).join("");
  $("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.page=b.dataset.page;save();render();$("rail").classList.remove("open");});

  $("projTags").innerHTML =
    `<span class="pill" style="background:${fHex(cur)}33;color:var(--ink)">${esc(CONTRACTORS[cur]||"—")}</span>
     <span class="pill">${esc(p.admin)}</span><span class="pill">${esc(T("قطاع "+p.sector,p.sector))}</span>
     <span class="pill ${p.derived?"ok":"warn"}">${p.derived?T("محصور","Derived"):T("بانتظار الحصر","Pending")}</span>`;
  $("woPill").textContent = T("أمر عمل ","W/O ")+(p.wo||"—");
  $("deriveState").textContent = p.derived
    ? T("آخر تشغيل: ","Last run: ")+new Date(p.derived.at).toLocaleString(AR()?"ar-EG":"en-GB",{dateStyle:"short",timeStyle:"short"})
    : T("لم يُشغّل بعد","Not run yet");
  const pg = PAGES.find(x=>x.id===S.page)||PAGES[0];
  $("pageTitle").textContent = T(pg.ar,pg.en);
  $("pageCrumb").textContent = (CONTRACTORS[cur]?CONTRACTORS[cur]+" · ":"") + p.name + (p.site?" · "+p.site:"");

  const on=(id,fn)=>{ const el=$(id); if(el) el.onclick=fn; };
  on("btnAddFirm", firmAdd);
  on("btnRenFirm", ()=>firmRename(CF()));
  on("btnDelFirm", ()=>firmDelete(CF()));
  on("btnFirmsPage", ()=>{ S.page="firms"; save(); render(); });
  const bf=$("firmBtns");
  if(bf){ bf.children[0].textContent=T("+ مقاول","+ Firm");
          bf.children[1].textContent=T("تعديل","Rename");
          bf.children[2].textContent=T("حذف","Delete"); }
  const bp=$("btnFirmsPage"); if(bp) bp.textContent=T("دفتر المقاولين والمشاريع ↗","Contractor register ↗");
  $("selContractor").onchange = e => firmGo(+e.target.value);
  $("selProject").onchange = e => {
    const ix=+e.target.value, pr=S.projects[ix];
    if(!pr || (+pr.contractor||0)!==CF()){ render(); return; }   // حارس: لا انتقال لمشروع مقاول آخر
    S.active=ix; save(); render();
  };
};

/* ── خريطة التجميع: تبدأ على مشاريع المقاول المختار ── */
gaSelected = function(){
  const all=allProjPts(), f=CF();
  const own=g=>(+((S.projects[g.i]||{}).contractor)||0)===f;
  if(!GA.sel) GA.sel = Object.fromEntries(all.map(g=>[g.id, g.n>0 && own(g)]));
  all.forEach(g=>{ if(GA.sel[g.id]===undefined) GA.sel[g.id] = g.n>0 && own(g); });
  return all.filter(g=>g.n && GA.sel[g.id]);
};

/* ── محفظة Ai: النطاق الافتراضي = مشاريع المقاول المختار ── */
AIQ.scope = "firm";
aiContext = function(){
  const cur=P(), f=CF(), sc=AIQ.scope;
  const firms = sc==="all" ? CONTRACTORS.map((c,i)=>i) : [f];
  const ctx={
    المنصة:"محفظة مشاريع المقاول — حصر وإدارة مشاريع تحويل الشبكات الهوائية إلى أرضية بالشركة السعودية للكهرباء",
    نطاق_السؤال: sc==="all" ? "كل المقاولين في المحفظة"
                : sc==="one" ? ("المشروع النشط فقط: "+cur.name)
                : ("مشاريع المقاول المختار فقط: "+(CONTRACTORS[f]||"")),
    المقاولون: firms.map(i=>{ const st=firmStats(i);
      return {الاسم:CONTRACTORS[i], مشاريع:st.n, محصورة:st.derived, RMU:st.rmu, محطات:st.tr,
              كابل_ج_متوسط_م:Math.round(st.mv), نقاط_إحداثيات:st.pts,
              تقديرية:Math.round(st.est), منفّذ:Math.round(st.exec)}; }),
    المشروع_النشط: aiProjBrief(cur,true)
  };
  if(sc!=="one"){
    const pool = sc==="all" ? S.projects : firmProjects(f).map(o=>o.p);
    const rest = pool.filter(p=>p!==cur);
    if(rest.length) ctx.باقي_المشاريع = rest.map(p=>aiProjBrief(p,false));
  }
  return ctx;
};
(function(){
  const _h = aiHTML;
  aiHTML = function(){
    const f=CF(), n=firmProjects(f).length;
    return _h().replace(/<div class="aiscope">[\s\S]*?<\/div>\s*<div class="aibody"/,
      `<div class="aiscope">
        <label><input type="radio" name="aisc" value="firm" ${AIQ.scope==="firm"?"checked":""}>${T("مشاريع هذا المقاول","This contractor")} (${nf(n)})</label>
        <label><input type="radio" name="aisc" value="one" ${AIQ.scope==="one"?"checked":""}>${T("المشروع النشط فقط","Active project only")}</label>
        <label><input type="radio" name="aisc" value="all" ${AIQ.scope==="all"?"checked":""}>${T("كل المقاولين","All contractors")}</label>
      </div>
      <div class="aibody"`);
  };
})();

/* ── حارس عام عند كل عرض: المشروع النشط يتبع المقاول المختار دائمًا ── */
(function(){
  const _r = render;
  render = function(){
    firmGuard();
    const f=+((P()||{}).contractor)||0, mine=firmProjects(f);
    if(mine.length && !mine.some(o=>o.ix===S.active)) S.active=mine[0].ix;
    _r();
  };
  render();
})();
</script>
<style>
